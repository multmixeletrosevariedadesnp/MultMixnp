 padrao:{n:'Padrão (azul MultMix)'},

function temaAuto(){
  const d=new Date(),y=d.getFullYear(),bf=new Date(y,10,30);while(bf.getDay()!==5)bf.setDate(bf.getDate()-1);

function put(t,row,q){ // grava local + fila
  row.updated_at=now();
  const i=db[t].findIndex(r=>r.id===row.id);
  i<0?db[t].push(row):db[t][i]=row;
  if(sb)db.outbox.push({t,row});
  save();if(!q)sync();
}
let syncP=Promise.resolve();
function sync(){return syncP=syncP.then(doSync,doSync)}
async function doSync(){
  if(!sb)return setSync('modo demo (local)');
  try{
    if(role){
      while(db.outbox.length){
        const t=db.outbox[0].t;let n=0;while(n<100&&db.outbox[n]&&db.outbox[n].t===t)n++;
        const rows=[...new Map(db.outbox.slice(0,n).map(o=>[o.row.id,o.row])).values()];
        const{error}=await sb.from(t).upsert(rows);if(error)throw error;db.outbox.splice(0,n);save();}
    }
    for(const t of role?T:['products','company']){
      if(t==='payables'&&role!=='admin')continue; // contas a pagar: só administrador
      const{data,error}=await sb.from(t).select('*');
      if(error){if(t==='payables')continue;throw error} // se a tabela ainda não existir, não trava o resto
      if(!db.outbox.length)db[t]=data;
    }
    save();setSync('sincronizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){setSync('offline · '+db.outbox.length+' pendente(s)')}
  render();
  try{notifCheck()}catch(e){}
}
const setSync=t=>$('#sync').textContent=t;

/* ========= Comissões ========= */
let comMonth='',comSel='todos';
function comRows(m,sel){
  const out=[],cn=id=>(db.customers.find(c=>c.id===id)||{}).name||'Balcão';
  db.sales.filter(s=>!s.canceled_at&&(sel==='todos'||s.seller_id===sel)).forEach(s=>{
    const mode=s.commission_mode||'venda',pct=+s.commission_pct||0,rec=s.pay_type==='crediario'&&mode==='recebimento';
    if(ld(s.created_at).slice(0,7)===m){
      const base=rec?+s.entry:+s.total;
      if(base>0)out.push({s,date:ld(s.created_at),cust:cn(s.customer_id),kind:rec?'Entrada':'Venda',base,pct});
    }
    if(rec)db.installments.filter(i=>i.sale_id===s.id&&i.paid_at&&ld(i.paid_at).slice(0,7)===m)
      .forEach(i=>out.push({s,date:ld(i.paid_at),cust:cn(s.customer_id),kind:'Parcela '+i.number,base:+i.amount,pct}));
  });
  out.forEach(r=>{r.sid=r.s.seller_id||'';r.sname=r.s.seller_name||'Sem vendedor';r.comm=+(r.base*r.pct/100).toFixed(2)});
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}

  const tot=rows.reduce((a,r)=>a+r.comm,0),bs=rows.reduce((a,r)=>a+r.base,0),T={'Venda':'Venda','Entrada':'Entrada'};
  $('#app').innerHTML=`<div class="bar"><input type="month" style="max-width:190px" value="${comMonth}" onchange="comMonth=this.value||comMonth;vCom()">
  ${ADM()?`<select style="max-width:240px" onchange="comSel=this.value;vCom()"><option value="todos">Todos os vendedores</option>${PROF.map(u=>`<option value="${u.id}" ${comSel===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select>`:''}</div>

  ${Object.keys(by).length>1?`<table><tr><th>Vendedor</th><th>Vendas</th><th>Base</th><th>Comissão</th></tr>${Object.values(by).map(o=>`<tr><td>${esc(o.name)}</td><td>${o.sales.size}</td><td>${R(o.base)}</td><td><b>${R(o.comm)}</b></td></tr>`).join('')}</table>`:''}
  ${rows.length?`<h3>Detalhe</h3><div style="overflow:auto"><table><tr><th>Data</th><th>Cliente</th><th>Origem</th>${sel==='todos'?'<th>Vendedor</th>':''}<th>Base</th><th>%</th><th>Comissão</th></tr>

}

/* ========= Carnê em PDF (gerador próprio, sem bibliotecas externas) ========= */
const QR=(()=>{
  const ECC=[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28];
  const BLK=[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49];
  const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r};
  const gmul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
  const rsGen=d=>{const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=gmul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=gmul(root,2)}return r};
  const rsRem=(data,gen)=>{const r=new Array(gen.length).fill(0);for(const b of data){const f=b^r.shift();r.push(0);gen.forEach((c,i)=>r[i]^=gmul(c,f))}return r};
  const bit=(x,i)=>((x>>>i)&1)!==0;
  function make(text){
    const bytes=[...new TextEncoder().encode(text)];
    let ver=1;
    for(;ver<=40;ver++){const cc=ver<10?8:16;if(4+cc+bytes.length*8<=(Math.floor(raw(ver)/8)-ECC[ver]*BLK[ver])*8)break}
    if(ver>40)throw new Error('Texto grande demais para o QR Code');
    const cap=Math.floor(raw(ver)/8)-ECC[ver]*BLK[ver],bits=[],put=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push((v>>>i)&1)};
    put(4,4);put(bytes.length,ver<10?8:16);bytes.forEach(b=>put(b,8));
    put(0,Math.min(4,cap*8-bits.length));while(bits.length%8)bits.push(0);
    const data=[];for(let i=0;i<bits.length;i+=8)data.push(parseInt(bits.slice(i,i+8).join(''),2));
    for(let p=0xEC;data.length<cap;p^=0xEC^0x11)data.push(p);
    const nb=BLK[ver],eb=ECC[ver],rawCW=Math.floor(raw(ver)/8),ns=nb-rawCW%nb,sl=Math.floor(rawCW/nb),gen=rsGen(eb),blocks=[];
    for(let i=0,k=0;i<nb;i++){const dat=data.slice(k,k+sl-eb+(i<ns?0:1));k+=dat.length;const ecc=rsRem(dat,gen);if(i<ns)dat.push(0);blocks.push(dat.concat(ecc))}
    const cw=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==sl-eb||j>=ns)cw.push(b[i])});
    const size=ver*4+17,m=Array.from({length:size},()=>new Array(size).fill(false)),fn=Array.from({length:size},()=>new Array(size).fill(false));
    const setFn=(x,y,v)=>{m[y][x]=v;fn[y][x]=true};
    for(let i=0;i<size;i++){setFn(6,i,i%2===0);setFn(i,6,i%2===0)}
    const finder=(x,y)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),xx=x+dx,yy=y+dy;if(xx>=0&&xx<size&&yy>=0&&yy<size)setFn(xx,yy,d!==2&&d!==4)}};
    finder(3,3);finder(size-4,3);finder(3,size-4);
    const na=ver===1?0:Math.floor(ver/7)+2,al=[];
    if(na){const step=ver===32?26:Math.ceil((ver*4+4)/(na*2-2))*2;al.push(6);for(let p=size-7;al.length<na;p-=step)al.splice(1,0,p)}
    al.forEach((a,i)=>al.forEach((b,j)=>{if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0))return;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)setFn(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}));
    const fmt=mask=>{
      const d=0<<3|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=(d<<10|r)^0x5412;
      for(let i=0;i<=5;i++)setFn(8,i,bit(b,i));setFn(8,7,bit(b,6));setFn(8,8,bit(b,7));setFn(7,8,bit(b,8));for(let i=9;i<15;i++)setFn(14-i,8,bit(b,i));
      for(let i=0;i<8;i++)setFn(size-1-i,8,bit(b,i));for(let i=8;i<15;i++)setFn(8,size-15+i,bit(b,i));setFn(8,size-8,true);
    };
    fmt(0);
    if(ver>=7){let r=ver;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=ver<<12|r;for(let i=0;i<18;i++){const c=bit(b,i),a=size-11+i%3,bb=Math.floor(i/3);setFn(a,bb,c);setFn(bb,a,c)}}
    let k=0;
    for(let right=size-1;right>=1;right-=2){if(right===6)right=5;for(let vert=0;vert<size;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?size-1-vert:vert;if(!fn[y][x]&&k<cw.length*8){m[y][x]=bit(cw[k>>>3],7-(k&7));k++}}}
    const mask=(mk)=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++){let inv;switch(mk){case 0:inv=(x+y)%2===0;break;case 1:inv=y%2===0;break;case 2:inv=x%3===0;break;case 3:inv=(x+y)%3===0;break;case 4:inv=(Math.floor(x/3)+Math.floor(y/2))%2===0;break;case 5:inv=x*y%2+x*y%3===0;break;case 6:inv=(x*y%2+x*y%3)%2===0;break;default:inv=((x+y)%2+x*y%3)%2===0}if(!fn[y][x]&&inv)m[y][x]=!m[y][x]}};
    const pen=()=>{
      let p=0;
      const line=a=>{let run=1;for(let i=1;i<=a.length;i++){if(i<a.length&&a[i]===a[i-1])run++;else{if(run>=5)p+=3+run-5;run=1}}
        for(let i=0;i+11<=a.length;i++){const s=a.slice(i,i+11).map(Number).join('');if(s==='10111010000'||s==='00001011101')p+=40}};
      for(let y=0;y<size;y++){line(m[y]);line(m.map(r=>r[y]))}
      for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++)if(m[y][x]===m[y][x+1]&&m[y][x]===m[y+1][x]&&m[y][x]===m[y+1][x+1])p+=3;
      const dark=m.flat().filter(Boolean).length,tot=size*size;p+=(Math.ceil(Math.abs(dark*20-tot*10)/tot)-1)*10;return p;
    };
    let best=0,bp=1e9;
    for(let mk=0;mk<8;mk++){mask(mk);fmt(mk);const p=pen();if(p<bp){bp=p;best=mk}mask(mk)}
    mask(best);fmt(best);
    return{size,get:(x,y)=>m[y][x],version:ver};
  }
  return{make};
})();

/* PIX (BR Code estático com valor) */
const emv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
const pixClean=(s,n)=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9 ]/g,'').replace(/\s+/g,' ').trim().slice(0,n).trim();
function pixPayload({key,name,city,amount,txid}){
  const mai=emv('00','BR.GOV.BCB.PIX')+emv('01',key);
  const p=emv('00','01')+emv('01','11')+emv('26',mai)+emv('52','0000')+emv('53','986')+(amount>0?emv('54',(+amount).toFixed(2)):'')
    +emv('58','BR')+emv('59',pixClean(name,25)||'LOJA')+emv('60',pixClean(city,15)||'BRASIL')+emv('62',emv('05',txid||'***'))+'6304';
  return p+crc16(p);
}

async function upLogo(inp){
  const f=inp.files[0];if(!f)return;
  const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f)});
  const k=Math.min(1,600/Math.max(img.width,img.height)),cv=document.createElement('canvas');
  cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  const type=f.type==='image/png'?'image/png':'image/jpeg',blob=await new Promise(ok=>cv.toBlob(ok,type,.9));
  let url;
  if(sb){
    const path='empresa/logo-'+Date.now()+(type==='image/png'?'.png':'.jpg');
    const{error}=await sb.storage.from(CFG.BUCKET).upload(path,blob,{contentType:type});
    if(error)return alert('Não foi possível enviar a logo: '+error.message);
    url=sb.storage.from(CFG.BUCKET).getPublicUrl(path).data.publicUrl;

}

function margCalc(cost,price){cost=+cost||0;price=+price||0;if(!(cost>0)||!(price>0))return null;const l=price-cost;return{lucro:l,mk:l/cost*100,mg:l/price*100}}

const norm=h=>String(h??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const ALI={name:['nome','nome do produto','produto','item','descricao'],category:['categoria','grupo','departamento','setor'],
 price_cash:['preco a vista','a vista','preco venda','preco de venda','preco','valor','venda'],price_card:['preco cartao','cartao'],
 price_credit:['preco carne','preco crediario','carne','crediario'],stock:['estoque','quantidade','qtd','saldo'],ncm:['ncm'],cfop:['cfop'],
 unit:['unidade','un','und'],max_inst:['parcelas','max parcelas','max inst'],description:['detalhes','descricao detalhada','observacao','descricao'],
 photos:['fotos','foto','imagens','imagem','links','url'],specs:['especificacoes','ficha tecnica','caracteristicas']};
function num(v){
  if(typeof v==='number')return v;
  let s=String(v??'').replace(/[R$\s]/g,'');if(!s)return 0;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  return parseFloat(s)||0;
}
function csvParse(t,d){
  const rows=[];let row=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===d){row.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(c);c='';if(row.some(x=>x!==''))rows.push(row);row=[]}
    else c+=ch}
  row.push(c);if(row.some(x=>x!==''))rows.push(row);
  const h=rows.shift()||[];return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??''])));
}
function impMap(rows,existing,newId){
  const hs=Object.keys(rows[0]||{}),nh=hs.map(norm),col={};
  const find=(al,skip)=>{for(const a of al){const i=nh.indexOf(a);if(i>=0&&hs[i]!==skip)return hs[i]}};
  col.name=find(ALI.name);
  for(const k of Object.keys(ALI))if(k!=='name')col[k]=find(ALI[k],col.name);
  const map=new Map();let skip=0;
  rows.forEach(r=>{
    const g=k=>col[k]!=null?r[col[k]]:undefined,has=k=>g(k)!=null&&String(g(k)).trim()!=='';
    const name=String(g('name')??'').trim(),cash=num(g('price_cash'));
    if(!name||!(cash>0)){skip++;return}
    const key=name.toLowerCase();
    const old=existing.find(p=>p.name.toLowerCase()===key)||map.get(key);
    const card=col.price_card!=null?(num(g('price_card'))||null):(old?old.price_card??null:null),cred=col.price_credit!=null?(num(g('price_credit'))||null):(old?old.price_credit??null:null);
    const photos=String(g('photos')??'').split(/[\s|;]+/).filter(u=>/^https?:\/\//.test(u)).slice(0,5);
    const specs=String(g('specs')??'').split(/\||;|\n/).map(s=>s.trim()).filter(Boolean).map(l=>{const[k,...v]=l.split(':');return{k:k.trim(),v:v.join(':').trim()}}).filter(s=>s.k&&s.v);
    map.set(key,{...(old||{id:newId(),active:true,cfop:'5102',unit:'UN',stock:0,max_inst:10,photos:[],specs:[]}),
      name,price_cash:cash,price_card:card,price_credit:cred,
      ...(has('category')?{category:String(g('category')).trim()}:{}),
      ...(has('description')?{description:String(g('description')).trim()}:{}),
      ...(has('ncm')?{ncm:String(g('ncm')).trim()}:{}),...(has('cfop')?{cfop:String(g('cfop')).trim()}:{}),
      ...(has('unit')?{unit:String(g('unit')).trim().toUpperCase()}:{}),
      ...(has('stock')?{stock:Math.round(num(g('stock')))}:{}),...(has('max_inst')?{max_inst:Math.round(num(g('max_inst')))||10}:{}),
      ...(photos.length?{photos}:{}),...(specs.length?{specs}:{})});
  });
  return{out:[...map.values()],skip,cols:col};
}

let XML=null;

  <input type="file" id="xmlf" accept=".xml,text/xml" onchange="xmlRead(this)"><div id="xmlv" style="margin-top:12px"></div>`);

function xmlRead(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>xmlLoad(r.result);r.readAsText(f);
}
function xmlParse(txt){
  const d=new DOMParser().parseFromString(txt,'text/xml');
  if(d.getElementsByTagName('parsererror').length)throw new Error('xml');
  const t=(el,n)=>{const x=el&&el.getElementsByTagName(n)[0];return x?x.textContent.trim():''};
  const inf=d.getElementsByTagName('infNFe')[0];if(!inf)throw new Error('Este arquivo não é uma NF-e (infNFe não encontrado).');
  const key=(inf.getAttribute('Id')||'').replace(/\D/g,''),em=inf.getElementsByTagName('emit')[0];
  const items=[...inf.getElementsByTagName('det')].map(det=>{
    const pr=det.getElementsByTagName('prod')[0],ean=t(pr,'cEAN'),ean2=t(pr,'cEANTrib');
    return{code:t(pr,'cProd'),ean:/^\d{8,14}$/.test(ean)?ean:/^\d{8,14}$/.test(ean2)?ean2:'',name:t(pr,'xProd'),ncm:t(pr,'NCM'),cest:t(pr,'CEST'),un:t(pr,'uCom')||'UN',
      qty:Math.round(parseFloat(t(pr,'qCom'))||0),cost:+(parseFloat(t(pr,'vUnCom'))||0).toFixed(2)};
  }).filter(i=>i.qty>0);
  if(!items.length)throw new Error('Nenhum item com quantidade encontrado.');
  items.forEach(i=>{
    const p=(i.ean&&db.products.find(x=>x.ean===i.ean))||db.products.find(x=>x.supplier_code&&x.supplier_code===i.code&&i.code)||db.products.find(x=>norm(x.name)===norm(i.name));
    i.pid=p?p.id:'novo';
  });
  const dups=[...inf.getElementsByTagName('dup')].map(x=>({n:t(x,'nDup'),venc:t(x,'dVenc'),v:+(parseFloat(t(x,'vDup'))||0).toFixed(2)})).filter(x=>x.venc&&x.v>0);
  return{key,num:t(inf.getElementsByTagName('ide')[0],'nNF'),forn:t(em,'xNome'),cnpj:t(em,'CNPJ'),items,dups};
}
function xmlLoad(txt){
  try{XML=xmlParse(txt);xmlView()}
  catch(e){$('#xmlv').innerHTML=`<p class="bad">${esc(e.message==='xml'?'Não foi possível ler o arquivo. Envie o XML original da nota.':e.message)}</p>`}
}
function xmlDone(){try{return JSON.parse(localStorage.mmxml||'[]')}catch(e){return[]}}
function xmlView(){

  <td><select onchange="XML.items[${ix}].pid=this.value;xmlView()"><option value="novo" ${i.pid==='novo'?'selected':''}>Cadastrar produto novo</option><option value="ignorar" ${i.pid==='ignorar'?'selected':''}>Ignorar este item</option>
  ${[...db.products].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')).map(p=>`<option value="${p.id}" ${i.pid===p.id?'selected':''}>${esc(p.name)} (estoque ${p.stock})</option>`).join('')}</select></td></tr>`).join('')}</table></div>
  <p><label><input type="checkbox" id="xml_cost" checked style="width:auto"> Atualizar o custo dos produtos</label></p>
  ${x.dups.length?`<p><label><input type="checkbox" id="xml_pay" checked style="width:auto"> Lançar em <b>Contas a pagar</b> as ${x.dups.length} parcela(s) da nota</label></p>
  <div class="sm">${x.dups.map(d=>`${esc(d.n||'—')}: vence ${fmtD(d.venc)} · ${R(d.v)}`).join('<br>')}</div>`:'<p class="sm">Esta nota não traz parcelas (pagamento à vista), então não gera conta a pagar.</p>'}
  <button class="btn" onclick="xmlApply()">Dar entrada no estoque</button>`;
}
function xmlCore(x,upd,pay){
  let a=0,n=0,cp=0;
  x.items.forEach(i=>{
    if(i.pid==='ignorar')return;
    if(i.pid==='novo'){
      put('products',{id:uid(),name:i.name,category:'',description:'',price_cash:0,price_card:null,price_credit:null,max_inst:10,stock:i.qty,active:false,ncm:i.ncm,cfop:'5102',unit:i.un,cest:i.cest,csosn:'102',specs:[],photos:[],ean:i.ean||null,supplier_code:i.code||null,cost:i.cost||null});n++;
    }else{
      const p=db.products.find(y=>y.id===i.pid);if(!p)return;
      put('products',{...p,stock:(+p.stock||0)+i.qty,ean:p.ean||i.ean||null,supplier_code:p.supplier_code||i.code||null,ncm:p.ncm||i.ncm,...(upd&&i.cost?{cost:i.cost}:{})});a++;
    }
  });
  if(pay)x.dups.forEach(d=>{put('payables',{id:uid(),supplier:x.forn,supplier_cnpj:x.cnpj,doc:x.num,parcel:d.n,due_date:d.venc,amount:d.v,paid_at:null,source:'xml',nfe_key:x.key||null,created_at:now()});cp++});
  if(x.key){const l=xmlDone();l.push(x.key);localStorage.mmxml=JSON.stringify(l.slice(-1000));if(sb&&role)Promise.resolve(sb.from('dfe_notas').update({entrada_at:now()}).eq('chave',x.key)).catch(()=>{})}
  return{a,n,cp};
}

async function impRead(inp){
  const f=inp.files[0];if(!f)return;
  let rows;
  try{
    const buf=await f.arrayBuffer();
    if(/\.csv$/i.test(f.name)){
      let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){t=new TextDecoder('windows-1252').decode(buf)}
      t=t.replace(/^\ufeff/,'');const l=t.split(/\r?\n/)[0]||'';
      const d=[';','\t',','].map(x=>[x,l.split(x).length]).sort((a,b)=>b[1]-a[1])[0][0];

      if(typeof XLSX==='undefined')return alert('A biblioteca de planilhas não carregou. Verifique a internet.');

    }

  $('#impv').innerHTML=`<p><b>${novos} novos</b> · ${out.length-novos} atualizações · ${skip} linhas ignoradas (sem nome ou sem preço)</p>
  <div style="overflow:auto;max-height:260px"><table><tr><th>Produto</th><th>Categoria</th><th>À vista</th><th>Estoque</th></tr>
  ${out.slice(0,50).map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.category||'')}</td><td>${R(p.price_cash)}</td><td>${p.stock}</td></tr>`).join('')}</table></div>
  ${out.length>50?'<p class="sm">Mostrando os 50 primeiros.</p>':''}<p><button class="btn" onclick="impGo()">Importar ${out.length} produtos</button></p>`;

function prodMarg(){
  const c=$('#f_cost').value,el=$('#f_marg');if(!el)return;
  if(!(+c>0)){el.innerHTML='<p class="sm">Informe o preço de custo (ou dê entrada pela nota XML) para ver a margem de lucro.</p>';return}
  const L=[['À vista','f_price_cash'],['Cartão','f_price_card'],['Carnê','f_price_credit']].map(([n,id])=>{const m=margCalc(c,$('#'+id).value);return m?`<div class="pr"><span>${n}</span><b class="${m.lucro<0?'bad':'ok'}">${pc1(m.mk)} sobre o custo</b><div class="sm">lucro ${R(m.lucro)} · margem ${pc1(m.mg)} da venda</div></div>`:''}).join('');
  el.innerHTML=`<div class="prices">${L||'<p class="sm">Digite o preço de venda para ver a margem.</p>'}</div>`;
}
function prodMk(){const c=+$('#f_cost').value,m=$('#f_mk').value;if(c>0&&m!==''){$('#f_price_cash').value=(c*(1+ +m/100)).toFixed(2);prodMarg()}}
async function upload(inp){
  const ta=$('#f_photos');
  for(const f of [...inp.files]){
    if(ta.value.split('\n').filter(Boolean).length>=5)break;
    const path=uid()+'-'+f.name.replace(/[^\w.]/g,'_');
    const{error}=await sb.storage.from(CFG.BUCKET).upload(path,f);
    if(!error)ta.value+=(ta.value?'\n':'')+sb.storage.from(CFG.BUCKET).getPublicUrl(path).data.publicUrl;
  }
}
function saveProd(id){
  const g=k=>$('#f_'+k).value.trim();
  if(!g('name')||!g('price_cash'))return alert('Informe nome e preço à vista.');
  const row={...(db.products.find(x=>x.id===id)||{}),id:id||uid(),name:g('name'),category:g('category'),description:g('description'),
   cost:+g('cost')||null,price_cash:+g('price_cash'),price_card:+g('price_card')||null,price_credit:+g('price_credit')||null,
   max_inst:+g('max_inst')||10,stock:+g('stock')||0,active:g('active')==='true',ncm:g('ncm'),cfop:g('cfop'),unit:g('unit'),cest:g('cest'),csosn:g('csosn'),
   specs:g('specs').split('\n').filter(Boolean).map(l=>{const[k,...v]=l.split(':');return{k:k.trim(),v:v.join(':').trim()}}),
   photos:g('photos').split('\n').map(s=>s.trim()).filter(Boolean).slice(0,5)};
  { // vídeo e site: só envia as colunas se houver link (evita erro caso o SQL v20 ainda não tenha sido rodado)
    const fix=v=>{v=(v||'').trim();if(!v)return null;if(/^www\./i.test(v))v='https://'+v;return /^https?:\/\/[^\s]+\.[^\s]+$/i.test(v)?v:false},vu=fix(g('video_url')),su=fix(g('site_url')),o=db.products.find(x=>x.id===id)||{};
    if(vu===false)return alert('O link do vídeo precisa começar com http:// ou https://');
    if(su===false)return alert('O link do site do fabricante precisa começar com http:// ou https://');
    if(vu||su||'video_url' in o){row.video_url=vu;row.site_url=su}
  }
  { // só envia as colunas de promoção se houver promoção (evita erro caso o SQL v18 ainda não tenha sido rodado)
    const pp=+g('promo_pct')>0?Math.min(90,+g('promo_pct')):null,pf=g('promo_from')||null,pt=g('promo_to')||null,o=db.products.find(x=>x.id===id)||{};
    if(pp||pf||pt||'promo_pct' in o){row.promo_pct=pp;row.promo_from=pf;row.promo_to=pt}
  }
  const ean=digits(g('ean'));
  if(ean){const dup=db.products.find(x=>x.ean===ean&&x.id!==row.id);if(dup&&!confirm('Este código de barras já está no produto "'+dup.name+'". Salvar mesmo assim?'))return;row.ean=ean}
  else if('ean' in row)row.ean=null;
  const old=db.products.find(x=>x.id===id);
  const go=()=>{put('products',row);closeM();render()};
  old&&['price_cash','price_card','price_credit','promo_pct'].some(k=>(+old[k]||0)!==(+row[k]||0))?master(go):go();
}

  if(pre){s_t.value=pre.pay_type;c_n.value=pre.customer_name||'';c_p.value=pre.customer_phone||'';c_c.value=pre.customer_cpf||'';window.preAddr=pre.customer_address||'';if(pre.n_inst)s_n.value=pre.n_inst;pre=null;cartView()}

const promoPct=p=>{const x=+p.promo_pct;if(!(x>0&&x<100))return 0;const d=new Date(),h=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  if(p.promo_from&&h<String(p.promo_from).slice(0,10))return 0;if(p.promo_to&&h>String(p.promo_to).slice(0,10))return 0;return x};
const promoAt=(v,p)=>{const x=promoPct(p);return x?+(v*(1-x/100)).toFixed(2):+v};
const unit0=(p,t)=>t==='avista'?p.price_cash:t==='cartao'?(p.price_card||p.price_cash):(p.price_credit||p.price_card||p.price_cash);
const unit=(p,t)=>promoAt(+unit0(p,t),p);
const total=()=>cart.reduce((s,i)=>s+unit(db.products.find(p=>p.id===i.id),$('#s_t')?.value||'avista')*i.qty,0);
const pPhoto=p=>(p.photos&&p.photos[0])||'';
function pdvList(){

const pdvNarrow=()=>matchMedia('(max-width:899px)').matches;

function pdvPick(id){addProd(id);const q=$('#p_q');q.value='';pdvSearch();if(!pdvNarrow())q.focus()}
function addProd(id){

  if($('#s_q'))$('#s_q').value=1;cartView();
}
/* ========= Leitor de código de barras (câmera) ========= */
let scanStream=null,scanTimer=null,scanH5=null,scanLast={c:'',t:0};
function scanStop(){
  clearInterval(scanTimer);scanTimer=null;
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}
  if(scanH5){const h=scanH5;scanH5=null;Promise.resolve().then(()=>h.stop()).then(()=>h.clear()).catch(()=>{})}
}
function scanOpen(cb,multi){
  scanStop();
  modal(`<h2>Escanear código de barras</h2><p class="sm">Aponte a câmera para o código de barras do produto.</p>
  <div id="scanbox" style="background:#000;border-radius:12px;overflow:hidden;min-height:180px"><video id="scanv" playsinline muted style="width:100%;display:block"></video></div>
  <p id="scanmsg" class="sm" role="status" aria-live="polite">Abrindo a câmera…</p><button class="btn g" onclick="closeM()">${multi?'Concluir':'Cancelar'}</button>`);
  const got=code=>{
    const n=Date.now();if(code===scanLast.c&&n-scanLast.t<2500)return;scanLast={c:code,t:n};
    if(navigator.vibrate)navigator.vibrate(60);
    const m=cb(code);
    if(multi){const e=$('#scanmsg');if(e)e.textContent=m||'Lido: '+code}else closeM();
  };
  startScan(got);
}
const loadScript=u=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=()=>no(new Error('script'));document.head.appendChild(e)});
async function startScan(got){
  const msg=t=>{const e=$('#scanmsg');if(e)e.textContent=t};
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return msg('Este navegador não permite usar a câmera. Digite o código no campo.');
  try{
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
      scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
      const v=$('#scanv');if(!v){scanStop();return}
      v.srcObject=scanStream;await v.play();msg('Procurando o código…');
      scanTimer=setInterval(async()=>{try{const r=await det.detect(v);if(r.length)got(r[0].rawValue)}catch(e){}},250);
      return;
    }
    // Sem leitor nativo (ex.: iPhone/Safari): usa a biblioteca html5-qrcode.
    if(!window.Html5Qrcode)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js');
    const F=window.Html5QrcodeSupportedFormats;
    $('#scanbox').innerHTML='';
    scanH5=new Html5Qrcode('scanbox',{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128],verbose:false});
    await scanH5.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:140}},got,()=>{});
    msg('Procurando o código…');
  }catch(e){
    scanStop();
    msg(e&&e.name==='NotAllowedError'?'Permita o uso da câmera no navegador para escanear.':e&&e.name==='NotFoundError'?'Nenhuma câmera encontrada neste aparelho.':'Não foi possível abrir a câmera. Digite o código no campo.');
  }
}
function pdvScanned(code){
  const d=digits(code),p=db.products.find(x=>x.ean===d&&x.active!==false);
  if(!p)return'Código '+d+' não cadastrado. Cadastre o código de barras no produto.';
  addProd(p.id);return'Adicionado: '+p.name;
}
function pdvEnter(){const v=$('#p_q').value.trim(),d=digits(v);const ex=d.length>=6&&db.products.find(p=>p.ean===d&&p.active!==false);const l=pdvList();

function cartQty(ix,d){const i=cart[ix];if(!i)return;i.qty+=d;if(i.qty<1)cart.splice(ix,1);cartView()}
function cartView(){

    ${pPhoto(p)?`<img class="cthumb" src="${esc(pPhoto(p))}" alt="" loading="lazy" onerror="this.outerHTML='<span class=cthumb>·</span>'">`:'<span class="cthumb">·</span>'}
    <div class="cn"><b>${esc(p.name)}</b><span class="sm">${R(u)} un.${pr?` <s>${R(unit0(p,t))}</s>`:''}${(+p.stock||0)<i.qty?' · <span class="bad">estoque '+(+p.stock||0)+'</span>':''}</span></div>
    <div class="stp"><button type="button" aria-label="Diminuir" onclick="cartQty(${ix},-1)">−</button><span>${i.qty}</span><button type="button" aria-label="Aumentar" onclick="cartQty(${ix},1)">+</button></div>
    <b class="lt">${R(u*i.qty)}</b><button type="button" class="rx" aria-label="Remover item" onclick="cart.splice(${ix},1);cartView()">×</button></div>`}).join('')}</div>`
   :'<p class="cempty">Carrinho vazio.<br><span class="sm">Busque, toque num produto ou escaneie o código de barras.</span></p>')
   +`<div class="ctot"><span>${un} ${un===1?'item':'itens'}</span><div><span class="sm">Total</span><b>${R(tot)}</b>${t==='crediario'&&tot?`<span class="sm">restante ${n}x de ${R((tot-e)/n)}</span>`:''}</div></div>`;
  const pb=$('#pbt');if(pb)pb.textContent=R(tot)+(un?` · ${un} ${un===1?'item':'itens'}`:'');
  const bf=$('#btnfin');if(bf)bf.textContent=tot?'Finalizar venda · '+R(tot):'Finalizar venda';
}

const stockAdj=(id,d)=>{const p=db.products.find(x=>x.id===id);if(p){p.stock=(+p.stock||0)+d;save()}};
function finish(){
  if(!cart.length)return alert('Adicione ao menos um produto.');
  const t=s_t.value,tot=total(),e=t==='crediario'?+s_e.value||0:0,n=t==='crediario'?+s_n.value||1:1;
  let cid=null;
  if(c_n.value.trim()){
    let c=db.customers.find(x=>x.id===selCli)||db.customers.find(x=>(digits(c_c.value)&&digits(x.cpf)===digits(c_c.value))||x.name===c_n.value.trim())||{id:uid()};
    Object.assign(c,{name:c_n.value.trim(),cpf:c_c.value.trim(),phone:c_p.value.trim(),address:c.address||window.preAddr||''});window.preAddr='';put('customers',c);cid=c.id;
  }else if(t==='crediario')return alert('Carnê exige o nome do cliente.');
  const sale={id:uid(),customer_id:cid,pay_type:t,method:s_m.value,total:tot,entry:e,n_inst:n,fiscal_status:'pendente',doc_type:'nfe',nat_op:'Venda de mercadoria',freight:'9',...sellerInfo(),created_at:now(),
   items:cart.map(i=>{const p=db.products.find(x=>x.id===i.id);return{id:p.id,name:p.name,qty:i.qty,price:unit(p,t),ncm:p.ncm,cfop:p.cfop,unit:p.unit,cest:p.cest,csosn:p.csosn}})};
  const low=cart.filter(i=>{const p=db.products.find(x=>x.id===i.id);return(+p.stock||0)<i.qty}).map(i=>db.products.find(x=>x.id===i.id).name);
  if(low.length&&!confirm('Estoque insuficiente para: '+low.join(', ')+'.\nRegistrar a venda mesmo assim?'))return;
  put('sales',sale);
  cart.forEach(i=>stockAdj(i.id,-i.qty)); // a baixa oficial é feita no servidor ao sincronizar a venda
  if(t==='crediario'){
    const per=Math.floor((tot-e)/n*100)/100;let d=new Date(s_d.value+'T12:00');
    for(let k=1;k<=n;k++){
      put('installments',{id:uid(),sale_id:sale.id,number:k,due_date:d.toISOString().slice(0,10),amount:k===n?+((tot-e)-per*(n-1)).toFixed(2):per,paid_at:null});
      d=new Date(d);d.setMonth(d.getMonth()+1);
    }
  }
  if(fromOrder){const o=db.orders.find(x=>x.id===fromOrder);if(o)put('orders',{...o,status:'convertido'});fromOrder=null}
  cart=[];alert('Venda registrada.');view=t==='crediario'?'car':'pdv';render();

const CALI={name:['nome razao social','razao social','nome completo','nome','cliente','fornecedor','empresa'],trade_name:['nome fantasia','fantasia'],
 cpf:['cpf cnpj','cpf ou cnpj','cnpj cpf','documento','cpf','cnpj'],ie:['inscricao estadual','ie'],
 phone:['telefone whatsapp','telefone','celular','whatsapp','fone'],email:['e mail','email'],cep:['cep'],street:['endereco','rua logradouro','logradouro','rua'],
 number:['numero','num'],complement:['complemento'],district:['bairro'],city:['cidade','municipio'],uf:['uf','estado'],ibge:['codigo ibge','cod ibge','ibge'],
 kind:['tipo de cadastro','cadastro'],person:['tipo de pessoa','pessoa'],tipo:['tipo'],active:['situacao','status','ativo']};
async function readTable(f){
  const buf=await f.arrayBuffer();
  if(/\.(csv|txt)$/i.test(f.name)){
    let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){t=new TextDecoder('windows-1252').decode(buf)}
    t=t.replace(/^\ufeff/,'');const l=t.split(/\r?\n/)[0]||'';
    const d=[';','\t',','].map(x=>[x,l.split(x).length]).sort((a,b)=>b[1]-a[1])[0][0];
    return csvParse(t,d);
  }
  if(typeof XLSX==='undefined')throw new Error('xlsx');
  const wb=XLSX.read(buf,{type:'array'});
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});
}
function cliMap(rows,existing,newId){
  const hs=Object.keys(rows[0]||{}),nh=hs.map(norm),col={};
  for(const k of Object.keys(CALI)){if(k==='cpf')continue;for(const a of CALI[k]){const i=nh.indexOf(a);if(i>=0){col[k]=hs[i];break}}}
  const docCols=hs.filter((h,i)=>CALI.cpf.includes(nh[i]));
  const map=new Map();let skip=0,bad=0;
  rows.forEach(r=>{
    const g=k=>col[k]!=null?String(r[col[k]]??'').trim():'';
    const name=g('name');if(!name){skip++;return}
    let d=digits(docCols.map(h=>String(r[h]??'').trim()).find(Boolean)||'');
    if(d.length===10)d=d.padStart(11,'0');if(d.length===13)d=d.padStart(14,'0');
    let doc='',note='';
    if(d){if((d.length===11&&okCpf(d))||(d.length===14&&okCnpj(d)))doc=fmtDoc(d);else{bad++;note='CPF/CNPJ inválido (importado sem documento)'}}
    const key=doc?digits(doc):'n:'+norm(name);
    const old=(doc&&existing.find(c=>digits(c.cpf)===digits(doc)))||(!doc&&existing.find(c=>norm(c.name)===norm(name)))||map.get(key)?.row;
    const kt=g('kind')||g('tipo'),pt=g('person')||g('tipo'),at=g('active');
    const kind=/forn/i.test(kt)?'fornecedor':/client/i.test(kt)?'cliente':(old&&old.kind)||'cliente';
    const person=d.length===14?'PJ':/jur|^pj$/i.test(pt)?'PJ':/fis|^pf$/i.test(pt)?'PF':(old&&old.person_type)||'PF';
    const act=at?!/inativ|^n(ã|a)o$|^0$|^false$/i.test(at):(old?old.active!==false:true);
    const o=(k,fn=x=>x)=>g(k)?{[k]:fn(g(k))}:{};
    const row={...(old||{id:newId(),active:true}),name,kind,person_type:person,active:act,cpf:doc||(old&&old.cpf)||'',
      ...o('trade_name'),...o('ie'),...o('phone'),...o('email',x=>x.toLowerCase()),...o('cep',x=>x.replace(/^(\d{5})-?(\d{3})$/,'$1-$2')),
      ...o('street'),...o('number'),...o('complement'),...o('district'),...o('city'),...o('uf',x=>x.toUpperCase().slice(0,2)),...o('ibge',x=>digits(x))};
    map.set(key,{row,note,isNew:!existing.some(c=>c.id===row.id)});
  });
  return{out:[...map.values()],skip,bad,cols:col,hasDoc:docCols.length>0};
}

const tc=s=>(s||'').toLowerCase().replace(/(^|[\s\/-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()).replace(/\b(Da|De|Do|Das|Dos|E)\b/g,x=>x.toLowerCase());
function fmtDoc(v){
  const d=digits(v).slice(0,14);
  return d.length<=11?d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2'):fmtCnpj(d);
}
function cnpjFields(j){
  const ty=(j.descricao_tipo_de_logradouro||j.descricao_tipo_logradouro||'').trim(),lg=(j.logradouro||'').trim();
  const cep=digits(j.cep),ph=digits(j.ddd_telefone_1);
  return{name:j.razao_social||'',trade_name:j.nome_fantasia||'',cep:cep.replace(/^(\d{5})(\d{3})$/,'$1-$2'),
    street:tc(lg.toUpperCase().startsWith(ty.toUpperCase())?lg:(ty+' '+lg).trim()),number:j.numero||'',complement:tc(j.complemento),
    district:tc(j.bairro),city:tc(j.municipio),uf:j.uf||'',ibge:String(j.codigo_municipio_ibge||''),
    phone:ph.length>=10?`(${ph.slice(0,2)}) ${ph.slice(2,ph.length-4)}-${ph.slice(-4)}`:ph,email:(j.email||'').toLowerCase()};

let cnpjT=null;
function cpfIn(el){
  el.value=fmtDoc(el.value);const d=digits(el.value),st=$('#k_st');
  if(d.length>11)$('#k_person_type').value='PJ';

async function cnpjLookup(force){
  const d=digits($('#k_cpf').value),st=$('#k_st');
  if(d.length!==14||!okCnpj(d)){st.className='sm bad';st.textContent='Digite um CNPJ válido para buscar.';return}
  st.className='sm';st.textContent='Buscando dados na Receita Federal...';
  let j=null;
  for(const u of ['https://brasilapi.com.br/api/cnpj/v1/'+d,'https://minhareceita.org/'+d]){
    try{const res=await fetch(u);if(res.ok){j=await res.json();break}}catch(e){}
  }
  if(!j){st.className='sm bad';st.textContent='Não consegui consultar agora (sem internet ou CNPJ não encontrado). Preencha manualmente.';return}
  const F=cnpjFields(j);$('#k_person_type').value='PJ';
  Object.entries(F).forEach(([k,v])=>{const e=$('#k_'+k);if(e&&v&&(force||!e.value.trim()))e.value=v});
  const sit=j.descricao_situacao_cadastral||'';
  st.className='sm '+(sit&&sit.toUpperCase()!=='ATIVA'?'bad':'ok');
  st.textContent='Dados preenchidos pela Receita Federal'+(sit?'. Situação cadastral: '+sit:'')+'. Confira e informe a inscrição estadual.';
}
function okCpf(v){
  const c=digits(v);if(c.length!==11||/^(\d)\1+$/.test(c))return false;
  const dv=n=>{let s=0;for(let i=0;i<n;i++)s+=c[i]*(n+1-i);const m=(s*10)%11;return m===10?0:m};
  return dv(9)==c[9]&&dv(10)==c[10];
}
function saveCli(id){

  const row={...c,kind:g('kind'),trade_name:g('trade_name'),name:g('name'),person_type:g('person_type'),cpf:g('cpf'),phone:g('phone'),email:g('email'),ie:g('ie'),cep:g('cep'),street:g('street'),number:g('number'),
    complement:g('complement'),district:g('district'),city:g('city'),uf:g('uf').toUpperCase(),ibge:g('ibge'),address:g('address')};

function cliMatch(q){
  const k=norm(q),d=digits(q);if(!k&&!d)return[];
  return db.customers.filter(c=>c.active!==false&&(c.kind||'cliente')==='cliente'&&(norm([c.name,c.trade_name,c.email,c.city,c.ie].join(' ')).includes(k)||(d.length>=2&&(digits(c.cpf).includes(d)||digits(c.phone).includes(d)))))

/* ========= Pacote do contador (XMLs do mês + resumo, em .zip) ========= */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zipMake(files){ // files: [{name,data(string)}] ; ZIP sem compressão (XML é pequeno), nomes em UTF-8
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;const d=new Date();
  const dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  files.forEach(f=>{
    const nm=enc.encode(f.name),da=f.data instanceof Uint8Array?f.data:enc.encode(f.data),crc=crc32(da),h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);
    h.setUint32(14,crc,true);h.setUint32(18,da.length,true);h.setUint32(22,da.length,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nm,da);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);
    c.setUint32(16,crc,true);c.setUint32(20,da.length,true);c.setUint32(24,da.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+da.length;
  });
  const cs=cen.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/zip'});
}

/* ========= PDF simples (tabela) sem biblioteca: Helvetica padrão do PDF ========= */
const PDFHW=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
function pdfW(t,sz){let w=0;for(const ch of String(t)){const b=ch.normalize('NFD')[0],c=b.charCodeAt(0);w+=(c>=32&&c<=126?PDFHW[c-32]:556)}return w*sz/1000}
function pdfEnc(t){ // WinAnsi: Latin-1 + alguns sinais
  const M={'—':'\x97','–':'\x96','“':'"','”':'"','‘':"'",'’':"'",'•':'\x95','…':'\x85'};
  let o='';for(const ch of String(t)){const c=ch.charCodeAt(0);o+=M[ch]||(c<256?ch:'?')}
  return o.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
}
function pdfFit(t,w,sz){t=String(t);if(pdfW(t,sz)<=w)return t;while(t.length>1&&pdfW(t+'…',sz)>w)t=t.slice(0,-1);return t+'…'}
function pdfMake(d,co){
  const W=595.28,H=841.89,M=36,CW=W-2*M,sz=8.5,rh=15,pages=[];let cur=null,y=0;
  const wid=d.head.map((h,i)=>Math.min(Math.max(pdfW(h,sz),...d.rows.map(r=>pdfW(r[i],sz)),...(d.foot[i]?[pdfW(d.foot[i],sz)]:[0]))+8,220));
  const k=Math.min(1,CW/wid.reduce((a,b)=>a+b,0)),extra=Math.max(0,CW-wid.reduce((a,b)=>a+b,0)*k),cw=wid.map(w=>w*k+extra/wid.length);
  const T=(x,yy,t,o={})=>{const f=o.b?'F2':'F1',z=o.sz||sz;let xx=x;if(o.r)xx=x-pdfW(t,z);cur.push(`BT /${f} ${z} Tf ${o.c||'0 g'} ${xx.toFixed(2)} ${yy.toFixed(2)} Td (${pdfEnc(t)}) Tj ET`)};
  const newPage=()=>{cur=[];pages.push(cur);y=H-M;
    T(M,y-12,co.trade_name||co.legal_name||'MultMix',{b:1,sz:13});
    T(W-M,y-12,d.title,{b:1,sz:12,r:1,c:'0 0.27 0.56 rg'});y-=26;
    if(co.cnpj)T(M,y,'CNPJ '+co.cnpj,{sz:8,c:'0.35 g'});T(W-M,y,pdfFit(d.sub,330,8),{sz:8,r:1,c:'0.35 g'});y-=8;
    cur.push(`0 0.27 0.56 RG 1.5 w ${M} ${y} m ${W-M} ${y} l S`);y-=14};
  const head=()=>{cur.push(`0 0.27 0.56 rg ${M} ${y-rh+4} ${CW} ${rh} re f`);let x=M;d.head.forEach((h,i)=>{const r=d.al[i]==='r';T(r?x+cw[i]-4:x+4,y-rh+8,pdfFit(h,cw[i]-8,sz),{b:1,c:'1 g',r});x+=cw[i]});y-=rh};
  const row=(r,o={})=>{if(y-rh<M+20){newPage();head()}
    if(o.zebra)cur.push(`0.95 0.96 0.98 rg ${M} ${y-rh+4} ${CW} ${rh} re f`);
    if(o.foot)cur.push(`0 0.27 0.56 RG 1 w ${M} ${y+4} m ${W-M} ${y+4} l S`);
    let x=M;r.forEach((c,i)=>{const rr=d.al[i]==='r';T(rr?x+cw[i]-4:x+4,y-rh+8,pdfFit(c,cw[i]-8,sz),{b:o.foot,r:rr});x+=cw[i]});y-=rh};
  newPage();
  // resumo
  d.sum.forEach(([l,v])=>{T(M,y,l+': ',{sz:9,c:'0.35 g'});T(M+pdfW(l+': ',9)+2,y,String(v),{b:1,sz:9});y-=13});y-=6;
  head();d.rows.forEach((r,i)=>row(r,{zebra:i%2}));
  if(d.rows.length)row(d.foot,{foot:1});else{T(M+4,y-rh+8,'Nada encontrado neste filtro.');y-=rh}
  const foot='Gerado em '+new Date().toLocaleString('pt-BR')+' · MultMix Sistema '+window.APP_VERSION;
  pages.forEach((c,i)=>{const t=foot+' · página '+(i+1)+' de '+pages.length;c.push(`BT /F1 7.5 Tf 0.45 g ${((W-pdfW(t,7.5))/2).toFixed(2)} 22 Td (${pdfEnc(t)}) Tj ET`)});
  // monta o arquivo
  const objs=[];const add=s=>objs.push(s)-1;
  add('<< /Type /Catalog /Pages 2 0 R >>');add(null);
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  const kids=[];
  pages.forEach(c=>{const body=c.join('\n'),ci=objs.length+1;add(`<< /Length ${body.length} >>\nstream\n${body}\nendstream`);
    kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${ci} 0 R >>`)+1)});
  objs[1]=`<< /Type /Pages /Kids [${kids.map(k=>k+' 0 R').join(' ')}] /Count ${kids.length} >>`;
  let out='%PDF-1.4\n',offs=[];objs.forEach((o,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
  const xr=out.length;out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
  const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;return u;
}

/* ========= Fiscal (controle de NFC-e) ========= */
function fisCheck(s){
  const p=[],c=db.customers.find(x=>x.id===s.customer_id)||{},co=CO(),nfe=s.doc_type!=='nfce',d=digits(c.cpf);
  if(!okCnpj(co.cnpj))p.push('CNPJ da empresa');
  if(!co.ie)p.push('Inscrição estadual da empresa');
  if(!co.regime)p.push('Regime tributário da empresa');
  if(!(co.street&&co.number&&co.district&&co.city&&co.uf&&co.cep&&co.ibge))p.push('Endereço da empresa (com código IBGE)');
  s.items.forEach(i=>{const pr=db.products.find(x=>x.id===i.id)||{};
    if(digits(i.ncm||pr.ncm).length!==8)p.push('NCM de '+i.name);
    if(!(i.cfop||pr.cfop))p.push('CFOP de '+i.name);
    if(/Simples|MEI/.test(co.regime||'')&&!(i.csosn||pr.csosn))p.push('CSOSN de '+i.name)});
  if(nfe){
    if(!c.id)p.push('Cliente (obrigatório na NF-e)');
    else{
      if(!(d.length===11?okCpf(d):d.length===14?okCnpj(d):false))p.push('CPF ou CNPJ válido do cliente');
      if(!(c.street&&c.number&&c.district&&c.city&&c.uf&&c.cep&&c.ibge))p.push('Endereço completo do cliente (com IBGE)');
      if(d.length===14&&!c.ie)p.push('Inscrição estadual do cliente (ou ISENTO)');
    }
  }else if(d&&!(d.length===11&&okCpf(d)))p.push('CPF do cliente inválido');
  return[...new Set(p)];
}

let FST=null;
async function fisStatus(force){
  const el=()=>document.getElementById('fisSt');
  const paint=(h)=>{const e=el();if(e)e.innerHTML='<span>Emissão (API fiscal e SEFAZ)</span>'+h};
  if(!sb||!navigator.onLine){paint('<b class="bad">Sem internet: não dá para emitir agora</b><div class="sm">Pode vender normalmente; a nota é emitida depois, em Fiscal. Lembre: nota de mercadoria que sai da loja precisa estar autorizada antes (confira com o contador).</div>');return}
  if(!force&&FST&&Date.now()-FST.t<60000){paint(FST.h);return}
  paint('<b class="sm">verificando…</b>');
  let h;
  try{
    const d=await fisCall({action:'status'});
    if(!d.api)h=`<b class="bad">API fiscal indisponível</b><div class="sm">${esc(d.erro||'')} Se estiver "dormindo" (Render gratuito), espere 1 minuto e verifique de novo.</div>`;
    else if(d.sefaz_ok)h=`<b class="ok">SEFAZ em operação</b> <span class="tag">${d.ambiente===2?'homologação':'produção'}</span>`;
    else h=`<b class="bad">SEFAZ fora do ar</b><div class="sm">${esc(d.motivo||d.erro||'')} As vendas continuam normais. Tente emitir mais tarde; as notas ficam na lista abaixo. Se a SEFAZ ficar muito tempo fora, fale com o contador sobre contingência (SVC/EPEC).</div>`;
  }catch(e){h=`<b class="bad">Não foi possível verificar</b><div class="sm">${esc(e.message)}</div>`}
  FST={t:Date.now(),h};paint(h);
}
async function fisEmitAll(){
  const ids=db.sales.filter(s=>s.fiscal_status!=='emitida'&&s.fiscal_status!=='cancelada'&&!s.canceled_at&&!fisCheck(s).length).sort((a,b)=>a.created_at.localeCompare(b.created_at)).map(s=>s.id);
  if(!ids.length)return alert('Nenhuma venda pronta.');
  if(!confirm('Emitir '+ids.length+' nota(s) agora, uma por vez, da mais antiga para a mais nova?\nSe a SEFAZ ou a API falhar, o processo para.'))return;
  let ok=0,rec=0,falha='';
  for(const id of ids){
    setSync('emitindo '+(ok+1)+' de '+ids.length+'…');
    try{await sync();const d=await fisCall({action:'emit',sale_id:id});ok++;if(d.recuperada)rec++}
    catch(e){falha=e.message;break}
  }
  await sync();FST=null;
  alert(ok+' nota(s) emitida(s)'+(rec?' (recuperada(s) da SEFAZ, que já havia autorizado: '+rec+')':'')+'.'+(falha?'\n\nO processo parou numa nota:\n'+falha:''));
  vFis();
}

  if(k==='receber'){
    const rows=[];
    db.installments.forEach(i=>{if(i.paid_at||i.canceled_at)return;const sl=db.sales.find(x=>x.id===i.sale_id);if(!sl||sl.canceled_at)return;
      const d=due(i),n=days(i.due_date);if(REL.cr==='atraso'&&n<=0)return;
      rows.push({c:cn(sl.customer_id),ph:(db.customers.find(c=>c.id===sl.customer_id)||{}).phone||'',n:i.number,tot:db.installments.filter(x=>x.sale_id===sl.id&&!x.canceled_at).length,due:i.due_date,dl:Math.max(n,0),a:+i.amount,v:d.v})});
    rows.sort((a,b)=>a.c.localeCompare(b.c,'pt-BR')||a.due.localeCompare(b.due));

      rows:rows.map(r=>[r.c,r.ph||'—',r.n+'/'+r.tot,fmtD(r.due),r.dl?r.dl+' dias':'—',R(r.a),R(r.v)]),foot:['Total','','','','',R(sum(rows,r=>r.a)),R(sum(rows,r=>r.v))],
      sum:[['Parcelas',rows.length],['Clientes',new Set(rows.map(r=>r.c)).size],['Em atraso',late.length+' · '+R(sum(late,r=>r.v))],['Total hoje',R(sum(rows,r=>r.v))]]};
  }
  if(k==='pagar'){
    const P=(db.payables||[]).filter(p=>!p.canceled_at);
    const L=(REL.pg==='pagas'?P.filter(p=>p.paid_at&&inP(p.paid_at)):P.filter(p=>!p.paid_at)).sort((a,b)=>String(REL.pg==='pagas'?a.paid_at:a.due_date).localeCompare(String(REL.pg==='pagas'?b.paid_at:b.due_date)));
    const amt=p=>+(REL.pg==='pagas'?(p.paid_amount||p.amount):p.amount)||0,lt=L.filter(p=>!p.paid_at&&dleft(p.due_date)<0);
    return{title:REL.pg==='pagas'?'Contas pagas':'Contas a pagar em aberto',sub:REL.pg==='pagas'?'Pagas no período: '+per:'Posição em '+fmtD(ld(now())),head:['Fornecedor','Documento','Vencimento',REL.pg==='pagas'?'Pago em':'Situação','Valor'],al:'llllr',
      rows:L.map(p=>[p.supplier||'—',(p.doc?'NF '+p.doc:'—')+(p.parcel?' · '+p.parcel:''),fmtD(p.due_date),REL.pg==='pagas'?fmtD(p.paid_at)+(p.method?' · '+p.method:''):(dleft(p.due_date)<0?'Vencida':'A vencer'),R(amt(p))]),
      foot:['Total','','','',R(sum(L,amt))],sum:[['Contas',L.length],['Total',R(sum(L,amt))],...(REL.pg==='pagas'?[]:[['Vencidas',lt.length+' · '+R(sum(lt,amt))]])]};
  }
  if(k==='caixa'){

      const sd=db.sales.filter(s=>!s.canceled_at&&ld(s.created_at)===day);

      db.installments.filter(i=>i.paid_at&&ld(i.paid_at)===day).forEach(i=>add(i.method||'Não informado',+i.paid_amount||+i.amount));
      db.sales.filter(s=>s.canceled_at&&ld(s.canceled_at)===day&&+s.refund_amount>0).forEach(s=>add(s.refund_method||'Não informado',-s.refund_amount));
      const tot=Object.values(by).reduce((a,b)=>a+b,0);for(const m in by)tm[m]=(tm[m]||0)+by[m];
      if(sd.length||tot)rows.push([fmtD(day),sd.length,Object.entries(by).map(([m,v])=>m+' '+R(v)).join(' · ')||'—',R(tot),tot]);
    }
    const gt=rows.reduce((a,r)=>a+r[4],0);
    return{title:RELN[k],sub:'Período: '+per+' · recebido = vendas à vista, entradas e parcelas pagas, menos devoluções',head:['Dia','Vendas','Recebimentos por forma','Total do dia'],al:'lrlr',
      rows:rows.map(r=>r.slice(0,4)),foot:['Total','','',R(gt)],sum:[['Recebido no período',R(gt)],...Object.entries(tm).map(([m,v])=>[m,R(v)])]};
  }

  L.forEach(r=>{const o=by[r.sname]=by[r.sname]||{b:0,c:0};o.b+=r.base;o.c+=r.comm});
  return{title:RELN[k],sub:'Mês: '+m.split('-').reverse().join('/'),head:['Data','Cliente','Origem','Vendedor','Base','%','Comissão'],al:'llllrrr',
    rows:L.map(r=>[fmtD(r.date),r.cust,r.kind,r.sname,R(r.base),r.pct+'%',R(r.comm)]),foot:['Total','','','',R(sum(L,r=>r.base)),'',R(sum(L,r=>r.comm))],
    sum:Object.entries(by).map(([n,o])=>[n,R(o.c)+' (base '+R(o.b)+')'])};
}
