<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>window.APP_VERSION='1.3.0'</script><link rel="icon" href="favicon.png"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00468f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MultMix"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>MultMix · Sistema</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f3f7;--card:#fff;--ink:#101828;--mut:#667085;--line:#e4e7ec;--pri:#1f4fff;--tag:#ffc93c;--ok:#12805c;--bad:#c4321f}
@media(prefers-color-scheme:dark){:root{--bg:#0d1220;--card:#161d30;--ink:#eef1f8;--mut:#98a2b8;--line:#263050;--pri:#6f8cff;--tag:#ffc93c;--ok:#3ecf9a;--bad:#ff7a66}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 18px;flex-wrap:wrap}
header h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.5px}
header h1 span{background:var(--tag);color:#101828;padding:0 6px;border-radius:6px;margin-left:2px}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav button{background:transparent;border:0;color:#fff;opacity:.75;font:inherit;padding:6px 12px;border-radius:8px;cursor:pointer}
nav button.on{opacity:1;background:rgba(255,255,255,.18)}
main{max-width:1100px;margin:0 auto;padding:18px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.bar input{flex:1;min-width:200px;width:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 14px;border-radius:99px;cursor:pointer;font:inherit}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
.card:focus-visible,button:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.ph{aspect-ratio:4/3;background:var(--line) center/cover no-repeat;display:grid;place-items:center;color:var(--mut)}
.cb{padding:12px 14px 14px}.cb h3{margin:0 0 6px;font-size:16px;line-height:1.25}
.cash{display:inline-block;background:var(--tag);color:#101828;font-weight:800;font-size:20px;padding:1px 9px;border-radius:7px}
.sm{color:var(--mut);font-size:13px;margin-top:6px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.s{padding:4px 10px;font-size:13px}
#modal{position:fixed;inset:0;background:rgba(10,14,28,.6);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:20}
#modal.open{display:flex}
.box{background:var(--card);border-radius:16px;max-width:820px;width:100%;padding:20px;position:relative}
.x{position:absolute;right:12px;top:10px;font-size:24px;background:none;border:0;color:var(--mut);cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.main{aspect-ratio:1;background:var(--line) center/contain no-repeat;border-radius:12px}
.th{display:flex;gap:6px;margin-top:8px}.th div{width:56px;height:56px;border-radius:8px;background:var(--line) center/cover;cursor:pointer;border:2px solid transparent}
.th .on{border-color:var(--pri)}
.prices{display:grid;gap:8px;margin:14px 0}
.pr{display:flex;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.pr b{font-size:18px}.pr.k{background:var(--tag);color:#101828;border-color:var(--tag)}
table{width:100%;border-collapse:collapse}td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:10px}
.f label{font-size:13px;color:var(--mut);display:block}.w{grid-column:1/-1}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.sync{font-size:12px;opacity:.85}
@media print{header,.noprint{display:none}}

:root{--brand:#00468f;--pri:#00539f;--tag:#ffc21a}
@media(prefers-color-scheme:dark){:root{--pri:#2b78d6}}
header{background:linear-gradient(135deg,#002e68,var(--brand))}
header h1{color:#e9eef6}
header h1 span{background:none;color:var(--tag);padding:0;margin:0}
.lg{width:44px;height:44px;border-radius:10px}
#master{position:fixed;inset:0;background:rgba(10,14,28,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:40}
#master.open{display:flex}
.ibtn{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer}
.ibtn[hidden]{display:none}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.brand{display:flex;align-items:center;gap:10px}header h1{margin:0}
nav{display:flex;gap:4px;order:3;width:100%;margin:0;overflow-x:auto;flex-wrap:nowrap}
nav button{display:flex;align-items:center;gap:8px;white-space:nowrap;color:#fff}
nav .grp{display:none}nav .out{opacity:.85}
.sync{font-size:12px;opacity:.8}
.bdg{background:var(--tag);color:#101828;border-radius:99px;padding:0 7px;font-size:12px;margin-left:2px}
body.out header{display:none}
.login{position:fixed;inset:0;display:grid;place-items:center;padding:20px;overflow:auto;background:linear-gradient(160deg,#001f4d,#00468f 60%,#00539f);z-index:30}
.lbox{background:var(--card);border-radius:20px;padding:28px 26px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.llogo{display:block;width:min(240px,70%);max-height:240px;object-fit:contain;margin:0 auto 14px;border-radius:24px}
.lbox h2{margin:0;text-align:center}.lbox p.sm{text-align:center;margin:2px 0 14px}
.lbox label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.pwd{display:flex;gap:8px}
@media(min-width:900px){
 body.in{display:grid;grid-template-columns:240px minmax(0,1fr)}
 body.in header{position:sticky;top:0;align-self:start;height:100vh;flex-direction:column;align-items:stretch;flex-wrap:nowrap;padding:18px 12px;gap:6px;overflow-y:auto}
 .brand{padding:2px 8px 16px}
 nav{flex-direction:column;order:0;overflow:visible}
 nav button{padding:10px 12px;width:100%;text-align:left}
 nav .grp{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;padding:12px 12px 4px}
 nav button.on{box-shadow:inset 3px 0 0 var(--tag)}
 nav .out{margin-top:14px;border-top:1px solid rgba(255,255,255,.2);border-radius:0}
 .sync{margin-top:auto;padding:0 8px}
 main{width:100%}
}
.cs{margin:-4px 0 10px}.cs button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:6px;color:var(--ink);font:inherit;cursor:pointer}.cs button:hover{border-color:var(--pri)}.cs small{color:var(--mut)}
.art{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.artp{position:sticky;top:12px}
#artv svg{width:100%;height:auto;display:block;border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.thb.on,.occb.on{background:var(--pri);color:#fff;border-color:var(--pri)}
@media(max-width:900px){.art{grid-template-columns:1fr}.artp{position:static;max-width:360px;margin:0 auto}}
.appv{background:none;border:0;color:#fff;opacity:.7;font:inherit;font-size:11px;cursor:pointer;text-align:left;padding:2px 8px}
</style>
</head>
<body>
<header>
  <div class="brand"><img class="lg" src="logo-icon.png" alt="MultMix"><h1>Mult<span>Mix</span></h1></div>
  <nav id="nav"></nav>
  <button class="ibtn" data-install hidden>Instalar app</button>
  <span class="sync" id="sync"></span>
  <button type="button" class="appv" data-appver></button>
</header>
<main id="app"></main>
<div id="modal"></div>
<div id="master"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ========= CONFIG: preencha com os dados do seu projeto Supabase ========= */
const CFG={URL:'https://meswiziqgcjwxslbgmeu.supabase.co',KEY:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1lc3dpemlxZ2Nqd3hzbGJnbWV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzODg2NDcsImV4cCI6MjEwNzk2NDY0N30.ltoM4-4Z-vK8fYoZXaa7fKLBMOc0RBXrAsQlmlPW6x4',WHATS:'5593999999999',BUCKET:'produtos',MULTA:2,JURO_MES:1,ADMIN_EMAIL:'multmixeletrosevariedades@gmail.com'};
/* Sem URL/KEY o sistema roda em modo demonstração (só neste navegador). */

const sb=CFG.URL?supabase.createClient(CFG.URL,CFG.KEY):null;
const T=['products','customers','sales','installments','orders','company','company_private'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const uid=()=>crypto.randomUUID();
const now=()=>new Date().toISOString();

/* ========= Banco local (cache offline) + fila de sincronização ========= */
let db;
try{db=JSON.parse(localStorage.mm)}catch(e){}
if(!db){db={products:[],customers:[],sales:[],installments:[],orders:[],company:[],company_private:[],outbox:[]};
 [['Smart TV 50" 4K','Eletros',2399,2599,2899,['Tela: 50" LED 4K','Smart: Android TV','HDMI: 3 portas','Voltagem: Bivolt'],'Tela 4K com apps de streaming.'],
  ['Liquidificador 900W','Cozinha',169,179,199,['Potência: 900W','Copo: 2,2 L','Lâminas: aço inox','Voltagem: 127V'],'Potente e fácil de limpar.'],
  ['Ventilador de Mesa 40cm','Variedades',119,129,139,['Hélices: 6','Velocidades: 3','Potência: 80W'],'Silencioso, ideal para o calor.']
 ].forEach(p=>db.products.push({id:uid(),name:p[0],category:p[1],price_cash:p[2],price_card:p[3],price_credit:p[4],max_inst:10,stock:10,active:true,specs:p[5].map(s=>{const[k,...v]=s.split(':');return{k,v:v.join(':').trim()}}),photos:[],description:p[6],ncm:'',cfop:'5102',unit:'UN'}));}
db.orders=db.orders||[];db.company=db.company||[];db.company_private=db.company_private||[];
const save=()=>localStorage.mm=JSON.stringify(db);
let session=null;
let role=null;
const isAdmin=()=>!sb||!!role;
const ADM=()=>!sb||role==='admin';

function put(t,row,q){ // grava local + fila
  row.updated_at=now();
  const i=db[t].findIndex(r=>r.id===row.id);
  i<0?db[t].push(row):db[t][i]=row;
  if(sb)db.outbox.push({t,row});
  save();if(!q)sync();
}
let syncP=Promise.resolve();
function sync(){return syncP=syncP.then(doSync,doSync)}
async function doSync(){
  if(!sb)return setSync('modo demo (local)');
  try{
    if(role){
      while(db.outbox.length){
        const t=db.outbox[0].t;let n=0;while(n<100&&db.outbox[n]&&db.outbox[n].t===t)n++;
        const rows=[...new Map(db.outbox.slice(0,n).map(o=>[o.row.id,o.row])).values()];
        const{error}=await sb.from(t).upsert(rows);if(error)throw error;db.outbox.splice(0,n);save();}
    }
    for(const t of role?T:['products','company']){
      const{data,error}=await sb.from(t).select('*');if(error)throw error;
      if(!db.outbox.length)db[t]=data;
    }
    save();setSync('sincronizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){setSync('offline · '+db.outbox.length+' pendente(s)')}
  render();
}
const setSync=t=>$('#sync').textContent=t;
addEventListener('online',sync);

/* ========= Usuários, comissão e senha ========= */
const ROLE_N={admin:'Administrador',vendedor:'Vendedor'};
const genPw=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789',a=new Uint32Array(10);crypto.getRandomValues(a);return[...a].map(n=>c[n%c.length]).join('')+'@7'};
async function loadProf(){
  if(!sb||role!=='admin')return;
  const{data,error}=await sb.from('profiles').select('*').order('name');
  if(!error)PROF=data||[];
}
function sellerInfo(){
  const el=$('#s_v'),u=(el&&PROF.find(x=>x.id===el.value))||me||{};
  return{seller_id:u.id||null,seller_name:u.name||'',commission_pct:+u.commission_pct||0,commission_mode:u.commission_mode||'venda'};
}
async function vUsr(){
  if(!sb){$('#app').innerHTML='<p>O cadastro de usuários fica disponível quando o sistema está conectado ao Supabase.</p>';return}
  $('#app').innerHTML='<p class="sm">Carregando usuários...</p>';
  await loadProf();
  $('#app').innerHTML=`<div class="bar"><button class="btn" onclick="usrForm()">Novo usuário</button><span class="sm" style="align-self:center">${PROF.length} ${PROF.length===1?'usuário':'usuários'}</span></div>
  <div style="overflow:auto"><table><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Comissão</th><th>Situação</th><th></th></tr>
  ${PROF.map(u=>`<tr><td>${esc(u.name)}${me&&u.id===me.id?' <span class="tag">você</span>':''}</td><td>${esc(u.email||'')}</td><td>${ROLE_N[u.role]||esc(u.role)}</td>
  <td>${+u.commission_pct>0?(+u.commission_pct)+'%':'—'}</td><td>${u.active===false?'<span class="tag">Inativo</span>':'<span class="ok">Ativo</span>'}</td>
  <td><button class="btn g s" onclick="usrForm('${u.id}')">Editar</button></td></tr>`).join('')}</table></div>`;
}
function usrForm(id){
  const u=PROF.find(x=>x.id===id)||{role:'vendedor',commission_pct:0,commission_mode:'venda',active:true},nw=!id,sel=(a,b)=>a===b?'selected':'';
  modal(`<h2>${nw?'Novo usuário':'Editar usuário'}</h2><div class="f">
  <div class="w"><label>Nome completo</label><input id="u_name" value="${esc(u.name||'')}"></div>
  <div class="w"><label>E-mail (é o login)</label><input id="u_email" type="email" value="${esc(u.email||'')}" ${nw?'':'disabled'}></div>
  ${nw?`<div class="w"><label>Senha provisória (mínimo 8 caracteres)</label><div class="pwd"><input id="u_pw" value="${genPw()}"><button type="button" class="btn g s" onclick="$('#u_pw').value=genPw()">Gerar outra</button></div></div>`:''}
  <div><label>Perfil</label><select id="u_role"><option value="vendedor" ${sel(u.role,'vendedor')}>Vendedor</option><option value="admin" ${sel(u.role,'admin')}>Administrador</option></select></div>
  <div><label>Telefone</label><input id="u_phone" inputmode="tel" value="${esc(u.phone||'')}"></div>
  <div><label>Comissão (%)</label><input id="u_pct" type="number" step="0.01" min="0" max="100" value="${+u.commission_pct||0}"></div>
  <div><label>Base da comissão</label><select id="u_mode"><option value="venda" ${sel(u.commission_mode,'venda')}>Sobre a venda, no ato</option><option value="recebimento" ${sel(u.commission_mode,'recebimento')}>Sobre o valor recebido (carnê, conforme as parcelas são pagas)</option></select></div>
  ${nw?'':`<div><label>Situação</label><select id="u_active"><option value="true" ${u.active!==false?'selected':''}>Ativo</option><option value="false" ${u.active===false?'selected':''}>Inativo (sem acesso)</option></select></div>`}</div>
  <p class="sm">Vendedor: vende, atende pedidos, cadastra clientes e recebe carnês. Não vê Caixa, Fiscal, Empresa nem Usuários e não muda preços. Administrador: acesso total. A comissão vale para as vendas feitas daqui em diante, e as vendas antigas mantêm a taxa da época.</p>
  <button class="btn" onclick="usrSave('${id||''}')">Salvar</button>${nw?'':` <button class="btn g" onclick="usrPw('${id}')">Redefinir senha</button>`}`);
}
function usrSave(id){
  const g=k=>$('#u_'+k)?$('#u_'+k).value.trim():'',v={name:g('name'),email:g('email').toLowerCase(),pw:g('pw'),role:g('role'),phone:g('phone'),pct:+g('pct'),mode:g('mode'),active:g('active')!=='false'};
  if(v.name.length<3)return alert('Informe o nome completo.');
  if(!(v.pct>=0&&v.pct<=100))return alert('A comissão deve ficar entre 0 e 100%.');
  if(!id){
    if(!/^\S+@\S+\.\S+$/.test(v.email))return alert('Informe um e-mail válido.');
    if(v.pw.length<8)return alert('A senha provisória precisa ter ao menos 8 caracteres.');
  }
  master(async()=>{
    const{error}=id?await sb.rpc('admin_update_user',{p_id:id,p_name:v.name,p_role:v.role,p_commission:v.pct,p_mode:v.mode,p_phone:v.phone,p_active:v.active})
      :await sb.rpc('admin_create_user',{p_email:v.email,p_password:v.pw,p_name:v.name,p_role:v.role,p_commission:v.pct,p_mode:v.mode,p_phone:v.phone});
    if(error)return alert(error.message);
    closeM();await vUsr();
    if(!id)alert('Usuário criado.\n\nLogin: '+v.email+'\nSenha provisória: '+v.pw+'\n\nPasse esses dados ao usuário e peça para trocar a senha em "Alterar senha".');
  });
}
function usrPw(id){
  master(()=>{
    const u=PROF.find(x=>x.id===id)||{};
    modal(`<h2>Redefinir senha</h2><p class="sm">Nova senha provisória para <b>${esc(u.name)}</b>:</p><div class="pwd"><input id="u_pw2" value="${genPw()}"><button type="button" class="btn g s" onclick="$('#u_pw2').value=genPw()">Gerar outra</button></div>
    <p><button class="btn" onclick="usrPwGo('${id}')">Salvar nova senha</button></p>`);
  });
}
async function usrPwGo(id){
  const p=$('#u_pw2').value.trim();if(p.length<8)return alert('A senha precisa ter ao menos 8 caracteres.');
  const{error}=await sb.rpc('admin_set_password',{p_user:id,p_password:p});
  if(error)return alert(error.message);
  closeM();alert('Senha redefinida. Passe ao usuário: '+p);
}
function pwForm(){
  modal(`<h2>Alterar minha senha</h2><div class="f"><div class="w"><label>Nova senha (mínimo 8 caracteres)</label><input id="p_1" type="password" autocomplete="new-password"></div>
  <div class="w"><label>Repita a nova senha</label><input id="p_2" type="password" autocomplete="new-password"></div></div><button class="btn" onclick="pwSave()">Salvar senha</button>`);
}
async function pwSave(){
  const a=$('#p_1').value,b=$('#p_2').value;
  if(a.length<8)return alert('A senha precisa ter ao menos 8 caracteres.');
  if(a!==b)return alert('As duas senhas não são iguais.');
  const{error}=await sb.auth.updateUser({password:a});
  if(error)return alert('Não foi possível alterar: '+error.message);
  closeM();alert('Senha alterada.');
}

/* ========= Comissões ========= */
let comMonth='',comSel='todos';
function comRows(m,sel){
  const out=[],cn=id=>(db.customers.find(c=>c.id===id)||{}).name||'Balcão';
  db.sales.filter(s=>!s.canceled_at&&(sel==='todos'||s.seller_id===sel)).forEach(s=>{
    const mode=s.commission_mode||'venda',pct=+s.commission_pct||0,rec=s.pay_type==='crediario'&&mode==='recebimento';
    if(ld(s.created_at).slice(0,7)===m){
      const base=rec?+s.entry:+s.total;
      if(base>0)out.push({s,date:ld(s.created_at),cust:cn(s.customer_id),kind:rec?'Entrada':'Venda',base,pct});
    }
    if(rec)db.installments.filter(i=>i.sale_id===s.id&&i.paid_at&&ld(i.paid_at).slice(0,7)===m)
      .forEach(i=>out.push({s,date:ld(i.paid_at),cust:cn(s.customer_id),kind:'Parcela '+i.number,base:+i.amount,pct}));
  });
  out.forEach(r=>{r.sid=r.s.seller_id||'';r.sname=r.s.seller_name||'Sem vendedor';r.comm=+(r.base*r.pct/100).toFixed(2)});

    let ver=1;
    for(;ver<=40;ver++){const cc=ver<10?8:16;if(4+cc+bytes.length*8<=(Math.floor(raw(ver)/8)-ECC[ver]*BLK[ver])*8)break}

})();

function pixPayload({key,name,city,amount,txid}){
  const mai=emv('00','BR.GOV.BCB.PIX')+emv('01',key);
  const p=emv('00','01')+emv('01','11')+emv('26',mai)+emv('52','0000')+emv('53','986')+(amount>0?emv('54',(+amount).toFixed(2)):'')

function pixNorm(t,v){
  v=(v||'').trim();
  if(t==='cpf'||t==='cnpj')return digits(v);
  if(t==='telefone'){let d=digits(v);if(d.startsWith('55')&&d.length>=12)d=d.slice(2);return d?'+55'+d:''}
  return v.toLowerCase();
}
function pixOk(t,k){
  if(t==='cpf')return okCpf(k);if(t==='cnpj')return okCnpj(k);
  if(t==='telefone')return /^\+55\d{10,11}$/.test(k);
  if(t==='email')return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(k)&&k.length<=77;
  return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(k);
}
const pixShow=(t,k)=>t==='cpf'?fmtDoc(k):t==='cnpj'?fmtCnpj(k):k;
const fmtD=iso=>String(iso||'').slice(0,10).split('-').reverse().join('/');
async function logoJpeg(){
  try{
    const b=await(await fetch(logoIcon())).blob();
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(b)});
    const cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;
    const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(img,0,0);
    const bin=atob(cv.toDataURL('image/jpeg',.92).split(',')[1]),bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    return{w:cv.width,h:cv.height,bytes};
  }catch(e){return null}
}

  }catch(e){modal('<h2>Não foi possível gerar o carnê</h2><p class="bad">'+esc(e&&e.message||e)+'</p>')}

async function artBlobData(blob,max){
  const u=URL.createObjectURL(blob);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('img'));i.src=u});
    const k=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement('canvas');
    cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
    const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(img,0,0,cv.width,cv.height);
    return cv.toDataURL('image/jpeg',.9);
  }finally{URL.revokeObjectURL(u)}
}
async function artUrlData(url,max){
  if(artCache.has(url))return artCache.get(url);
  const r=await fetch(url);if(!r.ok)throw new Error('http');
  const d=await artBlobData(await r.blob(),max);artCache.set(url,d);return d;
}

/* ========= Importar produtos (xlsx / csv) ========= */
const norm=h=>String(h??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const ALI={name:['nome','nome do produto','produto','item','descricao'],category:['categoria','grupo','departamento','setor'],
 price_cash:['preco a vista','a vista','preco venda','preco de venda','preco','valor','venda'],price_card:['preco cartao','cartao'],
 price_credit:['preco carne','preco crediario','carne','crediario'],stock:['estoque','quantidade','qtd','saldo'],ncm:['ncm'],cfop:['cfop'],
 unit:['unidade','un','und'],max_inst:['parcelas','max parcelas','max inst'],description:['detalhes','descricao detalhada','observacao','descricao'],
 photos:['fotos','foto','imagens','imagem','links','url'],specs:['especificacoes','ficha tecnica','caracteristicas']};
function num(v){
  if(typeof v==='number')return v;
  let s=String(v??'').replace(/[R$\s]/g,'');if(!s)return 0;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  return parseFloat(s)||0;
}
function csvParse(t,d){
  const rows=[];let row=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===d){row.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(c);c='';if(row.some(x=>x!==''))rows.push(row);row=[]}
    else c+=ch}
  row.push(c);if(row.some(x=>x!==''))rows.push(row);
  const h=rows.shift()||[];return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??''])));
}
function impMap(rows,existing,newId){
  const hs=Object.keys(rows[0]||{}),nh=hs.map(norm),col={};
  const find=(al,skip)=>{for(const a of al){const i=nh.indexOf(a);if(i>=0&&hs[i]!==skip)return hs[i]}};
  col.name=find(ALI.name);
  for(const k of Object.keys(ALI))if(k!=='name')col[k]=find(ALI[k],col.name);
  const map=new Map();let skip=0;
  rows.forEach(r=>{
    const g=k=>col[k]!=null?r[col[k]]:undefined,has=k=>g(k)!=null&&String(g(k)).trim()!=='';
    const name=String(g('name')??'').trim(),cash=num(g('price_cash'));
    if(!name||!(cash>0)){skip++;return}
    const key=name.toLowerCase();
    const old=existing.find(p=>p.name.toLowerCase()===key)||map.get(key);
    const card=col.price_card!=null?(num(g('price_card'))||null):(old?old.price_card??null:null),cred=col.price_credit!=null?(num(g('price_credit'))||null):(old?old.price_credit??null:null);
    const photos=String(g('photos')??'').split(/[\s|;]+/).filter(u=>/^https?:\/\//.test(u)).slice(0,5);
    const specs=String(g('specs')??'').split(/\||;|\n/).map(s=>s.trim()).filter(Boolean).map(l=>{const[k,...v]=l.split(':');return{k:k.trim(),v:v.join(':').trim()}}).filter(s=>s.k&&s.v);
    map.set(key,{...(old||{id:newId(),active:true,cfop:'5102',unit:'UN',stock:0,max_inst:10,photos:[],specs:[]}),
      name,price_cash:cash,price_card:card,price_credit:cred,
      ...(has('category')?{category:String(g('category')).trim()}:{}),
      ...(has('description')?{description:String(g('description')).trim()}:{}),
      ...(has('ncm')?{ncm:String(g('ncm')).trim()}:{}),...(has('cfop')?{cfop:String(g('cfop')).trim()}:{}),
      ...(has('unit')?{unit:String(g('unit')).trim().toUpperCase()}:{}),
      ...(has('stock')?{stock:Math.round(num(g('stock')))}:{}),...(has('max_inst')?{max_inst:Math.round(num(g('max_inst')))||10}:{}),
      ...(photos.length?{photos}:{}),...(specs.length?{specs}:{})});
  });
  return{out:[...map.values()],skip,cols:col};
}

/* ========= Entrada de estoque por XML da NF-e de compra ========= */
let XML=null;
function xmlOpen(){
  XML=null;
  modal(`<h2>Entrada por XML (NF-e do fornecedor)</h2><p class="sm">Envie o XML da nota de compra. O sistema lê os itens, reconhece os produtos que você já tem (por código de barras, código do fornecedor ou nome) e soma a quantidade ao estoque. Produto novo é criado <b>inativo</b> e com preço zero: defina os preços antes de ativar, para não aparecer no catálogo sem valor.</p>
  <input type="file" id="xmlf" accept=".xml,text/xml" onchange="xmlRead(this)"><div id="xmlv" style="margin-top:12px"></div>`);
}
function xmlRead(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{
    try{
      const d=new DOMParser().parseFromString(r.result,'text/xml');
      if(d.getElementsByTagName('parsererror').length)throw new Error('xml');
      const t=(el,n)=>{const x=el&&el.getElementsByTagName(n)[0];return x?x.textContent.trim():''};
      const inf=d.getElementsByTagName('infNFe')[0];if(!inf)throw new Error('Este arquivo não é uma NF-e (infNFe não encontrado).');
      const key=(inf.getAttribute('Id')||'').replace(/\D/g,''),em=inf.getElementsByTagName('emit')[0];
      const items=[...inf.getElementsByTagName('det')].map(det=>{
        const pr=det.getElementsByTagName('prod')[0],ean=t(pr,'cEAN'),ean2=t(pr,'cEANTrib');
        return{code:t(pr,'cProd'),ean:/^\d{8,14}$/.test(ean)?ean:/^\d{8,14}$/.test(ean2)?ean2:'',name:t(pr,'xProd'),ncm:t(pr,'NCM'),cest:t(pr,'CEST'),un:t(pr,'uCom')||'UN',
          qty:Math.round(parseFloat(t(pr,'qCom'))||0),cost:+(parseFloat(t(pr,'vUnCom'))||0).toFixed(2)};
      }).filter(i=>i.qty>0);
      if(!items.length)throw new Error('Nenhum item com quantidade encontrado.');
      items.forEach(i=>{
        const p=(i.ean&&db.products.find(x=>x.ean===i.ean))||db.products.find(x=>x.supplier_code&&x.supplier_code===i.code&&i.code)||db.products.find(x=>norm(x.name)===norm(i.name));
        i.pid=p?p.id:'novo';
      });
      XML={key,num:t(inf.getElementsByTagName('ide')[0],'nNF'),forn:t(em,'xNome'),cnpj:t(em,'CNPJ'),items};
      xmlView();
    }catch(e){$('#xmlv').innerHTML=`<p class="bad">${esc(e.message==='xml'?'Não foi possível ler o arquivo. Envie o XML original da nota.':e.message)}</p>`}
  };r.readAsText(f);
}
function xmlDone(){try{return JSON.parse(localStorage.mmxml||'[]')}catch(e){return[]}}
function xmlView(){
  const x=XML,dup=x.key&&xmlDone().includes(x.key);
  $('#xmlv').innerHTML=`<p><b>${esc(x.forn)}</b> · NF ${esc(x.num)} · ${x.items.length} item(ns)</p>
  ${dup?'<p class="bad">Esta nota já foi lançada neste aparelho. Confirme só se tiver certeza, senão o estoque será somado de novo.</p>':''}
  <div style="overflow:auto"><table><tr><th>Item da nota</th><th>Qtd</th><th>Custo</th><th>Vai para</th></tr>
  ${x.items.map((i,ix)=>`<tr><td>${esc(i.name)}<div class="sm">${i.ean?'EAN '+i.ean+' · ':''}cód. ${esc(i.code)}</div></td><td>${i.qty}</td><td>${R(i.cost)}</td>
  <td><select onchange="XML.items[${ix}].pid=this.value;xmlView()"><option value="novo" ${i.pid==='novo'?'selected':''}>Cadastrar produto novo</option><option value="ignorar" ${i.pid==='ignorar'?'selected':''}>Ignorar este item</option>
  ${[...db.products].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')).map(p=>`<option value="${p.id}" ${i.pid===p.id?'selected':''}>${esc(p.name)} (estoque ${p.stock})</option>`).join('')}</select></td></tr>`).join('')}</table></div>
  <p><label><input type="checkbox" id="xml_cost" checked style="width:auto"> Atualizar o custo dos produtos</label></p>
  <button class="btn" onclick="xmlApply()">Dar entrada no estoque</button>`;
}
function xmlApply(){
  const x=XML;if(!x)return;
  const upd=$('#xml_cost').checked;let a=0,n=0;
  x.items.forEach(i=>{
    if(i.pid==='ignorar')return;
    if(i.pid==='novo'){
      put('products',{id:uid(),name:i.name,category:'',description:'',price_cash:0,price_card:null,price_credit:null,max_inst:10,stock:i.qty,active:false,ncm:i.ncm,cfop:'5102',unit:i.un,cest:i.cest,csosn:'102',specs:[],photos:[],ean:i.ean||null,supplier_code:i.code||null,cost:i.cost||null});n++;
    }else{
      const p=db.products.find(y=>y.id===i.pid);if(!p)return;
      put('products',{...p,stock:(+p.stock||0)+i.qty,ean:p.ean||i.ean||null,supplier_code:p.supplier_code||i.code||null,ncm:p.ncm||i.ncm,...(upd&&i.cost?{cost:i.cost}:{})});a++;
    }
  });
  if(x.key){const l=xmlDone();l.push(x.key);localStorage.mmxml=JSON.stringify(l.slice(-200))}
  closeM();XML=null;render();
  alert(`Entrada concluída: ${a} produto(s) atualizado(s) e ${n} cadastrado(s)${n?' (inativos, sem preço: defina os preços e ative)':''}.`);
}

async function impRead(inp){
  const f=inp.files[0];if(!f)return;
  let rows;
  try{
    const buf=await f.arrayBuffer();
    if(/\.csv$/i.test(f.name)){
      let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){t=new TextDecoder('windows-1252').decode(buf)}
      t=t.replace(/^\ufeff/,'');const l=t.split(/\r?\n/)[0]||'';
      const d=[';','\t',','].map(x=>[x,l.split(x).length]).sort((a,b)=>b[1]-a[1])[0][0];
      rows=csvParse(t,d);
    }else{
      if(typeof XLSX==='undefined')return alert('A biblioteca de planilhas não carregou. Verifique a internet.');
      const wb=XLSX.read(buf,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:true});
    }
  }catch(e){return alert('Não consegui ler o arquivo.')}
  if(!rows.length)return alert('A planilha está vazia.');
  const{out,skip,cols}=impMap(rows,db.products,uid);
  if(cols.name==null)return $('#impv').innerHTML='<p class="bad">Não achei a coluna do nome do produto. Use o modelo para conferir os títulos das colunas.</p>';
  if(cols.price_cash==null)return $('#impv').innerHTML='<p class="bad">Não achei a coluna do preço à vista. Use o modelo para conferir os títulos das colunas.</p>';
  imp=out;const novos=out.filter(p=>!db.products.some(x=>x.id===p.id)).length;
  $('#impv').innerHTML=`<p><b>${novos} novos</b> · ${out.length-novos} atualizações · ${skip} linhas ignoradas (sem nome ou sem preço)</p>
  <div style="overflow:auto;max-height:260px"><table><tr><th>Produto</th><th>Categoria</th><th>À vista</th><th>Estoque</th></tr>
  ${out.slice(0,50).map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.category||'')}</td><td>${R(p.price_cash)}</td><td>${p.stock}</td></tr>`).join('')}</table></div>
  ${out.length>50?'<p class="sm">Mostrando os 50 primeiros.</p>':''}<p><button class="btn" onclick="impGo()">Importar ${out.length} produtos</button></p>`;
}
function impGo(){
  const chg=imp.some(p=>{const o=db.products.find(x=>x.id===p.id);return o&&['price_cash','price_card','price_credit'].some(k=>(+o[k]||0)!==(+p[k]||0))});
  const go=()=>{imp.forEach(p=>put('products',p,true));sync();closeM();alert(imp.length+' produtos importados.');imp=[];render()};

/* ========= Importar clientes e fornecedores (csv / xlsx) ========= */
const CALI={name:['nome razao social','razao social','nome completo','nome','cliente','fornecedor','empresa'],trade_name:['nome fantasia','fantasia'],
 cpf:['cpf cnpj','cpf ou cnpj','cnpj cpf','documento','cpf','cnpj'],ie:['inscricao estadual','ie'],
 phone:['telefone whatsapp','telefone','celular','whatsapp','fone'],email:['e mail','email'],cep:['cep'],street:['endereco','rua logradouro','logradouro','rua'],
 number:['numero','num'],complement:['complemento'],district:['bairro'],city:['cidade','municipio'],uf:['uf','estado'],ibge:['codigo ibge','cod ibge','ibge'],
 kind:['tipo de cadastro','cadastro'],person:['tipo de pessoa','pessoa'],tipo:['tipo'],active:['situacao','status','ativo']};
async function readTable(f){
  const buf=await f.arrayBuffer();
  if(/\.(csv|txt)$/i.test(f.name)){
    let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){t=new TextDecoder('windows-1252').decode(buf)}
    t=t.replace(/^\ufeff/,'');const l=t.split(/\r?\n/)[0]||'';
    const d=[';','\t',','].map(x=>[x,l.split(x).length]).sort((a,b)=>b[1]-a[1])[0][0];
    return csvParse(t,d);
  }
  if(typeof XLSX==='undefined')throw new Error('xlsx');
  const wb=XLSX.read(buf,{type:'array'});
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});
}
function cliMap(rows,existing,newId){
  const hs=Object.keys(rows[0]||{}),nh=hs.map(norm),col={};
  for(const k of Object.keys(CALI)){if(k==='cpf')continue;for(const a of CALI[k]){const i=nh.indexOf(a);if(i>=0){col[k]=hs[i];break}}}
  const docCols=hs.filter((h,i)=>CALI.cpf.includes(nh[i]));
  const map=new Map();let skip=0,bad=0;
  rows.forEach(r=>{
    const g=k=>col[k]!=null?String(r[col[k]]??'').trim():'';
    const name=g('name');if(!name){skip++;return}
    let d=digits(docCols.map(h=>String(r[h]??'').trim()).find(Boolean)||'');
    if(d.length===10)d=d.padStart(11,'0');if(d.length===13)d=d.padStart(14,'0');
    let doc='',note='';
    if(d){if((d.length===11&&okCpf(d))||(d.length===14&&okCnpj(d)))doc=fmtDoc(d);else{bad++;note='CPF/CNPJ inválido (importado sem documento)'}}
    const key=doc?digits(doc):'n:'+norm(name);
    const old=(doc&&existing.find(c=>digits(c.cpf)===digits(doc)))||(!doc&&existing.find(c=>norm(c.name)===norm(name)))||map.get(key)?.row;
    const kt=g('kind')||g('tipo'),pt=g('person')||g('tipo'),at=g('active');
    const kind=/forn/i.test(kt)?'fornecedor':/client/i.test(kt)?'cliente':(old&&old.kind)||'cliente';
    const person=d.length===14?'PJ':/jur|^pj$/i.test(pt)?'PJ':/fis|^pf$/i.test(pt)?'PF':(old&&old.person_type)||'PF';
    const act=at?!/inativ|^n(ã|a)o$|^0$|^false$/i.test(at):(old?old.active!==false:true);
    const o=(k,fn=x=>x)=>g(k)?{[k]:fn(g(k))}:{};
    const row={...(old||{id:newId(),active:true}),name,kind,person_type:person,active:act,cpf:doc||(old&&old.cpf)||'',
      ...o('trade_name'),...o('ie'),...o('phone'),...o('email',x=>x.toLowerCase()),...o('cep',x=>x.replace(/^(\d{5})-?(\d{3})$/,'$1-$2')),
      ...o('street'),...o('number'),...o('complement'),...o('district'),...o('city'),...o('uf',x=>x.toUpperCase().slice(0,2)),...o('ibge',x=>digits(x))};
    map.set(key,{row,note,isNew:!existing.some(c=>c.id===row.id)});
  });
  return{out:[...map.values()],skip,bad,cols:col,hasDoc:docCols.length>0};
}

const tc=s=>(s||'').toLowerCase().replace(/(^|[\s\/-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()).replace(/\b(Da|De|Do|Das|Dos|E)\b/g,x=>x.toLowerCase());

async function cnpjLookup(force){
  const d=digits($('#k_cpf').value),st=$('#k_st');
  if(d.length!==14||!okCnpj(d)){st.className='sm bad';st.textContent='Digite um CNPJ válido para buscar.';return}
  st.className='sm';st.textContent='Buscando dados na Receita Federal...';
  let j=null;
  for(const u of ['https://brasilapi.com.br/api/cnpj/v1/'+d,'https://minhareceita.org/'+d]){
    try{const res=await fetch(u);if(res.ok){j=await res.json();break}}catch(e){}
  }
  if(!j){st.className='sm bad';st.textContent='Não consegui consultar agora (sem internet ou CNPJ não encontrado). Preencha manualmente.';return}
  const F=cnpjFields(j);$('#k_person_type').value='PJ';
  Object.entries(F).forEach(([k,v])=>{const e=$('#k_'+k);if(e&&v&&(force||!e.value.trim()))e.value=v});
  const sit=j.descricao_situacao_cadastral||'';
  st.className='sm '+(sit&&sit.toUpperCase()!=='ATIVA'?'bad':'ok');
  st.textContent='Dados preenchidos pela Receita Federal'+(sit?'. Situação cadastral: '+sit:'')+'. Confira e informe a inscrição estadual.';
}
function okCpf(v){
  const c=digits(v);if(c.length!==11||/^(\d)\1+$/.test(c))return false;
  const dv=n=>{let s=0;for(let i=0;i<n;i++)s+=c[i]*(n+1-i);const m=(s*10)%11;return m===10?0:m};
  return dv(9)==c[9]&&dv(10)==c[10];
}

const ld=iso=>{const d=new Date(iso);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};

function due(i){
  const dl=i.paid_at?0:days(i.due_date);
  if(dl<=0)return{v:+i.amount,fee:0,dl:0};
  const fee=+(i.amount*CFG.MULTA/100+i.amount*(CFG.JURO_MES/100)/30*dl).toFixed(2);
  return{v:+(i.amount+fee).toFixed(2),fee,dl};
}

  <div class="pr"><span>Vendas do dia</span><b>${sdOk.length}</b></div>
  <div class="pr"><span>Vendido no mês (${mes.split('-').reverse().join('/')})</span><b>${R(vm)}</b></div>
  <div class="pr"><span>Carnês a receber</span><b>${R(sum(open))}</b></div>
  <div class="pr"><span class="bad">Em atraso (${late.length} parcelas)</span><b class="bad">${R(sum(late))}</b></div></div>
  ${sd.length?`<h3>Vendas do dia</h3><table>${sd.map(s=>`<tr><td>${new Date(s.created_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</td><td>${esc((db.customers.find(c=>c.id===s.customer_id)||{}).name||'Balcão')}</td><td>${{avista:'À vista',cartao:'Cartão',crediario:'Carnê'}[s.pay_type]}</td><td>${s.canceled_at?`<s>${R(s.total)}</s> <span class="tag">cancelada</span>`:R(s.total)}</td><td>${s.canceled_at?'':`<button class="btn g s" onclick="cancelSale('${s.id}')">Cancelar</button>`}</td></tr>`).join('')}</table>`:''}
  ${devs.length?`<p class="sm">Devoluções de hoje: ${devs.map(s=>R(s.refund_amount)+' ('+esc(s.refund_method||'—')+')').join(' · ')}</p>`:''}`;
}

/* ========= Fiscal (controle de NFC-e) ========= */
function fisCheck(s){
  const p=[],c=db.customers.find(x=>x.id===s.customer_id)||{},co=CO(),nfe=s.doc_type==='nfe',d=digits(c.cpf);
  if(!okCnpj(co.cnpj))p.push('CNPJ da empresa');
  if(!co.ie)p.push('Inscrição estadual da empresa');
  if(!co.regime)p.push('Regime tributário da empresa');
  if(!(co.street&&co.number&&co.district&&co.city&&co.uf&&co.cep&&co.ibge))p.push('Endereço da empresa (com código IBGE)');
  s.items.forEach(i=>{const pr=db.products.find(x=>x.id===i.id)||{};
    if(digits(i.ncm||pr.ncm).length!==8)p.push('NCM de '+i.name);
    if(!(i.cfop||pr.cfop))p.push('CFOP de '+i.name);
    if(/Simples|MEI/.test(co.regime||'')&&!(i.csosn||pr.csosn))p.push('CSOSN de '+i.name)});
  if(nfe){
    if(!c.id)p.push('Cliente (obrigatório na NF-e)');
    else{
      if(!(d.length===11?okCpf(d):d.length===14?okCnpj(d):false))p.push('CPF ou CNPJ válido do cliente');
      if(!(c.street&&c.number&&c.district&&c.city&&c.uf&&c.cep&&c.ibge))p.push('Endereço completo do cliente (com IBGE)');
      if(d.length===14&&!c.ie)p.push('Inscrição estadual do cliente (ou ISENTO)');
    }
  }else if(d&&!(d.length===11&&okCpf(d)))p.push('CPF do cliente inválido');
  return[...new Set(p)];
}
const DOC={nfce:'NFC-e (65)',nfe:'NF-e (55)'};
function vFis(){
  const l=[...db.sales].filter(s=>!s.canceled_at||s.fiscal_status==='emitida').sort((a,b)=>b.created_at.localeCompare(a.created_at));
  const rows=l.map(s=>({s,p:s.fiscal_status==='emitida'?[]:fisCheck(s)}));
  const pend=rows.filter(x=>x.s.fiscal_status!=='emitida'&&!x.s.canceled_at),prontas=pend.filter(x=>!x.p.length).length;
  $('#app').innerHTML=`<p class="sm">Confira aqui, antes de emitir, se faltam dados para a NFC-e (modelo 65, consumidor final) ou para a NF-e (modelo 55, cliente identificado). A emissão automática depende da integração com o microsserviço fiscal.</p>
  <div class="prices"><div class="pr"><span>Pendentes de emissão</span><b>${pend.length}</b></div><div class="pr"><span>Prontas para emitir</span><b class="ok">${prontas}</b></div><div class="pr"><span>Com pendências de dados</span><b class="${pend.length-prontas?'bad':''}">${pend.length-prontas}</b></div></div>
  <div class="bar"><button class="btn" onclick="csvFis()">Exportar pendentes (CSV)</button></div>
  <div style="overflow:auto"><table><tr><th>Data</th><th>Cliente</th><th>Total</th><th>Documento</th><th>Situação</th><th></th></tr>${rows.map(({s,p})=>{const c=db.customers.find(x=>x.id===s.customer_id)||{},em=s.fiscal_status==='emitida';return`<tr>
  <td>${s.created_at.slice(0,10).split('-').reverse().join('/')}</td><td>${esc(c.name||'Balcão')}</td><td>${R(s.total)}</td><td>${DOC[s.doc_type]||DOC.nfce}</td>
  <td>${s.canceled_at?'<span class="bad">Venda cancelada: cancele esta nota na SEFAZ</span>':em?'<span class="ok">Emitida</span>':p.length?`<span class="bad">${p.length} pendência(s)</span><div class="sm">${p.slice(0,3).map(esc).join('<br>')}${p.length>3?`<br>+${p.length-3} outras`:''}</div>`:'<span class="ok">Pronta para emitir</span>'}</td>
  <td>${em?'':`<button class="btn g s" onclick="fisEdit('${s.id}')">Documento</button> ${c.id?`<button class="btn g s" onclick="cliForm('${c.id}')">Cliente</button> `:''}<button class="btn g s" onclick="fisAsk('${s.id}')">Marcar emitida</button>`}</td></tr>`}).join('')}</table></div>`;
}
function fisEdit(id){
  const s=db.sales.find(x=>x.id===id);
  modal(`<h2>Documento fiscal da venda</h2><div class="f">
  <div class="w"><label>Tipo de documento</label><select id="x_t"><option value="nfce" ${s.doc_type!=='nfe'?'selected':''}>NFC-e (modelo 65) · consumidor final</option><option value="nfe" ${s.doc_type==='nfe'?'selected':''}>NF-e (modelo 55) · cliente identificado</option></select></div>
  <div class="w"><label>Cliente</label><select id="x_c"><option value="">Balcão (sem cliente)</option>${[...db.customers].filter(c=>(c.kind||'cliente')==='cliente').sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${c.id}" ${c.id===s.customer_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
  <div class="w"><label>Natureza da operação</label><input id="x_n" value="${esc(s.nat_op||'Venda de mercadoria')}"></div>
  <div class="w"><label>Frete</label><select id="x_f">${[['9','Sem frete'],['0','Por conta do emitente'],['1','Por conta do destinatário']].map(([k,l])=>`<option value="${k}" ${(s.freight||'9')===k?'selected':''}>${l}</option>`).join('')}</select></div></div>
  <button class="btn" onclick="fisEditSave('${id}')">Salvar</button>`);
}
function fisEditSave(id){
  put('sales',{...db.sales.find(x=>x.id===id),doc_type:$('#x_t').value,customer_id:$('#x_c').value||null,nat_op:$('#x_n').value.trim()||'Venda de mercadoria',freight:$('#x_f').value});
  closeM();vFis();
}
function fisAsk(id){modal(`<h2>Marcar como emitida</h2><label class="sm">Chave de acesso da nota (44 dígitos)</label><input id="fk" inputmode="numeric" maxlength="44"><p><button class="btn" onclick="fisSave('${id}')">Salvar</button></p>`)}
function fisSave(id){
  const k=digits(fk.value);if(k.length!==44)return alert('A chave de acesso tem 44 dígitos.');
  master(()=>{put('sales',{...db.sales.find(x=>x.id===id),fiscal_status:'emitida',fiscal_key:k});closeM();vFis()});
}
function csvFis(){
  const rows=[['data','documento','cliente','cpf_cnpj','ie','cep','endereco','numero','bairro','cidade','uf','ibge','natureza','frete','produto','ncm','cfop','csosn','un','qtd','valor_unit','valor_total']];
  db.sales.filter(s=>s.fiscal_status!=='emitida'&&!s.canceled_at).forEach(s=>{const c=db.customers.find(x=>x.id===s.customer_id)||{};
    s.items.forEach(i=>rows.push([s.created_at.slice(0,10),s.doc_type==='nfe'?'NF-e 55':'NFC-e 65',c.name||'',c.cpf||'',c.ie||'',c.cep||'',c.street||'',c.number||'',c.district||'',c.city||'',c.uf||'',c.ibge||'',s.nat_op||'Venda de mercadoria',s.freight||'9',i.name,i.ncm||'',i.cfop||'',i.csosn||'',i.unit||'UN',i.qty,i.price,(i.price*i.qty).toFixed(2)]))});
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='pendentes-fiscal.csv';a.click();
}
