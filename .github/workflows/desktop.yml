# Gera o instalador do MultMix PDV (Windows). Como usar: no GitHub, aba "Actions" > "Instalador MultMix (Windows)" > "Run workflow".
# Quando terminar, abra a execução e baixe o arquivo em "Artifacts" (MultMix-Instalador).
name: Instalador MultMix (Windows)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Embutir os programas no instalador
        shell: bash
        run: |
          mkdir -p desktop/app-files
          for d in sistema pdv catalogo ibpt; do if [ -d "$d" ]; then cp -r "$d" desktop/app-files/; fi; done
          rm -rf desktop/app-files/*/node_modules
      - name: Instalar e gerar
        working-directory: desktop
        run: |
          npm install
          npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: MultMix-Instalador
          path: desktop/dist/*.exe
