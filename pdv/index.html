<header>
  <div class="brand"><img class="lg" src="logo-icon.png" alt="MultMix"><h1>Mult<span>Mix</span> PDV</h1></div>
  <nav id="nav"></nav>
  <button class="ibtn" data-install hidden>Instalar app</button>
  <span class="sync" id="sync"></span>
  <button type="button" class="appv" data-appver></button>
  <button type="button" class="appv" data-appforce></button>
</header>
<main id="app"></main>
<div id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ========= MultMix PDV: app do vendedor (independente do sistema) =========
   O vendedor só enxerga produtos SEM custo, vende e vê as próprias vendas/comissão.
   Preço, vendedor e comissão da venda são definidos pelo servidor (função pdv_sell no Supabase, supabase-v26.sql). */
const CFG={URL:'https://meswiziqgcjwxslbgmeu.supabase.co',KEY:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1lc3dpemlxZ2Nqd3hzbGJnbWV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzODg2NDcsImV4cCI6MjEwNzk2NDY0N30.ltoM4-4Z-vK8fYoZXaa7fKLBMOc0RBXrAsQlmlPW6x4'};
const sb=supabase.createClient(CFG.URL,CFG.KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const uid=()=>crypto.randomUUID(),now=()=>new Date().toISOString();
const norm=h=>String(h??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const digits=v=>String(v||'').replace(/\D/g,'');
const fmtD=iso=>String(iso||'').slice(0,10).split('-').reverse().join('/');
const ld=iso=>{const d=new Date(iso);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let ME=LS.get('pdv_me',null),P=LS.get('pdv_prod',[]),Q=LS.get('pdv_q',[]),FAIL=LS.get('pdv_fail',[]),CO=LS.get('pdv_co',{}),MY=[],COM=0,view='login',cart=[],selCli=null,loginMsg='';
const saveQ=()=>{LS.set('pdv_q',Q);LS.set('pdv_fail',FAIL)};
const mine=()=>Q.filter(s=>s._by===(ME&&ME.id)),setSync=t=>{const e=$('#sync');if(e)e.textContent=t};

/* ----- entrar / sair ----- */
function vLogin(){
  document.body.className='out';$('#nav').innerHTML='';
  $('#app').innerHTML=`<div class="login"><form class="lbox" onsubmit="login(event)"><img src="logo-icon.png" alt="MultMix" class="llogo">
  <h2>PDV · Vendedor</h2><p class="sm">Entre com seu e-mail e senha.</p>
  <label for="em">E-mail</label><input id="em" type="email" autocomplete="username" required>
  <label for="pw">Senha</label><div class="pwd"><input id="pw" type="password" autocomplete="current-password" required>
  <button type="button" class="btn g s" onclick="const p=$('#pw');p.type=p.type==='password'?'text':'password';this.textContent=p.type==='password'?'Mostrar':'Ocultar'">Mostrar</button></div>
  <button class="btn" id="lb" style="width:100%;margin-top:16px">Entrar</button><p id="err" class="bad" role="alert" style="text-align:center;min-height:1.4em">${esc(loginMsg)}</p></form></div>`;
  setTimeout(()=>$('#em')&&$('#em').focus(),50);
}
async function login(e){
  e.preventDefault();const b=$('#lb'),er=$('#err');b.disabled=true;er.textContent='';
  const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  b.disabled=false;
  if(error){er.textContent=/fetch|network/i.test(error.message)?'Sem internet. Conecte-se para entrar.':'E-mail ou senha incorretos.';return}
  if(await mfaNeeded())return vMfa();
  await start();
}
async function mfaNeeded(){try{const{data}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();return !!(data&&data.nextLevel==='aal2'&&data.currentLevel!=='aal2')}catch(e){return false}}
function vMfa(){
  $('#app').innerHTML=`<div class="login"><form class="lbox" onsubmit="mfaLogin(event)"><img src="logo-icon.png" alt="MultMix" class="llogo"><h2>Verificação em 2 etapas</h2>
  <p class="sm">Digite o código de 6 dígitos do aplicativo autenticador.</p><input id="mf" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
  <button class="btn" id="mb" style="width:100%;margin-top:16px">Confirmar</button><p id="err" class="bad" role="alert" style="text-align:center;min-height:1.4em"></p>
  <button type="button" class="btn g s" onclick="logout(true)">Voltar</button></form></div>`;setTimeout(()=>$('#mf')&&$('#mf').focus(),50);
}
async function mfaLogin(e){
  e.preventDefault();const er=$('#err');er.textContent='';
  try{const{data:f}=await sb.auth.mfa.listFactors(),t=(f.totp||[]).find(x=>x.status==='verified');if(!t)throw new Error('Nenhum autenticador cadastrado.');
    const{error}=await sb.auth.mfa.challengeAndVerify({factorId:t.id,code:$('#mf').value.trim()});if(error)throw error;await start()}
  catch(x){er.textContent='Código incorreto ou expirado.'}
}
async function logout(force){
  if(!force&&mine().length&&!confirm('Há '+mine().length+' venda(s) ainda não enviada(s). Elas ficam guardadas neste aparelho e serão enviadas quando você entrar de novo com a internet. Sair mesmo assim?'))return;
  try{await sb.auth.signOut()}catch(e){}
  ME=null;LS.set('pdv_me',null);P=[];LS.set('pdv_prod',[]);cart=[];MY=[];view='login';loginMsg='';render();
}
async function start(){
  const{data,error}=await sb.rpc('pdv_eu');
  if(error||!data||!data[0]){loginMsg=error&&!/fetch|network/i.test(error.message)?'Seu usuário não tem acesso ao PDV. Fale com o administrador.':'Não foi possível validar seu acesso. Tente de novo.';try{await sb.auth.signOut()}catch(e){}ME=null;view='login';return render()}
  ME=data[0];LS.set('pdv_me',ME);view='venda';render();sync();
}

/* ----- sincronização: envia as vendas guardadas e atualiza produtos ----- */
let syncing=false,lastSync=0;
async function sync(){
  if(syncing||!ME)return;syncing=true;setSync('sincronizando…');
  try{
    for(let i=0;i<Q.length;){
      const s=Q[i];if(s._by!==ME.id){i++;continue}
      const{data,error}=await sb.rpc('pdv_sell',{p:s});
      if(error){if(error.code==='P0001'){FAIL.push({s,msg:error.message,at:now()});Q.splice(i,1);saveQ();continue}throw error}
      Q.splice(i,1);saveQ();
    }
    const r1=await sb.rpc('pdv_catalogo');if(r1.error)throw r1.error;

  const msg=t=>{const e=$('#scanmsg');if(e)e.textContent=t};

      return;
    }

    msg('Procurando o código…');
  }catch(e){
    scanStop();
    msg(e&&e.name==='NotAllowedError'?'Permita o uso da câmera no navegador para escanear.':e&&e.name==='NotFoundError'?'Nenhuma câmera encontrada neste aparelho.':'Não foi possível abrir a câmera. Digite o código no campo.');
  }
}

  <h1>${esc(c.trade_name||c.legal_name||'MultMix')}</h1><div class="c">${esc([c.cnpj&&'CNPJ '+c.cnpj,a,c.phone].filter(Boolean).join(' · '))}</div><hr><div class="c"><b>CUPOM NÃO FISCAL</b><br>Apenas para controle</div><hr>
  <div>Venda ${esc(String(r.id).slice(0,8).toUpperCase())}<br>${dt.toLocaleDateString('pt-BR')} ${dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}<br>Vendedor: ${esc(r.seller)}${r.customer?'<br>Cliente: '+esc(r.customer.name):''}</div><hr>
  <table>${r.lines.map(l=>`<tr><td colspan="2">${esc(l.name)}</td></tr><tr><td>${l.qty} x ${R(l.price)}</td><td>${R(l.qty*l.price)}</td></tr>`).join('')}</table><hr>
  <table><tr class="t"><td>TOTAL</td><td>${R(r.total)}</td></tr><tr><td>Pagamento</td><td>${esc(r.pay_type==='crediario'?'Carnê '+r.n_inst+'x':r.method)}</td></tr>${r.pay_type==='crediario'?`<tr><td>Entrada</td><td>${R(r.entry)}</td></tr>`:''}</table><hr><div class="c">Obrigado pela preferência!</div>`;
  if(window.mmDesk){mmDesk.print(html).then(r=>{if(!r.ok)alert('Não imprimiu: '+(r.error||'verifique a impressora em PDV > Impressora do cupom'))});return}
  const fr=document.createElement('iframe');fr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(fr);
  fr.srcdoc=html;fr.onload=()=>{setTimeout(()=>{try{fr.contentWindow.focus();fr.contentWindow.print()}catch(e){alert('Não foi possível abrir a impressão.')}setTimeout(()=>fr.remove(),60000)},300)};
}

/* ----- minhas vendas e comissão ----- */
function vMin(){
  const mo=new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'}),ok=MY.filter(s=>!s.canceled_at),tot=ok.reduce((a,s)=>a+ +s.total,0),pend=mine(),fl=FAIL.filter(f=>f.s._by===ME.id);
  $('#app').innerHTML=`<div class="prices"><div class="pr"><span>Minha comissão (${esc(mo)})</span><b>${R(COM)}</b></div><div class="pr"><span>Vendas no mês</span><b>${ok.length}</b></div><div class="pr"><span>Total vendido</span><b>${R(tot)}</b></div>
   ${ME.commission_pct>0?`<div class="pr"><span>Minha taxa</span><b>${+ME.commission_pct}%</b></div>`:''}</div>
  <p class="sm">A comissão é calculada pelo servidor. Vendas feitas sem internet só entram aqui depois de enviadas.</p>
  ${pend.length?`<div class="box"><h3>Aguardando envio (${pend.length})</h3><p class="sm">Ficam guardadas neste aparelho e vão sozinhas quando houver internet.</p><button class="btn g s" onclick="sync()">Tentar enviar agora</button></div>`:''}
  ${fl.length?`<div class="box"><h3 class="bad">Vendas recusadas pelo servidor (${fl.length})</h3>${fl.map(f=>`<p class="sm">${fmtD(f.s.created_at)} · ${esc(f.msg)} <button class="btn g s" onclick="failDel('${f.s.id}')">Descartar</button></p>`).join('')}<p class="sm">Fale com o administrador antes de descartar.</p></div>`:''}
  <div style="overflow:auto"><table><tr><th>Data</th><th>Cliente</th><th>Pagamento</th><th>Itens</th><th style="text-align:right">Total</th></tr>
  ${MY.length?MY.map(s=>`<tr${s.canceled_at?' style="opacity:.5"':''}><td>${fmtD(ld(s.created_at))}</td><td>${esc(s.customer||'—')}</td><td>${esc(s.pay_type==='crediario'?'Carnê':(s.method||'—'))}${s.canceled_at?' <span class="tag">cancelada</span>':''}</td><td>${(s.items||[]).reduce((a,i)=>a+ +i.qty,0)}</td><td style="text-align:right">${R(s.total)}</td></tr>`).join(''):'<tr><td colspan="5" style="text-align:center;padding:14px">Nenhuma venda enviada neste mês.</td></tr>'}</table></div>`;
}
function failDel(id){if(!confirm('Descartar esta venda recusada? Ela não será registrada.'))return;const i=FAIL.findIndex(f=>f.s.id===id);if(i>=0)FAIL.splice(i,1);saveQ();render()}

/* ----- início ----- */
(async()=>{
  try{const{data}=await sb.auth.getSession();
    if(data&&data.session&&ME){if(await mfaNeeded()){view='login';vMfa();return}view='venda';render();sync();return}
    if(data&&data.session&&!ME){await start();return}
  }catch(e){}
  if(ME&&navigator.onLine===false){view='venda';render();setSync('offline · '+mine().length+' pendente(s)');return}
  ME=null;view='login';render();
})();
