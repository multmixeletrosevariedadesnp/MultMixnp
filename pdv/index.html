async function login(e){

let syncing=false,lastSync=0;
async function sync(){
  if(syncing||!ME)return;syncing=true;setSync('sincronizando…');
  try{
    for(let i=0;i<Q.length;){
      const s=Q[i];if(s._by!==ME.id){i++;continue}
      const{data,error}=await sb.rpc('pdv_sell',{p:s});
      if(error){if(error.code==='P0001'){FAIL.push({s,msg:error.message,at:now(),rep:false});Q.splice(i,1);saveQ();continue}throw error}
      Q.splice(i,1);saveQ();
    }
    const r1=await sb.rpc('pdv_catalogo');if(r1.error)throw r1.error;
    P=r1.data||[];mine().forEach(s=>(s.items||[]).forEach(it=>{const p=P.find(x=>x.id===it.id);if(p)p.stock=(+p.stock||0)-it.qty}));LS.set('pdv_prod',P);
    for(const f of FAIL){if(f.rep||f.s._by!==ME.id)continue;const{error:er}=await sb.rpc('pdv_reportar',{p_kind:'venda_recusada',p_ref:String(f.s.id),p_detail:f.msg,p_payload:{pay_type:f.s.pay_type,items:f.s.items,created_at:f.s.created_at,customer:f.s.customer&&f.s.customer.name}});if(!er){f.rep=true;saveQ()}}
    await loadCx();
    const r2=await sb.rpc('pdv_eu');if(r2.error&&/Sem permiss/i.test(r2.error.message)){loginMsg='Seu acesso foi desativado. Fale com o administrador.';syncing=false;return logout(true)}
    if(r2.data&&r2.data[0]){ME=r2.data[0];LS.set('pdv_me',ME)}
    const r3=await sb.from('company').select('*').eq('id',1).maybeSingle();if(r3.data){CO=r3.data;LS.set('pdv_co',CO)}
    await loadMine();lastSync=Date.now();
    setSync('sincronizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){setSync('offline · '+mine().length+' pendente(s)')}
  syncing=false;
  if(view==='venda'){pdvSearch();cartView()}else if(view==='minhas')vMin();
}

}

  const item=(v,l,i)=>`<button class="${view===v?'on':''}" onclick="go('${v}')">${ic(i)}<span>${l}</span></button>`,pend=mine().length+FAIL.filter(f=>f.s._by===ME.id).length;
  $('#nav').innerHTML=item('venda','Nova venda','cart')+item('caixa','Caixa'+(CX&&CX.aberto?' <b class="bdg" style="background:var(--ok);color:#fff">●</b>':((ME.cfg||{}).exige_caixa?' <b class="bdg" style="background:var(--bad);color:#fff">!</b>':'')),'coin')+item('minhas','Minhas vendas'+(pend?` <b class="bdg" style="background:var(--tag);color:#222">${pend}</b>`:''),'coin')+item('arte','Arte e cartão','img')+`<button onclick="temaOpen()">${ic('img')}<span>Aparência</span></button><button class="out" onclick="logout()">${ic('logout')}<span>Sair (${esc((ME.name||'').split(' ')[0])})</span></button>`;
  ({venda:vPdv,caixa:vCx,minhas:vMin,arte:vArte}[view]||vPdv)();
}

/* ----- preço (só para mostrar; quem manda no preço é o servidor) ----- */
const promoPct=p=>{const x=+p.promo_pct;if(!(x>0&&x<100))return 0;const d=new Date(),h=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  if(p.promo_from&&h<String(p.promo_from).slice(0,10))return 0;if(p.promo_to&&h>String(p.promo_to).slice(0,10))return 0;return x};
const promoAt=(v,p)=>{const x=promoPct(p);return x?+(v*(1-x/100)).toFixed(2):+v};
const unit0=(p,t)=>t==='avista'?p.price_cash:t==='cartao'?(p.price_card||p.price_cash):(p.price_credit||p.price_card||p.price_cash);
const unit=(p,t)=>promoAt(+unit0(p,t),p);
const pPhoto=p=>(p.photos&&p.photos[0])||'';

const maxInst=()=>Math.max(1,Math.min(24,...cart.map(i=>(P.find(p=>p.id===i.id)||{}).max_inst||12)));

function pdvList(){

  return P.filter(p=>!k.trim()||norm([p.name,p.category,p.supplier_code,p.internal_code].join(' ')).includes(k)||(d.length>=6&&p.ean===d))

}

  const t=($('#s_t')||{}).value||'avista',qv=$('#p_q').value.trim();
  if(!qv&&pdvNarrow()){$('#p_res').innerHTML='<p class="sm pgh">Digite o nome, escaneie ou use o leitor para achar um produto.</p>';return}
  const l=pdvList();
  $('#p_res').innerHTML=l.length?l.map(p=>{const st=+p.stock||0,pr=promoPct(p);return`<button type="button" class="pcard ${st>0?'':'off'}" onclick="pdvPick('${p.id}')">
    <span class="pimg">${pPhoto(p)?`<img src="${esc(pPhoto(p))}" alt="" loading="lazy" onerror="this.outerHTML='<span class=pno>sem foto</span>'">`:'<span class="pno">sem foto</span>'}${pr?`<span class="pdis">-${pr}%</span>`:''}<span class="pst ${st>0?(st<=stockMin()?'low':''):'bad'}">${st>0?'Estoque '+st:'Sem estoque'}</span></span>
    <span class="pt"><b class="pn2">${esc(p.name)}</b>${p.category?`<span class="sm">${esc(p.category)}</span>`:''}</span>
    <span class="pp"><b>${R(unit(p,t))}</b>${pr?`<span class="sm"><s>${R(unit0(p,t))}</s></span>`:''}</span></button>`}).join('')
    :(P.length?'<p class="sm pgh">Nenhum produto encontrado.</p>':'<p class="sm pgh">Nenhum produto carregado ainda. Conecte-se à internet para baixar a lista.</p>');
}
function pdvPick(id){addProd(id);const q=$('#p_q');q.value='';pdvSearch();if(!pdvNarrow())q.focus()}
function addProd(id){
  const q=Math.max(1,Math.round(+($('#s_q')||{}).value||1)),i=cart.find(x=>x.id===id);
  i?i.qty+=q:cart.push({id,qty:q});
  if($('#s_q'))$('#s_q').value=1;cartView();
}
/* ========= Leitor de código de barras (câmera) ========= */
let scanStream=null,scanTimer=null,scanH5=null,scanLast={c:'',t:0};
function scanStop(){
  clearInterval(scanTimer);scanTimer=null;
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}
  if(scanH5){const h=scanH5;scanH5=null;Promise.resolve().then(()=>h.stop()).then(()=>h.clear()).catch(()=>{})}
}
function scanOpen(cb,multi){
  scanStop();
  modal(`<h2>Escanear código de barras</h2><p class="sm">Aponte a câmera para o código de barras do produto.</p>
  <div id="scanbox" style="background:#000;border-radius:12px;overflow:hidden;min-height:180px"><video id="scanv" playsinline muted style="width:100%;display:block"></video></div>
  <p id="scanmsg" class="sm" role="status" aria-live="polite">Abrindo a câmera…</p><button class="btn g" onclick="closeM()">${multi?'Concluir':'Cancelar'}</button>`);
  const got=code=>{
    const n=Date.now();if(code===scanLast.c&&n-scanLast.t<2500)return;scanLast={c:code,t:n};
    if(navigator.vibrate)navigator.vibrate(60);
    const m=cb(code);
    if(multi){const e=$('#scanmsg');if(e)e.textContent=m||'Lido: '+code}else closeM();
  };
  startScan(got);
}
const loadScript=u=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=()=>no(new Error('script'));document.head.appendChild(e)});
async function startScan(got){
  const msg=t=>{const e=$('#scanmsg');if(e)e.textContent=t};
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return msg('Este navegador não permite usar a câmera. Digite o código no campo.');
  try{
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
      scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
      const v=$('#scanv');if(!v){scanStop();return}
      v.srcObject=scanStream;await v.play();msg('Procurando o código…');
      scanTimer=setInterval(async()=>{try{const r=await det.detect(v);if(r.length)got(r[0].rawValue)}catch(e){}},250);
      return;
    }
    // Sem leitor nativo (ex.: iPhone/Safari): usa a biblioteca html5-qrcode.
    if(!window.Html5Qrcode)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js');
    const F=window.Html5QrcodeSupportedFormats;
    $('#scanbox').innerHTML='';
    scanH5=new Html5Qrcode('scanbox',{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128],verbose:false});
    await scanH5.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:140}},got,()=>{});
    msg('Procurando o código…');
  }catch(e){
    scanStop();
    msg(e&&e.name==='NotAllowedError'?'Permita o uso da câmera no navegador para escanear.':e&&e.name==='NotFoundError'?'Nenhuma câmera encontrada neste aparelho.':'Não foi possível abrir a câmera. Digite o código no campo.');
  }
}
let _au=null;
function pdvBeep(ok){try{_au=_au||new(window.AudioContext||window.webkitAudioContext)();const o=_au.createOscillator(),g=_au.createGain();o.frequency.value=ok?1000:220;o.type=ok?'sine':'square';g.gain.value=.08;o.connect(g);g.connect(_au.destination);o.start();o.stop(_au.currentTime+(ok?.07:.25))}catch(e){}}
function pdvMsg(t,ok){const e=$('#p_msg');if(e){e.textContent=t;e.className='sm pmsg '+(ok?'ok':'bad')}pdvBeep(ok)}
function pdvCode(raw){
  let v=String(raw||'').trim(),q=1;const m=v.match(/^(\d{1,3})\s*[*xX]\s*(.+)$/);if(m){q=+m[1];v=m[2].trim()}
  const d=digits(v),ex=d.length>=6&&P.find(p=>p.ean===d);
  if(!ex){const k=norm(v),l=k?P.filter(p=>norm([p.name,p.category,p.supplier_code,p.internal_code].join(' ')).includes(k)):[];
    if(l.length===1&&v.length>=2)return pdvAdd(l[0],q);
    if(d.length>=6){const t='Código '+d+' não cadastrado. Chame o administrador.';pdvMsg(t,false);return t}
    pdvMsg(l.length?'Vários produtos encontrados. Toque no que deseja ou digite mais letras.':'Nenhum produto encontrado.',false);return null}
  return pdvAdd(ex,q);
}
function pdvAdd(p,q){
  const sq=$('#s_q');if(sq)sq.value=q;addProd(p.id);
  const st=+p.stock||0,i=cart.find(x=>x.id===p.id),over=i&&i.qty>st;
  const t='Adicionado: '+(q>1?q+' × ':'')+p.name+(over?' · atenção: estoque '+st:'');pdvMsg(t,!over);return t;
}
function pdvScanned(code){return pdvCode(code)||('Código '+digits(code)+' não cadastrado.')}
function pdvEnter(){const r=pdvCode($('#p_q').value);if(r){$('#p_q').value='';pdvSearch()}$('#p_q').focus()}
let _kb='',_kt=0;
document.addEventListener('keydown',e=>{
  if(view!=='venda'||!$('#p_q')||$('#modal').classList.contains('open'))return;
  const k=e.key,tag=(document.activeElement&&document.activeElement.tagName)||'';
  if(k==='F2'){e.preventDefault();$('#p_q').focus();$('#p_q').select()}
  else if(k==='F4'){e.preventDefault();finish()}
  else if(k==='F6'){e.preventDefault();$('#s_q').focus();$('#s_q').select()}
  else if(k==='F8'){e.preventDefault();if(cart.length&&confirm('Limpar o carrinho?')){cart=[];cartView()}}
  else if(!/INPUT|SELECT|TEXTAREA/.test(tag)&&!e.ctrlKey&&!e.altKey&&!e.metaKey){
    const n=Date.now();if(n-_kt>120)_kb='';_kt=n;
    if(k==='Enter'){if(_kb.length>=6){e.preventDefault();pdvCode(_kb)}_kb=''}
    else if(k.length===1&&/[0-9*xX]/.test(k))_kb+=k;else _kb='';
  }
});
function cartQty(ix,d){const i=cart[ix];if(!i)return;i.qty+=d;if(i.qty<1)cart.splice(ix,1);cartView()}
/* ----- cálculo do carrinho: espelha o servidor (desconto por item + desconto da venda rateado, preço unitário em centavos) ----- */
const r2=x=>Math.round((+x+1e-9)*100)/100;
let saleDisc={mode:'val',val:0};
function cartCalc(t){
  t=t||($('#s_t')&&$('#s_t').value)||'avista';
  const L=cart.map(i=>{const p=P.find(x=>x.id===i.id)||{},u=unit(p,t),q=i.qty,ld=Math.min(Math.max(+i.disc||0,0),Math.max(u*q-0.01*q,0));return{i,p,q,u,net:u*q-ld,ld}});
  const gross=L.reduce((a,l)=>a+l.u*l.q,0),sumnet=L.reduce((a,l)=>a+l.net,0);
  let sd=saleDisc.mode==='pct'?sumnet*(+saleDisc.val||0)/100:(+saleDisc.val||0);
  sd=r2(Math.min(Math.max(sd,0),Math.max(sumnet-0.01*L.length,0)));let rest=sd,tot=0;
  L.forEach((l,k)=>{const share=k===L.length-1?rest:r2(sd*l.net/(sumnet||1));rest=r2(rest-share);l.un=Math.max(r2((l.net-share)/l.q),0.01);l.line=r2(l.un*l.q);tot+=l.line});
  tot=r2(tot);return{L,gross:r2(gross),total:tot,disc:r2(gross-tot),sd}
}
const total=()=>cartCalc().total;
function sdSet(){saleDisc={mode:$('#sd_m').value,val:+$('#sd_v').value||0};cartView()}
function itemDisc(ix){

  <div class="f"><div><label>Tipo</label><select id="id_m"><option value="val">R$ (valor)</option><option value="pct">% (percentual)</option></select></div><div><label>Desconto</label><input id="id_v" type="number" step="0.01" min="0" value="${i.disc||''}" inputmode="decimal"></div></div>
  <p class="sm">O desconto vale para todas as unidades deste item. Acima do limite livre, o administrador precisa autorizar ao finalizar.</p>
  <div class="bar"><button class="btn" onclick="itemDiscOk(${ix})">Aplicar</button><button class="btn g" onclick="itemDiscClr(${ix})">Remover desconto</button></div>`);
  setTimeout(()=>$('#id_v')&&$('#id_v').focus(),50);
}
function itemDiscOk(ix){
  const i=cart[ix],t=$('#s_t').value,p=P.find(x=>x.id===i.id)||{},v=+$('#id_v').value||0,m=$('#id_m').value,base=unit(p,t)*i.qty;
  i.disc=r2(m==='pct'?base*v/100:v);if(i.disc>=base)return alert('O desconto precisa ser menor que o valor do item.');
  if(!(i.disc>0))delete i.disc;closeM();cartView();
}
function itemDiscClr(ix){delete cart[ix].disc;closeM();cartView()}

  const t=$('#s_t').value,cc=cartCalc(t),tot=cc.total,e=+$('#s_e').value||0,n=+$('#s_n').value||1,un=cart.reduce((a,i)=>a+i.qty,0);

  $('#cartv').innerHTML=(cart.length?`<div class="citems">${cc.L.map((l,ix)=>{const p=l.p,i=l.i;if(!p.id)return'';const pr=promoPct(p);return`<div class="citem">
    ${pPhoto(p)?`<img class="cthumb" src="${esc(pPhoto(p))}" alt="" loading="lazy" onerror="this.outerHTML='<span class=cthumb>·</span>'">`:'<span class="cthumb">·</span>'}
    <div class="cn"><b>${esc(p.name)}</b><span class="sm">${R(l.un)} un.${l.un<l.u-0.004?` <s>${R(l.u)}</s>`:pr?` <s>${R(unit0(p,t))}</s>`:''}${(+p.stock||0)<i.qty?' · <span class="bad">estoque '+(+p.stock||0)+'</span>':''} · <button type="button" class="lk" onclick="itemDisc(${ix})">${i.disc?'desc. −'+R(i.disc):'desconto'}</button></span></div>
    <div class="stp"><button type="button" aria-label="Diminuir" onclick="cartQty(${ix},-1)">−</button><span>${i.qty}</span><button type="button" aria-label="Aumentar" onclick="cartQty(${ix},1)">+</button></div>
    <b class="lt">${R(l.line)}</b><button type="button" class="rx" aria-label="Remover item" onclick="cart.splice(${ix},1);cartView()">×</button></div>`}).join('')}</div>`
   :'<p class="cempty">Carrinho vazio.<br><span class="sm">Busque, toque num produto ou escaneie o código de barras.</span></p>')
   +`<div class="ctot"><span>${un} ${un===1?'item':'itens'}</span><div>${cc.disc>0.004?`<span class="sm">Subtotal ${R(cc.gross)} · desconto −${R(cc.disc)}</span>`:''}<span class="sm">Total</span><b>${R(tot)}</b>${t==='crediario'&&tot?`<span class="sm">restante ${n}x de ${R((tot-e)/n)}</span>`:''}</div></div>`;
  const pb=$('#pbt');if(pb)pb.textContent=R(tot)+(un?` · ${un} ${un===1?'item':'itens'}`:'');
  const bf=$('#btnfin');if(bf)bf.textContent=tot?'Finalizar venda · '+R(tot):'Finalizar venda';
}

/* ----- venda em espera (fica só neste aparelho, por vendedor) ----- */
const holdKey=()=>'pdv_hold_'+(ME&&ME.id);
const holdGet=()=>LS.get(holdKey(),[])||[];
function holdSave(auto){
  if(!cart.length)return auto?0:alert('O carrinho está vazio.');
  const h=holdGet(),nm=($('#c_n')&&$('#c_n').value.trim())||'';
  h.push({id:uid(),at:now(),label:nm||'Venda '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),cart:JSON.parse(JSON.stringify(cart)),sd:{...saleDisc},
    f:{t:$('#s_t').value,m:$('#s_m').value,e:$('#s_e').value,n:$('#s_n').value,d:$('#s_d').value,cn:$('#c_n').value,cc:$('#c_c').value,cp:$('#c_p').value},cli:selCli});
  LS.set(holdKey(),h);cart=[];saleDisc={mode:'val',val:0};if($('#sd_v')){$('#sd_v').value=0;$('#sd_m').value='val'}
  ['c_n','c_c','c_p'].forEach(k=>{if($('#'+k))$('#'+k).value=''});selCli=null;
  cartView();if(!auto)pdvMsg('Venda colocada em espera. Atenda o próximo cliente.',true);return 1;
}
function holdList(){
  const h=holdGet();
  modal(`<h2>Vendas em espera</h2>${h.length?h.map(x=>`<div class="citem" style="grid-template-columns:minmax(0,1fr) auto auto"><div class="cn"><b>${esc(x.label)}</b><span class="sm">${x.cart.reduce((a,i)=>a+i.qty,0)} itens · ${new Date(x.at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span></div>
   <button class="btn s" onclick="holdResume('${x.id}')">Retomar</button><button class="btn g s" onclick="holdDel('${x.id}')">Descartar</button></div>`).join(''):'<p class="sm">Nenhuma venda em espera.</p>'}
  <p class="sm">As vendas em espera ficam guardadas neste aparelho. Os preços são conferidos de novo ao finalizar.</p>`);
}
function holdResume(id){
  const h=holdGet(),x=h.find(v=>v.id===id);if(!x)return;
  if(cart.length)holdSave(true);
  const rest=holdGet().filter(v=>v.id!==id);LS.set(holdKey(),rest);
  cart=x.cart;saleDisc=x.sd||{mode:'val',val:0};
  const f=x.f||{};$('#s_t').value=f.t||'avista';$('#s_m').value=f.m||'Dinheiro';$('#s_e').value=f.e||0;$('#s_n').value=f.n||6;if(f.d)$('#s_d').value=f.d;
  $('#c_n').value=f.cn||'';$('#c_c').value=f.cc||'';$('#c_p').value=f.cp||'';selCli=x.cli||null;
  $('#sd_m').value=saleDisc.mode;$('#sd_v').value=saleDisc.val||0;closeM();cartView();
}
function holdDel(id){if(!confirm('Descartar esta venda em espera?'))return;LS.set(holdKey(),holdGet().filter(v=>v.id!==id));holdList();cartView()}

/* ----- autorização do administrador (e-mail e senha dele, numa sessão à parte; nada fica gravado) ----- */
function askAdmin(valor){
  return new Promise(res=>{
    window.__askRes=res;
    modal(`<h2>Autorização do administrador</h2><p>Desconto de <b>${R(valor)}</b> para <b>${esc(ME.name)}</b>.</p>
    <form onsubmit="askAdminGo(event,${valor})"><label for="ad_e">E-mail do administrador</label><input id="ad_e" type="email" autocomplete="off" required>
    <label for="ad_p">Senha do administrador</label><input id="ad_p" type="password" autocomplete="off" required>
    <div id="ad_2" style="display:none"><label for="ad_c">Código do autenticador (2 etapas)</label><input id="ad_c" inputmode="numeric" maxlength="6" autocomplete="off"></div>
    <p id="ad_m" class="bad" role="alert" style="min-height:1.3em"></p><div class="bar"><button class="btn" id="ad_b">Autorizar</button><button type="button" class="btn g" onclick="askAdminX()">Cancelar</button></div></form>`);
    setTimeout(()=>$('#ad_e')&&$('#ad_e').focus(),50);
  });
}
function askAdminX(){closeM();const r=window.__askRes;window.__askRes=null;r&&r(null)}
let adC=null;
async function askAdminGo(ev,valor){
  ev.preventDefault();const m=$('#ad_m'),b=$('#ad_b');m.textContent='';b.disabled=true;
  try{
    if(!adC){adC=supabase.createClient(CFG.URL,CFG.KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'mm-pdv-auth'}});
      const{error}=await adC.auth.signInWithPassword({email:$('#ad_e').value.trim(),password:$('#ad_p').value});if(error){adC=null;throw new Error('E-mail ou senha do administrador incorretos.')}}
    const{data:a}=await adC.auth.mfa.getAuthenticatorAssuranceLevel();
    if(a&&a.nextLevel==='aal2'&&a.currentLevel!=='aal2'){
      const code=$('#ad_c').value.trim();$('#ad_2').style.display='';
      if(!code){b.disabled=false;m.textContent='Digite o código do autenticador do administrador.';return}
      const{data:f}=await adC.auth.mfa.listFactors(),t=(f.totp||[]).find(x=>x.status==='verified');
      const{error}=await adC.auth.mfa.challengeAndVerify({factorId:t.id,code});if(error)throw new Error('Código incorreto.');
    }
    const{data,error}=await adC.rpc('pdv_autorizar_desconto',{p_seller:ME.id,p_value:valor});
    if(error)throw new Error(/Somente o administrador/.test(error.message)?'Este usuário não é administrador.':error.message);
    try{await adC.auth.signOut()}catch(e){}adC=null;closeM();const r=window.__askRes;window.__askRes=null;r&&r(data);
  }catch(e){try{if(adC){await adC.auth.signOut()}}catch(x){}adC=null;m.textContent=e.message||'Não foi possível autorizar.';b.disabled=false}
}

let finishing=false;
async function finish(){
  if(finishing)return;
  if(!cart.length)return alert('Adicione ao menos um produto.');
  const t=s_t.value,cc=cartCalc(t),tot=cc.total,e=t==='crediario'?+s_e.value||0:0,n=t==='crediario'?+s_n.value||1:1,nm=c_n.value.trim(),cfg=ME.cfg||{};
  if(t==='crediario'){
    if(nm.length<2)return alert('Carnê exige o nome do cliente.');
    if(e<0||e>=tot)return alert('A entrada precisa ser menor que o total.');
    if(!(n>=1&&n<=maxInst()))return alert('Número de parcelas inválido. Máximo para estes itens: '+maxInst()+'.');
    if(!s_d.value)return alert('Informe o 1º vencimento.');
  }
  if(cfg.exige_caixa&&ME.role!=='admin'&&!(CX&&CX.aberto))return alert('Abra o caixa (aba Caixa) antes de vender.');
  const low=cart.filter(i=>(+(P.find(p=>p.id===i.id)||{}).stock||0)<i.qty).map(i=>P.find(p=>p.id===i.id).name);
  if(low.length&&!confirm('Estoque insuficiente para: '+low.join(', ')+'.\nRegistrar a venda mesmo assim?'))return;
  finishing=true;
  try{
    const free=+cfg.desc_livre_pct||0;let authId=null;
    if(ME.role!=='admin'&&cc.disc>0.004&&cc.gross>0&&cc.disc/cc.gross*100>free+0.0001){
      if(navigator.onLine===false)return alert('Desconto acima de '+free+'% precisa da autorização do administrador e de internet. Reduza o desconto ou conecte-se.');
      authId=await askAdmin(cc.disc);if(!authId)return;
    }
    const sale={id:uid(),_by:ME.id,pay_type:t,method:s_m.value,entry:e,n_inst:n,first_due:t==='crediario'?s_d.value:null,created_at:now(),disc_val:cc.sd,auth_id:authId,
      customer:nm?{id:selCli||null,name:nm,cpf:c_c.value.trim(),phone:c_p.value.trim()}:null,items:cart.map(i=>({id:i.id,qty:i.qty,disc_val:+i.disc||0}))};
    let mpId=null;
    if(CO.mp_pix_on&&t!=='crediario'&&/^pix$/i.test(s_m.value)&&navigator.onLine!==false){ // Pix Mercado Pago: a venda só é registrada quando o pagamento cair
      const r=await mpPdvPay(sale,tot,nm);if(r===false)return;if(r&&r.id)mpId=r.id;
    }
    const rec={...sale,seller:ME.name,total:tot,disc:cc.disc,lines:cc.L.map(l=>({name:l.p.name,qty:l.q,price:l.un}))};
    Q.push(sale);saveQ();
    if(mpId)mpCall({action:'aplicado',id:mpId,note:'venda '+sale.id}).catch(()=>{});
    cart.forEach(i=>{const p=P.find(x=>x.id===i.id);if(p)p.stock=(+p.stock||0)-i.qty});LS.set('pdv_prod',P);
    cart=[];saleDisc={mode:'val',val:0};window.lastRec=rec;
    modal(`<h2>Venda registrada</h2><p><b>${R(tot)}</b> · ${esc(t==='crediario'?'Carnê '+n+'x':s_m.value)}${cc.disc>0.004?` · desconto ${R(cc.disc)}`:''}</p><p class="sm">Se estiver sem internet, a venda fica guardada e é enviada sozinha quando a conexão voltar.</p>
    <div class="f"><div class="w"><label>WhatsApp do cliente (para enviar o recibo)</label><input id="wa_n" inputmode="tel" placeholder="(93) 99999-0000" value="${esc((rec.customer&&rec.customer.phone)||'')}"></div></div>
    <div class="bar"><button class="btn" onclick="cupomPrint()">Imprimir cupom</button><button class="btn g" onclick="reciboWa()">Enviar recibo no WhatsApp</button><button class="btn g" onclick="closeM();render()">Nova venda</button></div>`);
    sync();
  }finally{finishing=false}
}
/* ----- Pix Mercado Pago no PDV (desligado até ligar na aba Empresa do Sistema) ----- */
async function mpCall(body){
  const{data,error}=await sb.functions.invoke('mp-pix',{body});
  if(error){let m=error.message;try{const j=await error.context.json();if(j&&j.erro)m=j.erro}catch(e){}throw new Error(m)}
  if(data&&data.ok===false)throw new Error(data.erro||'Erro no Pix Mercado Pago.');
  return data;
}
let mpRes=null,mpTm=null,mpId2=null;
function mpStop(v){ // fecha a espera do Pix: v=false cancela a venda
  clearInterval(mpTm);mpTm=null;
  if(mpRes){const r=mpRes;mpRes=null;if(v===false&&mpId2)mpCall({action:'cancelar',id:mpId2}).then(()=>{},()=>{});r(v)}
}
async function mpPdvPay(sale,tot,nome){
  let r;
  try{r=await mpCall({action:'criar',kind:'venda',sale_ref:sale.id,amount:+tot.toFixed(2),payer_name:nome||'',description:'Venda no PDV'})}
  catch(e){return confirm('Não consegui gerar o Pix automático:\n'+e.message+'\n\nRegistrar como Pix comum (você confere o pagamento no seu banco)?')?'manual':false}
  mpId2=r.id;
  return await new Promise(res=>{
    mpRes=res;
    modal(`<h2>Pix · ${R(tot)}</h2><p class="sm">Peça ao cliente para ler o QR Code. A venda só é registrada quando o pagamento for confirmado.</p>
    ${r.checkout_url?(qrMake(r.checkout_url)?`<div style="text-align:center"><svg viewBox="0 0 250 250" width="250" height="250" role="img" aria-label="QR Code do link de pagamento">${qrSvg(r.checkout_url,0,0,250,'#000','#fff')}</svg><p class="sm">O cliente lê o QR, abre o link e paga com Pix ou cartão.</p></div>`:'<p class="sm">Envie o link abaixo ao cliente (Pix ou cartão).</p>'):r.qr_base64?`<div style="text-align:center"><img alt="QR Code Pix" style="width:250px;height:250px;background:#fff;padding:8px;border-radius:12px" src="data:image/png;base64,${r.qr_base64}"></div>`:''}
    <textarea id="mpcode" rows="2" readonly onclick="this.select()">${esc(r.checkout_url||r.qr_code)}</textarea>
    <p id="mpst" class="sm" role="status">Aguardando o pagamento…</p>
    <div class="bar"><button class="btn g" onclick="mpcode.select();document.execCommand('copy');mpst.textContent='Código copiado.'">Copiar código</button><button class="btn g" onclick="mpStop(false);closeM()">Cancelar venda</button></div>`);
    mpTm=setInterval(async()=>{
      if(!document.getElementById('mpst')){mpStop(false);return}
      try{
        const x=await mpCall({action:'status',id:r.id});
        if(x.status==='approved'){clearInterval(mpTm);mpTm=null;const f=mpRes;mpRes=null;f({id:r.id})}
        else if(['expired','cancelled','rejected'].includes(x.status)){clearInterval(mpTm);mpTm=null;mpst.textContent='Este Pix não vale mais ('+x.status+'). Cancele e refaça a venda.'}
      }catch(e){}
    },3000);
  });
}
function modal(h){$('#modal').innerHTML=`<div class="box"><button class="x" aria-label="Fechar" onclick="closeM()">×</button>${h}</div>`;$('#modal').classList.add('open')}
function closeM(){scanStop();mpStop(false);$('#modal').classList.remove('open')}
/* ----- recibo da venda pelo WhatsApp (texto; não vale como nota fiscal) ----- */
function reciboTxt(r){
  const c=CO||{},dt=new Date(r.created_at),R2=v=>R(v);
  const pag=r.pay_type==='crediario'?`Carnê ${r.n_inst}x de ${R2(Math.round((r.total-(+r.entry||0))/r.n_inst*100)/100)}${+r.entry>0?' (entrada '+R2(r.entry)+')':''}${r.first_due?'\n1º vencimento: '+r.first_due.split('-').reverse().join('/'):''}`:r.method;
  return`*${c.trade_name||c.legal_name||'MultMix'}*\nRecibo da venda ${String(r.id).slice(0,8).toUpperCase()}\n${dt.toLocaleDateString('pt-BR')} ${dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}\n\n`+
    r.lines.map(l=>`${l.qty}x ${l.name} - ${R2(l.qty*l.price)}`).join('\n')+(r.disc>0.004?`\nDesconto: -${R2(r.disc)}`:'')+`\n\n*Total: ${R2(r.total)}*\nPagamento: ${pag}\n\nObrigado pela preferência!\n_Recibo para controle, sem valor fiscal. A nota fiscal é emitida separadamente._`;
}
function reciboWa(){
  const r=window.lastRec;if(!r)return;
  let d=String(($('#wa_n')&&$('#wa_n').value)||'').replace(/\D/g,'');
  if(d.length<10)return alert('Informe o WhatsApp do cliente com DDD.');
  if(d.length<=11)d='55'+d;
  window.open('https://wa.me/'+d+'?text='+encodeURIComponent(reciboTxt(r)),'_blank','noopener');
}
/* ----- cupom não fiscal (só controle, não vale como nota) ----- */
function cupomPrint(){
  const r=window.lastRec;if(!r)return;const c=CO||{},dt=new Date(r.created_at);
  const a=c.street?`${c.street}${c.number?', '+c.number:''}${c.district?' - '+c.district:''}, ${c.city||''}${c.uf?'/'+c.uf:''}`:'';
  const html=`<!doctype html><meta charset="utf-8"><title>Cupom</title><style>@page{margin:3mm}body{font:12px/1.35 monospace;width:72mm;margin:0;color:#000}h1{font-size:14px;text-align:center;margin:0}.c{text-align:center}hr{border:0;border-top:1px dashed #000;margin:6px 0}table{width:100%;border-collapse:collapse}td:last-child{text-align:right}.t{font-size:15px;font-weight:bold}</style>
  <h1>${esc(c.trade_name||c.legal_name||'MultMix')}</h1><div class="c">${esc([c.cnpj&&'CNPJ '+c.cnpj,a,c.phone].filter(Boolean).join(' · '))}</div><hr><div class="c"><b>CUPOM NÃO FISCAL</b><br>Apenas para controle</div><hr>
  <div>Venda ${esc(String(r.id).slice(0,8).toUpperCase())}<br>${dt.toLocaleDateString('pt-BR')} ${dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}<br>Vendedor: ${esc(r.seller)}${r.customer?'<br>Cliente: '+esc(r.customer.name):''}</div><hr>
  <table>${r.lines.map(l=>`<tr><td colspan="2">${esc(l.name)}</td></tr><tr><td>${l.qty} x ${R(l.price)}</td><td>${R(l.qty*l.price)}</td></tr>`).join('')}</table><hr>
  ${r.disc>0.004?`<table><tr><td>Desconto</td><td>-${R(r.disc)}</td></tr></table>`:''}<table><tr class="t"><td>TOTAL</td><td>${R(r.total)}</td></tr><tr><td>Pagamento</td><td>${esc(r.pay_type==='crediario'?'Carnê '+r.n_inst+'x':r.method)}</td></tr>${r.pay_type==='crediario'?`<tr><td>Entrada</td><td>${R(r.entry)}</td></tr>`:''}</table><hr><div class="c">Obrigado pela preferência!</div>`;
  printHtml(html);
}
function printHtml(html){
  if(window.mmDesk){mmDesk.print(html).then(r=>{if(!r.ok)alert('Não imprimiu: '+(r.error||'verifique a impressora em MultMix > Impressora do cupom'))});return}
  const fr=document.createElement('iframe');fr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(fr);
  fr.srcdoc=html;fr.onload=()=>{setTimeout(()=>{try{fr.contentWindow.focus();fr.contentWindow.print()}catch(e){alert('Não foi possível abrir a impressão.')}setTimeout(()=>fr.remove(),60000)},300)};
}

/* ----- minhas vendas e comissão ----- */
function vMin(){
  const mo=new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'}),ok=MY.filter(s=>!s.canceled_at),tot=ok.reduce((a,s)=>a+ +s.total,0),pend=mine(),fl=FAIL.filter(f=>f.s._by===ME.id);
  $('#app').innerHTML=`<div class="prices"><div class="pr"><span>Minha comissão (${esc(mo)})</span><b>${R(COM)}</b></div><div class="pr"><span>Vendas no mês</span><b>${ok.length}</b></div><div class="pr"><span>Total vendido</span><b>${R(tot)}</b></div>
   ${ME.commission_pct>0?`<div class="pr"><span>Minha taxa</span><b>${+ME.commission_pct}%</b></div>`:''}</div>
  <p class="sm">A comissão é calculada pelo servidor. Vendas feitas sem internet só entram aqui depois de enviadas.</p>
  ${pend.length?`<div class="box"><h3>Aguardando envio (${pend.length})</h3><p class="sm">Ficam guardadas neste aparelho e vão sozinhas quando houver internet.</p><button class="btn g s" onclick="sync()">Tentar enviar agora</button></div>`:''}
  ${fl.length?`<div class="box"><h3 class="bad">Vendas recusadas pelo servidor (${fl.length})</h3>${fl.map(f=>`<p class="sm">${fmtD(f.s.created_at)} · ${esc(f.msg)}${f.rep?' · administrador avisado':''} <button class="btn g s" onclick="failDel('${f.s.id}')">Descartar</button></p>`).join('')}<p class="sm">Fale com o administrador antes de descartar.</p></div>`:''}
  <div style="overflow:auto"><table><tr><th>Data</th><th>Cliente</th><th>Pagamento</th><th>Itens</th><th style="text-align:right">Total</th><th></th></tr>
  ${MY.length?MY.map(s=>`<tr${s.canceled_at?' style="opacity:.5"':''}><td>${fmtDH(s.created_at)}</td><td>${esc(s.customer||'—')}</td><td>${esc(s.pay_type==='crediario'?'Carnê':(s.method||'—'))}${s.canceled_at?' <span class="tag">cancelada</span>':''}</td><td>${(s.items||[]).reduce((a,i)=>a+ +i.qty,0)}</td><td style="text-align:right">${R(s.total)}${+s.discount>0?`<div class="sm">desconto ${R(s.discount)}</div>`:''}${+s.devolvido>0?`<div class="sm bad">devolvido ${R(s.devolvido)}</div>`:''}</td><td>${s.canceled_at?'':`<button class="btn g s" onclick="devOpen('${s.id}')">Devolver</button>`}</td></tr>`).join(''):'<tr><td colspan="6" style="text-align:center;padding:14px">Nenhuma venda enviada neste mês.</td></tr>'}</table></div>`;
}
function failDel(id){if(!confirm('Descartar esta venda recusada? Ela não será registrada.'))return;const i=FAIL.findIndex(f=>f.s.id===id);if(i>=0)FAIL.splice(i,1);saveQ();render()}

/* ----- caixa do vendedor (abrir, sangria, suprimento, fechar com conferência) ----- */
let CX=LS.get('pdv_cx',null);
async function loadCx(){const{data,error}=await sb.rpc('pdv_caixa_estado');if(!error&&data){CX=data;LS.set('pdv_cx',CX)}return !error}
const mtxt=o=>Object.entries(o||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td style="text-align:right">${R(v)}</td></tr>`).join('')||'<tr><td colspan="2" class="sm">Nenhuma venda ainda.</td></tr>';
async function vCx(){
  $('#app').innerHTML='<p class="sm">Carregando o caixa…</p>';
  if(navigator.onLine!==false)await loadCx();
  paintCx();
}
function paintCx(){
  const off=navigator.onLine===false,c=CX&&CX.aberto?CX:null;
  if(!c){
    $('#app').innerHTML=`<div class="box" style="max-width:520px"><h2>Caixa fechado</h2><p class="sm">Conte o dinheiro que está na gaveta e informe o valor inicial (troco). ${(ME.cfg||{}).exige_caixa?'<b>Para vender, o caixa precisa estar aberto.</b>':''}</p>
    ${off?'<p class="bad">Sem internet: não dá para abrir o caixa agora.</p>':''}
    <label for="cx_o">Valor inicial na gaveta (R$)</label><input id="cx_o" type="number" step="0.01" min="0" value="0" inputmode="decimal">
    <div class="bar"><button class="btn" onclick="cxAbrir()" ${off?'disabled':''}>Abrir caixa</button></div></div>`;return;
  }
  const k=c.calc||{},rec=k.recebido||{},tot=Object.values(rec).reduce((a,b)=>a+ +b,0);
  $('#app').innerHTML=`<div class="prices"><div class="pr"><span>Aberto desde</span><b>${new Date(c.aberto_em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</b></div>
   <div class="pr"><span>Valor inicial</span><b>${R(k.abertura)}</b></div><div class="pr"><span>Vendido neste caixa</span><b>${R(tot)}</b></div><div class="pr"><span>Retiradas (sangria)</span><b>${R(k.sangrias)}</b></div></div>
  ${off?'<p class="bad">Sem internet: os números abaixo podem estar desatualizados e o caixa não pode ser fechado agora.</p>':''}
  <div class="box"><h3>Recebido por forma de pagamento</h3><table>${mtxt(rec)}</table>
   ${Object.keys(k.estornos||{}).length||Object.keys(k.devolucoes||{}).length?`<p class="sm">Devoluções e estornos já descontados: ${R(Object.values(k.estornos||{}).reduce((a,b)=>a+ +b,0)+Object.values(k.devolucoes||{}).reduce((a,b)=>a+ +b,0))}</p>`:''}
   <p class="sm">Vendas feitas sem internet só aparecem aqui depois de enviadas.</p></div>
  <div class="box"><h3>Retiradas e reforços</h3>${(c.movimentos||[]).length?`<table>${c.movimentos.map(m=>`<tr><td>${new Date(m.at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</td><td>${m.kind==='sangria'?'Sangria':'Suprimento'}</td><td>${esc(m.reason||'')}</td><td style="text-align:right">${m.kind==='sangria'?'−':'+'}${R(m.amount)}</td></tr>`).join('')}</table>`:'<p class="sm">Nenhum movimento.</p>'}
   <div class="bar"><button class="btn g s" onclick="cxMov('sangria')" ${off?'disabled':''}>Sangria (retirar dinheiro)</button><button class="btn g s" onclick="cxMov('suprimento')" ${off?'disabled':''}>Suprimento (colocar troco)</button></div></div>
  <div class="box"><h3>Fechar o caixa</h3><p class="sm">Conte o dinheiro da gaveta e digite o total. O sistema compara com o que deveria ter e registra a diferença para o administrador.</p>
   <div class="f"><div><label for="cx_c">Dinheiro contado na gaveta (R$)</label><input id="cx_c" type="number" step="0.01" min="0" inputmode="decimal"></div><div class="w"><label for="cx_n">Observação (opcional)</label><input id="cx_n"></div></div>
   <div class="bar"><button class="btn" onclick="cxFechar()" ${off?'disabled':''}>Fechar caixa</button></div></div>`;
}
async function cxAbrir(){
  const v=+$('#cx_o').value;if(!(v>=0))return alert('Informe o valor inicial (pode ser zero).');
  const{error}=await sb.rpc('pdv_caixa_abrir',{p_opening:v});if(error)return alert(error.message);
  await loadCx();render();
}
function cxMov(kind){
  modal(`<h2>${kind==='sangria'?'Sangria':'Suprimento'}</h2><p class="sm">${kind==='sangria'?'Retirada de dinheiro da gaveta (ex.: levar ao banco).':'Dinheiro colocado na gaveta (ex.: troco).'}</p>
  <label for="mv_v">Valor (R$)</label><input id="mv_v" type="number" step="0.01" min="0.01" inputmode="decimal"><label for="mv_r">Motivo</label><input id="mv_r" placeholder="${kind==='sangria'?'Ex.: depósito no banco':'Ex.: troco'}">
  <div class="bar"><button class="btn" onclick="cxMovGo('${kind}')">Registrar</button></div>`);
}
async function cxMovGo(kind){
  const{error}=await sb.rpc('pdv_caixa_mov',{p_kind:kind,p_amount:+$('#mv_v').value,p_reason:$('#mv_r').value});
  if(error)return alert(error.message);closeM();await loadCx();paintCx();
}
async function cxFechar(){
  const v=$('#cx_c').value;if(v==='')return alert('Conte o dinheiro da gaveta e informe o valor.');
  if(mine().length&&!confirm('Há '+mine().length+' venda(s) ainda não enviada(s). Elas não entram neste fechamento. Fechar assim mesmo?'))return;
  if(!confirm('Fechar o caixa com R$ '+(+v).toFixed(2).replace('.',',')+' contados na gaveta?'))return;
  const{data,error}=await sb.rpc('pdv_caixa_fechar',{p_counted:+v,p_note:$('#cx_n').value});if(error)return alert(error.message);
  const d=+data.diferenca;window.lastFech={...data,seller:ME.name,at:now()};CX={aberto:false};LS.set('pdv_cx',CX);
  modal(`<h2>Caixa fechado</h2><table><tr><td>Esperado na gaveta</td><td style="text-align:right">${R(data.esperado)}</td></tr><tr><td>Contado</td><td style="text-align:right">${R(data.contado)}</td></tr>
  <tr><td><b>Diferença</b></td><td style="text-align:right"><b class="${Math.abs(d)<0.01?'ok':'bad'}">${Math.abs(d)<0.01?'Confere':(d<0?'Falta ':'Sobra ')+R(Math.abs(d))}</b></td></tr></table>
  <p class="sm">${Math.abs(d)<0.01?'':'O administrador foi avisado da diferença.'}</p><div class="bar"><button class="btn" onclick="fechPrint()">Imprimir resumo</button><button class="btn g" onclick="closeM();render()">OK</button></div>`);
}
function fechPrint(){
  const f=window.lastFech;if(!f)return;const c=f.calc||{},rec=c.recebido||{},co=CO||{};
  printHtml(`<!doctype html><meta charset="utf-8"><title>Fechamento</title><style>@page{margin:3mm}body{font:12px/1.35 monospace;width:72mm;margin:0;color:#000}h1{font-size:14px;text-align:center;margin:0}.c{text-align:center}hr{border:0;border-top:1px dashed #000;margin:6px 0}table{width:100%;border-collapse:collapse}td:last-child{text-align:right}</style>
  <h1>${esc(co.trade_name||co.legal_name||'MultMix')}</h1><div class="c"><b>FECHAMENTO DE CAIXA</b><br>${new Date(f.at).toLocaleString('pt-BR')}<br>Vendedor: ${esc(f.seller)}</div><hr>
  <table><tr><td>Valor inicial</td><td>${R(c.abertura)}</td></tr>${Object.entries(rec).map(([k,v])=>`<tr><td>Vendas ${esc(k)}</td><td>${R(v)}</td></tr>`).join('')}
  <tr><td>Suprimentos</td><td>${R(c.suprimentos)}</td></tr><tr><td>Sangrias</td><td>${R(c.sangrias)}</td></tr></table><hr>
  <table><tr><td>Esperado (dinheiro)</td><td>${R(f.esperado)}</td></tr><tr><td>Contado</td><td>${R(f.contado)}</td></tr><tr><td><b>Diferença</b></td><td><b>${R(f.diferenca)}</b></td></tr></table><hr><div class="c">Assinatura: ____________________</div>`);
}
/* ----- troca e devolução ----- */
function devOpen(id){
  const s=MY.find(x=>x.id===id);if(!s)return;const cfg=ME.cfg||{},dias=+cfg.devolucao_dias||7;
  if(s.pay_type==='crediario'&&ME.role!=='admin')return alert('Venda no carnê: procure o administrador para fazer a devolução.');
  if(ME.role!=='admin'&&(Date.now()-new Date(s.created_at))/864e5>dias)return alert('Prazo de devolução vencido ('+dias+' dias). Procure o administrador.');
  if(navigator.onLine===false)return alert('A devolução precisa de internet. Conecte-se e tente de novo.');
  window.devSale=s;
  modal(`<h2>Troca / devolução</h2><p class="sm">Venda de ${fmtDH(s.created_at)} · ${R(s.total)}${s.devolvido>0?' · já devolvido '+R(s.devolvido):''}</p>
  ${s.fiscal_status==='emitida'?'<p class="bad">Atenção: já existe nota fiscal emitida. O administrador será avisado para tratar a nota.</p>':''}
  <div id="dv_l">${(s.items||[]).map((i,k)=>`<div class="citem" style="grid-template-columns:minmax(0,1fr) 90px"><div class="cn"><b>${esc(i.name)}</b><span class="sm">${i.qty} × ${R(i.price)}</span></div><input type="number" min="0" max="${i.qty}" value="0" id="dv_${k}" inputmode="numeric" aria-label="Quantidade devolvida"></div>`).join('')}</div>
  <div class="f"><div class="w"><label for="dv_r">Motivo</label><input id="dv_r" placeholder="Ex.: defeito, tamanho errado"></div>
  <div><label for="dv_m">Devolver o valor em</label><select id="dv_m"><option>Dinheiro</option><option>Pix</option><option>Cartão</option><option value="Troca">Troca (sem devolver dinheiro)</option></select></div></div>
  <p class="sm">Na troca, o produto volta ao estoque e você registra a nova venda normalmente.</p>
  <div class="bar"><button class="btn" onclick="devSend()">Registrar</button></div>`);
}
async function devSend(){
  const s=window.devSale,items=[];(s.items||[]).forEach((i,k)=>{const q=Math.round(+$('#dv_'+k).value||0);if(q>0)items.push({id:i.id,qty:Math.min(q,i.qty)})});
  if(!items.length)return alert('Informe a quantidade de pelo menos um item.');
  const m=$('#dv_m').value;
  const{data,error}=await sb.rpc('pdv_devolucao',{p:{id:uid(),sale_id:s.id,items,reason:$('#dv_r').value,refund_method:m}});
  if(error)return alert(error.message);
  closeM();alert(m==='Troca'?'Troca registrada: o produto voltou ao estoque. Registre a nova venda.':'Devolução registrada: '+R(data.valor)+(data.venda_cancelada?' (venda cancelada)':'')+'.'+(data.fiscal_pendente?'\nO administrador foi avisado para tratar a nota fiscal.':''));
  await sync();await loadMine();if(m==='Troca')go('venda');else render();
}

/* ----- início ----- */
(async()=>{
  try{const{data}=await sb.auth.getSession();
    if(data&&data.session&&ME){if(await mfaNeeded()){view='login';vMfa();return}view='venda';render();sync();return}
    if(data&&data.session&&!ME){await start();return}
  }catch(e){}
  if(ME&&navigator.onLine===false){view='venda';render();setSync('offline · '+mine().length+' pendente(s)');return}
  ME=null;view='login';render();
})();
