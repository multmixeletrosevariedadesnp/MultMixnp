<body>
<header>
  <div class="brand"><img class="lg" src="logo-icon.png" alt="MultMix"><h1>Mult<span>Mix</span> PDV</h1></div>
  <nav id="nav"></nav>
  <button class="ibtn" data-install hidden>Instalar app</button>
  <span class="sync" id="sync"></span>
  <button type="button" class="appv" data-appver></button>
  <button type="button" class="appv" data-appforce></button>
</header>
<main id="app"></main>
<div id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ========= MultMix PDV: app do vendedor (independente do sistema) =========
   O vendedor só enxerga produtos SEM custo, vende e vê as próprias vendas/comissão.
   Preço, vendedor e comissão da venda são definidos pelo servidor (função pdv_sell no Supabase, supabase-v26.sql). */
const CFG={URL:'https://meswiziqgcjwxslbgmeu.supabase.co',KEY:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1lc3dpemlxZ2Nqd3hzbGJnbWV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzODg2NDcsImV4cCI6MjEwNzk2NDY0N30.ltoM4-4Z-vK8fYoZXaa7fKLBMOc0RBXrAsQlmlPW6x4'};
const sb=supabase.createClient(CFG.URL,CFG.KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const uid=()=>crypto.randomUUID(),now=()=>new Date().toISOString();
const norm=h=>String(h??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const digits=v=>String(v||'').replace(/\D/g,'');
const fmtD=iso=>String(iso||'').slice(0,10).split('-').reverse().join('/');
const ld=iso=>{const d=new Date(iso);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let ME=LS.get('pdv_me',null),P=LS.get('pdv_prod',[]),Q=LS.get('pdv_q',[]),FAIL=LS.get('pdv_fail',[]),CO=LS.get('pdv_co',{}),MY=[],COM=0,view='login',cart=[],selCli=null,loginMsg='';
const saveQ=()=>{LS.set('pdv_q',Q);LS.set('pdv_fail',FAIL)};
const mine=()=>Q.filter(s=>s._by===(ME&&ME.id)),setSync=t=>{const e=$('#sync');if(e)e.textContent=t};

/* ----- entrar / sair ----- */
function vLogin(){
  document.body.className='out';$('#nav').innerHTML='';
  $('#app').innerHTML=`<div class="login"><form class="lbox" onsubmit="login(event)"><img src="logo-icon.png" alt="MultMix" class="llogo">
  <h2>PDV · Vendedor</h2><p class="sm">Entre com seu e-mail e senha.</p>
  <label for="em">E-mail</label><input id="em" type="email" autocomplete="username" required>
  <label for="pw">Senha</label><div class="pwd"><input id="pw" type="password" autocomplete="current-password" required>
  <button type="button" class="btn g s" onclick="const p=$('#pw');p.type=p.type==='password'?'text':'password';this.textContent=p.type==='password'?'Mostrar':'Ocultar'">Mostrar</button></div>
  <button class="btn" id="lb" style="width:100%;margin-top:16px">Entrar</button><p id="err" class="bad" role="alert" style="text-align:center;min-height:1.4em">${esc(loginMsg)}</p></form></div>`;
  setTimeout(()=>$('#em')&&$('#em').focus(),50);
}
async function login(e){
  e.preventDefault();const b=$('#lb'),er=$('#err');b.disabled=true;er.textContent='';
  const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  b.disabled=false;
  if(error){er.textContent=/fetch|network/i.test(error.message)?'Sem internet. Conecte-se para entrar.':'E-mail ou senha incorretos.';return}
  if(await mfaNeeded())return vMfa();
  await start();
}
async function mfaNeeded(){try{const{data}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();return !!(data&&data.nextLevel==='aal2'&&data.currentLevel!=='aal2')}catch(e){return false}}
function vMfa(){
  $('#app').innerHTML=`<div class="login"><form class="lbox" onsubmit="mfaLogin(event)"><img src="logo-icon.png" alt="MultMix" class="llogo"><h2>Verificação em 2 etapas</h2>
  <p class="sm">Digite o código de 6 dígitos do aplicativo autenticador.</p><input id="mf" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
  <button class="btn" id="mb" style="width:100%;margin-top:16px">Confirmar</button><p id="err" class="bad" role="alert" style="text-align:center;min-height:1.4em"></p>
  <button type="button" class="btn g s" onclick="logout(true)">Voltar</button></form></div>`;setTimeout(()=>$('#mf')&&$('#mf').focus(),50);
}
async function mfaLogin(e){
  e.preventDefault();const er=$('#err');er.textContent='';
  try{const{data:f}=await sb.auth.mfa.listFactors(),t=(f.totp||[]).find(x=>x.status==='verified');if(!t)throw new Error('Nenhum autenticador cadastrado.');
    const{error}=await sb.auth.mfa.challengeAndVerify({factorId:t.id,code:$('#mf').value.trim()});if(error)throw error;await start()}
  catch(x){er.textContent='Código incorreto ou expirado.'}
}
async function logout(force){
  if(!force&&mine().length&&!confirm('Há '+mine().length+' venda(s) ainda não enviada(s). Elas ficam guardadas neste aparelho e serão enviadas quando você entrar de novo com a internet. Sair mesmo assim?'))return;
  try{await sb.auth.signOut()}catch(e){}
  ME=null;LS.set('pdv_me',null);P=[];LS.set('pdv_prod',[]);cart=[];MY=[];view='login';loginMsg='';render();
}
async function start(){
  const{data,error}=await sb.rpc('pdv_eu');
  if(error||!data||!data[0]){loginMsg=error&&!/fetch|network/i.test(error.message)?'Seu usuário não tem acesso ao PDV. Fale com o administrador.':'Não foi possível validar seu acesso. Tente de novo.';try{await sb.auth.signOut()}catch(e){}ME=null;view='login';return render()}
  ME=data[0];LS.set('pdv_me',ME);view='venda';render();sync();

/* ----- sincronização: envia as vendas guardadas e atualiza produtos ----- */
let syncing=false,lastSync=0;
async function sync(){
  if(syncing||!ME)return;syncing=true;setSync('sincronizando…');
  try{
    for(let i=0;i<Q.length;){
      const s=Q[i];if(s._by!==ME.id){i++;continue}
      const{data,error}=await sb.rpc('pdv_sell',{p:s});
      if(error){if(error.code==='P0001'){FAIL.push({s,msg:error.message,at:now(),rep:false});Q.splice(i,1);saveQ();continue}throw error}
      Q.splice(i,1);saveQ();
    }
    const r1=await sb.rpc('pdv_catalogo');if(r1.error)throw r1.error;
    P=r1.data||[];mine().forEach(s=>(s.items||[]).forEach(it=>{const p=P.find(x=>x.id===it.id);if(p)p.stock=(+p.stock||0)-it.qty}));LS.set('pdv_prod',P);
    for(const f of FAIL){if(f.rep||f.s._by!==ME.id)continue;const{error:er}=await sb.rpc('pdv_reportar',{p_kind:'venda_recusada',p_ref:String(f.s.id),p_detail:f.msg,p_payload:{pay_type:f.s.pay_type,items:f.s.items,created_at:f.s.created_at,customer:f.s.customer&&f.s.customer.name}});if(!er){f.rep=true;saveQ()}}
    await loadCx();
    const r2=await sb.rpc('pdv_eu');if(r2.error&&/Sem permiss/i.test(r2.error.message)){loginMsg='Seu acesso foi desativado. Fale com o administrador.';syncing=false;return logout(true)}
    if(r2.data&&r2.data[0]){ME=r2.data[0];LS.set('pdv_me',ME)}
    const r3=await sb.from('company').select('*').eq('id',1).maybeSingle();if(r3.data){CO=r3.data;LS.set('pdv_co',CO)}
    await loadMine();lastSync=Date.now();
    setSync('sincronizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){setSync('offline · '+mine().length+' pendente(s)')}
  syncing=false;
  if(view==='venda'){pdvSearch();cartView()}else if(view==='minhas')vMin();
}
async function loadMine(){
  const mo=new Date();mo.setDate(1);mo.setHours(0,0,0,0);
  const[a,b]=await Promise.all([sb.rpc('pdv_minhas_vendas',{p_from:mo.toISOString()}),sb.rpc('pdv_minha_comissao',{p_month:ld(now()).slice(0,7)})]);
  if(!a.error)MY=a.data||[];if(!b.error)COM=+b.data||0;
}

/* ========= Leitor de código de barras (câmera) ========= */
let scanStream=null,scanTimer=null,scanH5=null,scanLast={c:'',t:0};
function scanStop(){
  clearInterval(scanTimer);scanTimer=null;
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}
  if(scanH5){const h=scanH5;scanH5=null;Promise.resolve().then(()=>h.stop()).then(()=>h.clear()).catch(()=>{})}
}
function scanOpen(cb,multi){
  scanStop();
  modal(`<h2>Escanear código de barras</h2><p class="sm">Aponte a câmera para o código de barras do produto.</p>
  <div id="scanbox" style="background:#000;border-radius:12px;overflow:hidden;min-height:180px"><video id="scanv" playsinline muted style="width:100%;display:block"></video></div>
  <p id="scanmsg" class="sm" role="status" aria-live="polite">Abrindo a câmera…</p><button class="btn g" onclick="closeM()">${multi?'Concluir':'Cancelar'}</button>`);
  const got=code=>{
    const n=Date.now();if(code===scanLast.c&&n-scanLast.t<2500)return;scanLast={c:code,t:n};
    if(navigator.vibrate)navigator.vibrate(60);
    const m=cb(code);
    if(multi){const e=$('#scanmsg');if(e)e.textContent=m||'Lido: '+code}else closeM();
  };
  startScan(got);
}
const loadScript=u=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=()=>no(new Error('script'));document.head.appendChild(e)});
async function startScan(got){
  const msg=t=>{const e=$('#scanmsg');if(e)e.textContent=t};
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return msg('Este navegador não permite usar a câmera. Digite o código no campo.');
  try{
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
      scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
      const v=$('#scanv');if(!v){scanStop();return}
      v.srcObject=scanStream;await v.play();msg('Procurando o código…');
      scanTimer=setInterval(async()=>{try{const r=await det.detect(v);if(r.length)got(r[0].rawValue)}catch(e){}},250);
      return;
    }
    // Sem leitor nativo (ex.: iPhone/Safari): usa a biblioteca html5-qrcode.
    if(!window.Html5Qrcode)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js');
    const F=window.Html5QrcodeSupportedFormats;
    $('#scanbox').innerHTML='';
    scanH5=new Html5Qrcode('scanbox',{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128],verbose:false});
    await scanH5.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:140}},got,()=>{});
    msg('Procurando o código…');
  }catch(e){
    scanStop();
    msg(e&&e.name==='NotAllowedError'?'Permita o uso da câmera no navegador para escanear.':e&&e.name==='NotFoundError'?'Nenhuma câmera encontrada neste aparelho.':'Não foi possível abrir a câmera. Digite o código no campo.');
  }
}
let _au=null;
function pdvBeep(ok){try{_au=_au||new(window.AudioContext||window.webkitAudioContext)();const o=_au.createOscillator(),g=_au.createGain();o.frequency.value=ok?1000:220;o.type=ok?'sine':'square';g.gain.value=.08;o.connect(g);g.connect(_au.destination);o.start();o.stop(_au.currentTime+(ok?.07:.25))}catch(e){}}
function pdvMsg(t,ok){const e=$('#p_msg');if(e){e.textContent=t;e.className='sm pmsg '+(ok?'ok':'bad')}pdvBeep(ok)}
function pdvCode(raw){
  let v=String(raw||'').trim(),q=1;const m=v.match(/^(\d{1,3})\s*[*xX]\s*(.+)$/);if(m){q=+m[1];v=m[2].trim()}
  const d=digits(v),ex=d.length>=6&&P.find(p=>p.ean===d);
  if(!ex){const k=norm(v),l=k?P.filter(p=>norm([p.name,p.category,p.supplier_code,p.internal_code].join(' ')).includes(k)):[];
    if(l.length===1&&v.length>=2)return pdvAdd(l[0],q);
    if(d.length>=6){const t='Código '+d+' não cadastrado. Chame o administrador.';pdvMsg(t,false);return t}
    pdvMsg(l.length?'Vários produtos encontrados. Toque no que deseja ou digite mais letras.':'Nenhum produto encontrado.',false);return null}
  return pdvAdd(ex,q);
}
function pdvAdd(p,q){
  const sq=$('#s_q');if(sq)sq.value=q;addProd(p.id);
  const st=+p.stock||0,i=cart.find(x=>x.id===p.id),over=i&&i.qty>st;
  const t='Adicionado: '+(q>1?q+' × ':'')+p.name+(over?' · atenção: estoque '+st:'');pdvMsg(t,!over);return t;
}
function pdvScanned(code){return pdvCode(code)||('Código '+digits(code)+' não cadastrado.')}
function pdvEnter(){const r=pdvCode($('#p_q').value);if(r){$('#p_q').value='';pdvSearch()}$('#p_q').focus()}
let _kb='',_kt=0;
document.addEventListener('keydown',e=>{

  const k=e.key,tag=(document.activeElement&&document.activeElement.tagName)||'';

    const n=Date.now();if(n-_kt>120)_kb='';_kt=n;
    if(k==='Enter'){if(_kb.length>=6){e.preventDefault();pdvCode(_kb)}_kb=''}
    else if(k.length===1&&/[0-9*xX]/.test(k))_kb+=k;else _kb='';
  }
});

/* ----- cálculo do carrinho: espelha o servidor (desconto por item + desconto da venda rateado, preço unitário em centavos) ----- */
const r2=x=>Math.round((+x+1e-9)*100)/100;
let saleDisc={mode:'val',val:0};
function cartCalc(t){
  t=t||($('#s_t')&&$('#s_t').value)||'avista';
  const L=cart.map(i=>{const p=P.find(x=>x.id===i.id)||{},u=unit(p,t),q=i.qty,ld=Math.min(Math.max(+i.disc||0,0),Math.max(u*q-0.01*q,0));return{i,p,q,u,net:u*q-ld,ld}});
  const gross=L.reduce((a,l)=>a+l.u*l.q,0),sumnet=L.reduce((a,l)=>a+l.net,0);
  let sd=saleDisc.mode==='pct'?sumnet*(+saleDisc.val||0)/100:(+saleDisc.val||0);
  sd=r2(Math.min(Math.max(sd,0),Math.max(sumnet-0.01*L.length,0)));let rest=sd,tot=0;
  L.forEach((l,k)=>{const share=k===L.length-1?rest:r2(sd*l.net/(sumnet||1));rest=r2(rest-share);l.un=Math.max(r2((l.net-share)/l.q),0.01);l.line=r2(l.un*l.q);tot+=l.line});
  tot=r2(tot);return{L,gross:r2(gross),total:tot,disc:r2(gross-tot),sd}
}

function askAdmin(valor){
  return new Promise(res=>{
    window.__askRes=res;
    modal(`<h2>Autorização do administrador</h2><p>Desconto de <b>${R(valor)}</b> para <b>${esc(ME.name)}</b>.</p>
    <form onsubmit="askAdminGo(event,${valor})"><label for="ad_e">E-mail do administrador</label><input id="ad_e" type="email" autocomplete="off" required>
    <label for="ad_p">Senha do administrador</label><input id="ad_p" type="password" autocomplete="off" required>
    <div id="ad_2" style="display:none"><label for="ad_c">Código do autenticador (2 etapas)</label><input id="ad_c" inputmode="numeric" maxlength="6" autocomplete="off"></div>
    <p id="ad_m" class="bad" role="alert" style="min-height:1.3em"></p><div class="bar"><button class="btn" id="ad_b">Autorizar</button><button type="button" class="btn g" onclick="askAdminX()">Cancelar</button></div></form>`);
    setTimeout(()=>$('#ad_e')&&$('#ad_e').focus(),50);
  });
}
function askAdminX(){closeM();const r=window.__askRes;window.__askRes=null;r&&r(null)}
let adC=null;
async function askAdminGo(ev,valor){
  ev.preventDefault();const m=$('#ad_m'),b=$('#ad_b');m.textContent='';b.disabled=true;
  try{
    if(!adC){adC=supabase.createClient(CFG.URL,CFG.KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'mm-pdv-auth'}});
      const{error}=await adC.auth.signInWithPassword({email:$('#ad_e').value.trim(),password:$('#ad_p').value});if(error){adC=null;throw new Error('E-mail ou senha do administrador incorretos.')}}
    const{data:a}=await adC.auth.mfa.getAuthenticatorAssuranceLevel();
    if(a&&a.nextLevel==='aal2'&&a.currentLevel!=='aal2'){
      const code=$('#ad_c').value.trim();$('#ad_2').style.display='';
      if(!code){b.disabled=false;m.textContent='Digite o código do autenticador do administrador.';return}
      const{data:f}=await adC.auth.mfa.listFactors(),t=(f.totp||[]).find(x=>x.status==='verified');
      const{error}=await adC.auth.mfa.challengeAndVerify({factorId:t.id,code});if(error)throw new Error('Código incorreto.');
    }
    const{data,error}=await adC.rpc('pdv_autorizar_desconto',{p_seller:ME.id,p_value:valor});
    if(error)throw new Error(/Somente o administrador/.test(error.message)?'Este usuário não é administrador.':error.message);
    try{await adC.auth.signOut()}catch(e){}adC=null;closeM();const r=window.__askRes;window.__askRes=null;r&&r(data);
  }catch(e){try{if(adC){await adC.auth.signOut()}}catch(x){}adC=null;m.textContent=e.message||'Não foi possível autorizar.';b.disabled=false}
}

let finishing=false;
async function finish(){
  if(finishing)return;
  if(!cart.length)return alert('Adicione ao menos um produto.');
  const t=s_t.value,cc=cartCalc(t),tot=cc.total,e=t==='crediario'?+s_e.value||0:0,n=t==='crediario'?+s_n.value||1:1,nm=c_n.value.trim(),cfg=ME.cfg||{};
  if(t==='crediario'){
    if(nm.length<2)return alert('Carnê exige o nome do cliente.');
    if(e<0||e>=tot)return alert('A entrada precisa ser menor que o total.');
    if(!(n>=1&&n<=maxInst()))return alert('Número de parcelas inválido. Máximo para estes itens: '+maxInst()+'.');
    if(!s_d.value)return alert('Informe o 1º vencimento.');

      customer:nm?{id:selCli||null,name:nm,cpf:c_c.value.trim(),phone:c_p.value.trim()}:null,items:cart.map(i=>({id:i.id,qty:i.qty,disc_val:+i.disc||0}))};

    Q.push(sale);saveQ();
    cart.forEach(i=>{const p=P.find(x=>x.id===i.id);if(p)p.stock=(+p.stock||0)-i.qty});LS.set('pdv_prod',P);
    cart=[];saleDisc={mode:'val',val:0};window.lastRec=rec;

    <div class="f"><div class="w"><label>WhatsApp do cliente (para enviar o recibo)</label><input id="wa_n" inputmode="tel" placeholder="(93) 99999-0000" value="${esc((rec.customer&&rec.customer.phone)||'')}"></div></div>
    <div class="bar"><button class="btn" onclick="cupomPrint()">Imprimir cupom</button><button class="btn g" onclick="reciboWa()">Enviar recibo no WhatsApp</button><button class="btn g" onclick="closeM();render()">Nova venda</button></div>`);
    sync();

  const off=navigator.onLine===false,c=CX&&CX.aberto?CX:null;

    $('#app').innerHTML=`<div class="box" style="max-width:520px"><h2>Caixa fechado</h2><p class="sm">Conte o dinheiro que está na gaveta e informe o valor inicial (troco). ${(ME.cfg||{}).exige_caixa?'<b>Para vender, o caixa precisa estar aberto.</b>':''}</p>

    <div class="bar"><button class="btn" onclick="cxAbrir()" ${off?'disabled':''}>Abrir caixa</button></div></div>`;return;
  }
  const k=c.calc||{},rec=k.recebido||{},tot=Object.values(rec).reduce((a,b)=>a+ +b,0);
  $('#app').innerHTML=`<div class="prices"><div class="pr"><span>Aberto desde</span><b>${new Date(c.aberto_em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</b></div>
   <div class="pr"><span>Valor inicial</span><b>${R(k.abertura)}</b></div><div class="pr"><span>Vendido neste caixa</span><b>${R(tot)}</b></div><div class="pr"><span>Retiradas (sangria)</span><b>${R(k.sangrias)}</b></div></div>
  ${off?'<p class="bad">Sem internet: os números abaixo podem estar desatualizados e o caixa não pode ser fechado agora.</p>':''}
  <div class="box"><h3>Recebido por forma de pagamento</h3><table>${mtxt(rec)}</table>
   ${Object.keys(k.estornos||{}).length||Object.keys(k.devolucoes||{}).length?`<p class="sm">Devoluções e estornos já descontados: ${R(Object.values(k.estornos||{}).reduce((a,b)=>a+ +b,0)+Object.values(k.devolucoes||{}).reduce((a,b)=>a+ +b,0))}</p>`:''}
   <p class="sm">Vendas feitas sem internet só aparecem aqui depois de enviadas.</p></div>
  <div class="box"><h3>Retiradas e reforços</h3>${(c.movimentos||[]).length?`<table>${c.movimentos.map(m=>`<tr><td>${new Date(m.at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</td><td>${m.kind==='sangria'?'Sangria':'Suprimento'}</td><td>${esc(m.reason||'')}</td><td style="text-align:right">${m.kind==='sangria'?'−':'+'}${R(m.amount)}</td></tr>`).join('')}</table>`:'<p class="sm">Nenhum movimento.</p>'}
   <div class="bar"><button class="btn g s" onclick="cxMov('sangria')" ${off?'disabled':''}>Sangria (retirar dinheiro)</button><button class="btn g s" onclick="cxMov('suprimento')" ${off?'disabled':''}>Suprimento (colocar troco)</button></div></div>
  <div class="box"><h3>Fechar o caixa</h3><p class="sm">Conte o dinheiro da gaveta e digite o total. O sistema compara com o que deveria ter e registra a diferença para o administrador.</p>
   <div class="f"><div><label for="cx_c">Dinheiro contado na gaveta (R$)</label><input id="cx_c" type="number" step="0.01" min="0" inputmode="decimal"></div><div class="w"><label for="cx_n">Observação (opcional)</label><input id="cx_n"></div></div>
   <div class="bar"><button class="btn" onclick="cxFechar()" ${off?'disabled':''}>Fechar caixa</button></div></div>`;
}
async function cxAbrir(){
  const v=+$('#cx_o').value;if(!(v>=0))return alert('Informe o valor inicial (pode ser zero).');
  const{error}=await sb.rpc('pdv_caixa_abrir',{p_opening:v});if(error)return alert(error.message);
  await loadCx();render();
}
function cxMov(kind){
  modal(`<h2>${kind==='sangria'?'Sangria':'Suprimento'}</h2><p class="sm">${kind==='sangria'?'Retirada de dinheiro da gaveta (ex.: levar ao banco).':'Dinheiro colocado na gaveta (ex.: troco).'}</p>
  <label for="mv_v">Valor (R$)</label><input id="mv_v" type="number" step="0.01" min="0.01" inputmode="decimal"><label for="mv_r">Motivo</label><input id="mv_r" placeholder="${kind==='sangria'?'Ex.: depósito no banco':'Ex.: troco'}">
  <div class="bar"><button class="btn" onclick="cxMovGo('${kind}')">Registrar</button></div>`);
}
async function cxMovGo(kind){
  const{error}=await sb.rpc('pdv_caixa_mov',{p_kind:kind,p_amount:+$('#mv_v').value,p_reason:$('#mv_r').value});
  if(error)return alert(error.message);closeM();await loadCx();paintCx();
}
async function cxFechar(){
  const v=$('#cx_c').value;if(v==='')return alert('Conte o dinheiro da gaveta e informe o valor.');
  if(mine().length&&!confirm('Há '+mine().length+' venda(s) ainda não enviada(s). Elas não entram neste fechamento. Fechar assim mesmo?'))return;
  if(!confirm('Fechar o caixa com R$ '+(+v).toFixed(2).replace('.',',')+' contados na gaveta?'))return;
  const{data,error}=await sb.rpc('pdv_caixa_fechar',{p_counted:+v,p_note:$('#cx_n').value});if(error)return alert(error.message);
  const d=+data.diferenca;window.lastFech={...data,seller:ME.name,at:now()};CX={aberto:false};LS.set('pdv_cx',CX);
  modal(`<h2>Caixa fechado</h2><table><tr><td>Esperado na gaveta</td><td style="text-align:right">${R(data.esperado)}</td></tr><tr><td>Contado</td><td style="text-align:right">${R(data.contado)}</td></tr>
  <tr><td><b>Diferença</b></td><td style="text-align:right"><b class="${Math.abs(d)<0.01?'ok':'bad'}">${Math.abs(d)<0.01?'Confere':(d<0?'Falta ':'Sobra ')+R(Math.abs(d))}</b></td></tr></table>
  <p class="sm">${Math.abs(d)<0.01?'':'O administrador foi avisado da diferença.'}</p><div class="bar"><button class="btn" onclick="fechPrint()">Imprimir resumo</button><button class="btn g" onclick="closeM();render()">OK</button></div>`);
}
function fechPrint(){
  const f=window.lastFech;if(!f)return;const c=f.calc||{},rec=c.recebido||{},co=CO||{};
  printHtml(`<!doctype html><meta charset="utf-8"><title>Fechamento</title><style>@page{margin:3mm}body{font:12px/1.35 monospace;width:72mm;margin:0;color:#000}h1{font-size:14px;text-align:center;margin:0}.c{text-align:center}hr{border:0;border-top:1px dashed #000;margin:6px 0}table{width:100%;border-collapse:collapse}td:last-child{text-align:right}</style>
  <h1>${esc(co.trade_name||co.legal_name||'MultMix')}</h1><div class="c"><b>FECHAMENTO DE CAIXA</b><br>${new Date(f.at).toLocaleString('pt-BR')}<br>Vendedor: ${esc(f.seller)}</div><hr>
  <table><tr><td>Valor inicial</td><td>${R(c.abertura)}</td></tr>${Object.entries(rec).map(([k,v])=>`<tr><td>Vendas ${esc(k)}</td><td>${R(v)}</td></tr>`).join('')}
  <tr><td>Suprimentos</td><td>${R(c.suprimentos)}</td></tr><tr><td>Sangrias</td><td>${R(c.sangrias)}</td></tr></table><hr>
  <table><tr><td>Esperado (dinheiro)</td><td>${R(f.esperado)}</td></tr><tr><td>Contado</td><td>${R(f.contado)}</td></tr><tr><td><b>Diferença</b></td><td><b>${R(f.diferenca)}</b></td></tr></table><hr><div class="c">Assinatura: ____________________</div>`);
}
/* ----- troca e devolução ----- */
function devOpen(id){
  const s=MY.find(x=>x.id===id);if(!s)return;const cfg=ME.cfg||{},dias=+cfg.devolucao_dias||7;
  if(s.pay_type==='crediario'&&ME.role!=='admin')return alert('Venda no carnê: procure o administrador para fazer a devolução.');
  if(ME.role!=='admin'&&(Date.now()-new Date(s.created_at))/864e5>dias)return alert('Prazo de devolução vencido ('+dias+' dias). Procure o administrador.');
  if(navigator.onLine===false)return alert('A devolução precisa de internet. Conecte-se e tente de novo.');
  window.devSale=s;
  modal(`<h2>Troca / devolução</h2><p class="sm">Venda de ${fmtD(ld(s.created_at))} · ${R(s.total)}${s.devolvido>0?' · já devolvido '+R(s.devolvido):''}</p>
  ${s.fiscal_status==='emitida'?'<p class="bad">Atenção: já existe nota fiscal emitida. O administrador será avisado para tratar a nota.</p>':''}
  <div id="dv_l">${(s.items||[]).map((i,k)=>`<div class="citem" style="grid-template-columns:minmax(0,1fr) 90px"><div class="cn"><b>${esc(i.name)}</b><span class="sm">${i.qty} × ${R(i.price)}</span></div><input type="number" min="0" max="${i.qty}" value="0" id="dv_${k}" inputmode="numeric" aria-label="Quantidade devolvida"></div>`).join('')}</div>
  <div class="f"><div class="w"><label for="dv_r">Motivo</label><input id="dv_r" placeholder="Ex.: defeito, tamanho errado"></div>
  <div><label for="dv_m">Devolver o valor em</label><select id="dv_m"><option>Dinheiro</option><option>Pix</option><option>Cartão</option><option value="Troca">Troca (sem devolver dinheiro)</option></select></div></div>
  <p class="sm">Na troca, o produto volta ao estoque e você registra a nova venda normalmente.</p>
  <div class="bar"><button class="btn" onclick="devSend()">Registrar</button></div>`);
}
async function devSend(){
  const s=window.devSale,items=[];(s.items||[]).forEach((i,k)=>{const q=Math.round(+$('#dv_'+k).value||0);if(q>0)items.push({id:i.id,qty:Math.min(q,i.qty)})});
  if(!items.length)return alert('Informe a quantidade de pelo menos um item.');
  const m=$('#dv_m').value;
  const{data,error}=await sb.rpc('pdv_devolucao',{p:{id:uid(),sale_id:s.id,items,reason:$('#dv_r').value,refund_method:m}});
  if(error)return alert(error.message);
  closeM();alert(m==='Troca'?'Troca registrada: o produto voltou ao estoque. Registre a nova venda.':'Devolução registrada: '+R(data.valor)+(data.venda_cancelada?' (venda cancelada)':'')+'.'+(data.fiscal_pendente?'\nO administrador foi avisado para tratar a nota fiscal.':''));
  await sync();await loadMine();if(m==='Troca')go('venda');else render();
}

/* ----- início ----- */
(async()=>{
  try{const{data}=await sb.auth.getSession();
    if(data&&data.session&&ME){if(await mfaNeeded()){view='login';vMfa();return}view='venda';render();sync();return}
    if(data&&data.session&&!ME){await start();return}
  }catch(e){}
  if(ME&&navigator.onLine===false){view='venda';render();setSync('offline · '+mine().length+' pendente(s)');return}
  ME=null;view='login';render();
})();

</script>
<script src="pwa.js" defer></script>
</body>
