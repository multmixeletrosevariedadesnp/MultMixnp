<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MultMix · Eletros e Variedades</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f3f7;--card:#fff;--ink:#101828;--mut:#667085;--line:#e4e7ec;--pri:#1f4fff;--tag:#ffc93c;--ok:#12805c;--bad:#c4321f}
@media(prefers-color-scheme:dark){:root{--bg:#0d1220;--card:#161d30;--ink:#eef1f8;--mut:#98a2b8;--line:#263050;--pri:#6f8cff;--tag:#ffc93c;--ok:#3ecf9a;--bad:#ff7a66}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 18px;flex-wrap:wrap}
header h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.5px}
header h1 span{background:var(--tag);color:#101828;padding:0 6px;border-radius:6px;margin-left:2px}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav button{background:transparent;border:0;color:#fff;opacity:.75;font:inherit;padding:6px 12px;border-radius:8px;cursor:pointer}
nav button.on{opacity:1;background:rgba(255,255,255,.18)}
main{max-width:1100px;margin:0 auto;padding:18px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.bar input{flex:1;min-width:200px;width:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 14px;border-radius:99px;cursor:pointer;font:inherit}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
.card:focus-visible,button:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.ph{aspect-ratio:4/3;background:var(--line) center/cover no-repeat;display:grid;place-items:center;color:var(--mut)}
.cb{padding:12px 14px 14px}.cb h3{margin:0 0 6px;font-size:16px;line-height:1.25}
.cash{display:inline-block;background:var(--tag);color:#101828;font-weight:800;font-size:20px;padding:1px 9px;border-radius:7px}
.sm{color:var(--mut);font-size:13px;margin-top:6px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.s{padding:4px 10px;font-size:13px}
#modal{position:fixed;inset:0;background:rgba(10,14,28,.6);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:20}
#modal.open{display:flex}
.box{background:var(--card);border-radius:16px;max-width:820px;width:100%;padding:20px;position:relative}
.x{position:absolute;right:12px;top:10px;font-size:24px;background:none;border:0;color:var(--mut);cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.main{aspect-ratio:1;background:var(--line) center/contain no-repeat;border-radius:12px}
.th{display:flex;gap:6px;margin-top:8px}.th div{width:56px;height:56px;border-radius:8px;background:var(--line) center/cover;cursor:pointer;border:2px solid transparent}
.th .on{border-color:var(--pri)}
.prices{display:grid;gap:8px;margin:14px 0}
.pr{display:flex;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.pr b{font-size:18px}.pr.k{background:var(--tag);color:#101828;border-color:var(--tag)}
table{width:100%;border-collapse:collapse}td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:10px}
.f label{font-size:13px;color:var(--mut);display:block}.w{grid-column:1/-1}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.sync{font-size:12px;opacity:.85}
@media print{header,.noprint{display:none}}
</style>
</head>
<body>
<header>
  <h1>Mult<span>Mix</span></h1>
  <span class="sync" id="sync"></span>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<div id="modal"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ========= CONFIG: preencha com os dados do seu projeto Supabase ========= */
const CFG={URL:'https://meswiziqgcjwxslbgmeu.supabase.co',KEY:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1lc3dpemlxZ2Nqd3hzbGJnbWV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzODg2NDcsImV4cCI6MjEwNzk2NDY0N30.ltoM4-4Z-vK8fYoZXaa7fKLBMOc0RBXrAsQlmlPW6x4',WHATS:'5593999999999',BUCKET:'produtos'};
/* Sem URL/KEY o sistema roda em modo demonstração (só neste navegador). */

const sb=CFG.URL?supabase.createClient(CFG.URL,CFG.KEY):null;
const T=['products','customers','sales','installments'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const uid=()=>crypto.randomUUID();
const now=()=>new Date().toISOString();

/* ========= Banco local (cache offline) + fila de sincronização ========= */
let db;
try{db=JSON.parse(localStorage.mm)}catch(e){}
if(!db){db={products:[],customers:[],sales:[],installments:[],outbox:[]};
 [['Smart TV 50" 4K','Eletros',2399,2599,2899,['Tela: 50" LED 4K','Smart: Android TV','HDMI: 3 portas','Voltagem: Bivolt'],'Tela 4K com apps de streaming.'],
  ['Liquidificador 900W','Cozinha',169,179,199,['Potência: 900W','Copo: 2,2 L','Lâminas: aço inox','Voltagem: 127V'],'Potente e fácil de limpar.'],
  ['Ventilador de Mesa 40cm','Variedades',119,129,139,['Hélices: 6','Velocidades: 3','Potência: 80W'],'Silencioso, ideal para o calor.']
 ].forEach(p=>db.products.push({id:uid(),name:p[0],category:p[1],price_cash:p[2],price_card:p[3],price_credit:p[4],max_inst:10,stock:10,active:true,specs:p[5].map(s=>{const[k,...v]=s.split(':');return{k,v:v.join(':').trim()}}),photos:[],description:p[6],ncm:'',cfop:'5102',unit:'UN'}));}
const save=()=>localStorage.mm=JSON.stringify(db);
let session=null;
const isAdmin=()=>!sb||!!session;

function put(t,row){ // grava local + fila
  row.updated_at=now();
  const i=db[t].findIndex(r=>r.id===row.id);
  i<0?db[t].push(row):db[t][i]=row;
  if(sb)db.outbox.push({t,row});
  save();sync();
}
async function sync(){
  if(!sb)return setSync('modo demo (local)');
  try{
    if(session){
      while(db.outbox.length){const o=db.outbox[0];
        const{error}=await sb.from(o.t).upsert(o.row);if(error)throw error;db.outbox.shift();save();}
    }
    for(const t of session?T:['products']){
      const{data,error}=await sb.from(t).select('*');if(error)throw error;
      if(!db.outbox.length)db[t]=data;
    }
    save();setSync('sincronizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){setSync('offline · '+db.outbox.length+' pendente(s)')}
  render();
}
const setSync=t=>$('#sync').textContent=t;
addEventListener('online',sync);

/* ========= Navegação ========= */
let view='cat',cat='Todos',q='';
function go(v){view=v;render()}
function render(){
  const tabs=[['cat','Catálogo']];
  if(isAdmin())tabs.push(['prod','Produtos'],['pdv','Nova venda'],['cli','Clientes'],['car','Carnês']);
  tabs.push(sb&&!session?['login','Entrar']:sb?['out','Sair']:['','']);
  $('#nav').innerHTML=tabs.filter(t=>t[0]).map(t=>`<button class="${view===t[0]?'on':''}" onclick="${t[0]==='out'?'logout()':`go('${t[0]}')`}">${t[1]}</button>`).join('');
  ({cat:vCat,prod:vProd,pdv:vPdv,cli:vCli,car:vCar,login:vLogin}[view]||vCat)();
}

/* ========= Catálogo público ========= */
const prices=p=>({cash:+p.price_cash,card:+(p.price_card||p.price_cash),cred:+(p.price_credit||p.price_card||p.price_cash)});
function vCat(){
  const act=db.products.filter(p=>p.active!==false);
  const cats=['Todos',...new Set(act.map(p=>p.category).filter(Boolean))];
  const list=act.filter(p=>(cat==='Todos'||p.category===cat)&&p.name.toLowerCase().includes(q.toLowerCase()));
  $('#app').innerHTML=`<div class="bar"><input id="q" placeholder="Buscar produto" value="${esc(q)}" oninput="q=this.value;vCatList()"></div>
  <div class="chips">${cats.map(c=>`<button class="chip ${c===cat?'on':''}" onclick="cat='${esc(c)}';render()">${esc(c)}</button>`).join('')}</div>
  <div class="grid" id="list"></div>`;
  vCatList();
}
function vCatList(){
  const list=db.products.filter(p=>p.active!==false&&(cat==='Todos'||p.category===cat)&&p.name.toLowerCase().includes(q.toLowerCase()));
  $('#list').innerHTML=list.map(p=>{const pr=prices(p);return`<div class="card" tabindex="0" onclick="detail('${p.id}')" onkeydown="if(event.key==='Enter')detail('${p.id}')">
   <div class="ph" style="${p.photos?.[0]?`background-image:url('${esc(p.photos[0])}')`:''}">${p.photos?.[0]?'':'sem foto'}</div>
   <div class="cb"><h3>${esc(p.name)}</h3><span class="cash">${R(pr.cash)}</span> <small>à vista</small>
   <div class="sm">Cartão ${R(pr.card)} · Carnê ${p.max_inst||10}x de ${R(pr.cred/(p.max_inst||10))}</div></div></div>`}).join('')||'<p>Nenhum produto encontrado.</p>';
}
function detail(id){
  const p=db.products.find(x=>x.id===id),pr=prices(p),ph=p.photos||[];
  const msg=encodeURIComponent(`Olá! Tenho interesse em: ${p.name}`);
  modal(`<div class="two"><div><div class="main" id="mi" style="${ph[0]?`background-image:url('${esc(ph[0])}')`:''}"></div>
   <div class="th">${ph.map((u,i)=>`<div class="${i?'':'on'}" style="background-image:url('${esc(u)}')" onclick="mi.style.backgroundImage=\`url('${esc(u)}')\`;document.querySelectorAll('.th div').forEach(d=>d.classList.remove('on'));this.classList.add('on')"></div>`).join('')}</div></div>
   <div><h2 style="margin:0 0 4px">${esc(p.name)}</h2><span class="tag">${esc(p.category||'')}</span>
   <p>${esc(p.description)}</p>
   <div class="prices"><div class="pr k"><span>À vista</span><b>${R(pr.cash)}</b></div>
   <div class="pr"><span>Cartão</span><b>${R(pr.card)}</b></div>
   <div class="pr"><span>Carnê até ${p.max_inst||10}x</span><b>${R(pr.cred/(p.max_inst||10))}</b></div></div>
   <a class="btn" target="_blank" rel="noopener" href="https://wa.me/${CFG.WHATS}?text=${msg}">Chamar no WhatsApp</a></div></div>
   ${(p.specs||[]).length?`<h3>Especificações</h3><table>${p.specs.map(s=>`<tr><th>${esc(s.k)}</th><td>${esc(s.v)}</td></tr>`).join('')}</table>`:''}`);
}
function modal(h){$('#modal').innerHTML=`<div class="box"><button class="x" aria-label="Fechar" onclick="closeM()">×</button>${h}</div>`;$('#modal').classList.add('open')}
function closeM(){$('#modal').classList.remove('open')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};

/* ========= Login ========= */
function vLogin(){$('#app').innerHTML=`<div class="box" style="margin:auto"><h2>Entrar na equipe</h2>
 <div class="f"><div class="w"><label>E-mail</label><input id="em" type="email"></div><div class="w"><label>Senha</label><input id="pw" type="password"></div></div>
 <button class="btn" onclick="login()">Entrar</button> <span id="err" class="bad"></span></div>`}
async function login(){
  const{data,error}=await sb.auth.signInWithPassword({email:em.value,password:pw.value});
  if(error)return err.textContent='E-mail ou senha incorretos.';
  session=data.session;view='prod';sync();
}
async function logout(){await sb.auth.signOut();session=null;view='cat';render()}

/* ========= Produtos (admin) ========= */
function vProd(){
  $('#app').innerHTML=`<div class="bar"><button class="btn" onclick="prodForm()">Novo produto</button></div>
  <table><tr><th>Produto</th><th>À vista</th><th>Cartão</th><th>Carnê</th><th>Estoque</th><th></th></tr>
  ${db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${R(p.price_cash)}</td><td>${R(p.price_card)}</td><td>${R(p.price_credit)}</td><td>${p.stock}</td>
  <td><button class="btn g s" onclick="prodForm('${p.id}')">Editar</button></td></tr>`).join('')}</table>`;
}
function prodForm(id){
  const p=db.products.find(x=>x.id===id)||{photos:[],specs:[],max_inst:10,stock:0,cfop:'5102',unit:'UN',active:true};
  const v=(k)=>esc(p[k]??'');
  modal(`<h2>${id?'Editar':'Novo'} produto</h2><div class="f">
   <div class="w"><label>Nome</label><input id="f_name" value="${v('name')}"></div>
   <div><label>Categoria</label><input id="f_category" value="${v('category')}"></div>
   <div><label>Estoque</label><input id="f_stock" type="number" value="${v('stock')}"></div>
   <div><label>Preço à vista</label><input id="f_price_cash" type="number" step="0.01" value="${v('price_cash')}"></div>
   <div><label>Preço cartão</label><input id="f_price_card" type="number" step="0.01" value="${v('price_card')}"></div>
   <div><label>Preço carnê (total)</label><input id="f_price_credit" type="number" step="0.01" value="${v('price_credit')}"></div>
   <div><label>Máx. parcelas</label><input id="f_max_inst" type="number" value="${v('max_inst')}"></div>
   <div class="w"><label>Descrição</label><textarea id="f_description" rows="2">${v('description')}</textarea></div>
   <div class="w"><label>Especificações (uma por linha, formato Nome: valor)</label><textarea id="f_specs" rows="4">${(p.specs||[]).map(s=>s.k+': '+s.v).join('\n')}</textarea></div>
   <div class="w"><label>Fotos (até 5, um link por linha)</label><textarea id="f_photos" rows="3">${(p.photos||[]).join('\n')}</textarea>
   ${sb?'<input type="file" id="up" accept="image/*" multiple onchange="upload(this)">':''}</div>
   <div><label>NCM (fiscal)</label><input id="f_ncm" value="${v('ncm')}"></div>
   <div><label>CFOP</label><input id="f_cfop" value="${v('cfop')}"></div>
   <div><label>Unidade</label><input id="f_unit" value="${v('unit')}"></div>
   <div><label>No catálogo?</label><select id="f_active"><option value="true" ${p.active!==false?'selected':''}>Sim</option><option value="false" ${p.active===false?'selected':''}>Não</option></select></div></div>
   <button class="btn" onclick="saveProd('${p.id||''}')">Salvar produto</button>`);
}
async function upload(inp){
  const ta=$('#f_photos');
  for(const f of [...inp.files]){
    if(ta.value.split('\n').filter(Boolean).length>=5)break;
    const path=uid()+'-'+f.name.replace(/[^\w.]/g,'_');
    const{error}=await sb.storage.from(CFG.BUCKET).upload(path,f);
    if(!error)ta.value+=(ta.value?'\n':'')+sb.storage.from(CFG.BUCKET).getPublicUrl(path).data.publicUrl;
  }
}
function saveProd(id){
  const g=k=>$('#f_'+k).value.trim();
  if(!g('name')||!g('price_cash'))return alert('Informe nome e preço à vista.');
  put('products',{id:id||uid(),name:g('name'),category:g('category'),description:g('description'),
   price_cash:+g('price_cash'),price_card:+g('price_card')||+g('price_cash'),price_credit:+g('price_credit')||+g('price_card')||+g('price_cash'),
   max_inst:+g('max_inst')||10,stock:+g('stock')||0,active:g('active')==='true',ncm:g('ncm'),cfop:g('cfop'),unit:g('unit'),
   specs:g('specs').split('\n').filter(Boolean).map(l=>{const[k,...v]=l.split(':');return{k:k.trim(),v:v.join(':').trim()}}),
   photos:g('photos').split('\n').map(s=>s.trim()).filter(Boolean).slice(0,5)});
  closeM();render();
}

/* ========= Nova venda (PDV) ========= */
let cart=[];
function vPdv(){
  $('#app').innerHTML=`<div class="box" style="max-width:none"><h2>Nova venda</h2>
  <div class="f"><div class="w"><label>Produto</label><select id="s_p">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} · estoque ${p.stock}</option>`).join('')}</select></div>
  <div><label>Qtd</label><input id="s_q" type="number" min="1" value="1"></div>
  <div style="align-self:end"><button class="btn g" onclick="addCart()">Adicionar</button></div></div>
  <div id="cartv"></div>
  <div class="f"><div><label>Forma de pagamento</label><select id="s_t" onchange="cartView()"><option value="avista">À vista</option><option value="cartao">Cartão</option><option value="crediario">Carnê (crediário)</option></select></div>
  <div class="cr"><label>Entrada</label><input id="s_e" type="number" step="0.01" value="0" oninput="cartView()"></div>
  <div class="cr"><label>Parcelas</label><input id="s_n" type="number" min="1" max="24" value="6" oninput="cartView()"></div>
  <div class="cr"><label>1º vencimento</label><input id="s_d" type="date" value="${new Date(Date.now()+30*864e5).toISOString().slice(0,10)}"></div></div>
  <div class="f"><div><label>Cliente</label><input id="c_n" list="cl_dl" oninput="fillCli(this)"><datalist id="cl_dl">${db.customers.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist></div><div><label>CPF</label><input id="c_c"></div><div><label>Telefone</label><input id="c_p"></div></div>
  <button class="btn" onclick="finish()">Finalizar venda</button></div>`;cartView();
}
const unit=(p,t)=>t==='avista'?p.price_cash:t==='cartao'?(p.price_card||p.price_cash):(p.price_credit||p.price_card||p.price_cash);
const total=()=>cart.reduce((s,i)=>s+unit(db.products.find(p=>p.id===i.id),$('#s_t')?.value||'avista')*i.qty,0);
function addCart(){const i=cart.find(x=>x.id===s_p.value);i?i.qty+=+s_q.value:cart.push({id:s_p.value,qty:+s_q.value});cartView()}
function cartView(){
  const t=$('#s_t').value,tot=total(),e=+$('#s_e').value||0,n=+$('#s_n').value||1;
  document.querySelectorAll('.cr').forEach(d=>d.style.display=t==='crediario'?'':'none');
  $('#cartv').innerHTML=`<table>${cart.map((i,ix)=>{const p=db.products.find(x=>x.id===i.id);return`<tr><td>${esc(p.name)}</td><td>${i.qty} × ${R(unit(p,t))}</td><td><button class="btn g s" onclick="cart.splice(${ix},1);cartView()">Remover</button></td></tr>`}).join('')}</table>
  <p><b>Total: ${R(tot)}</b>${t==='crediario'&&tot?` · restante ${n}x de ${R((tot-e)/n)}`:''}</p>`;
}
function finish(){
  if(!cart.length)return alert('Adicione ao menos um produto.');
  const t=s_t.value,tot=total(),e=t==='crediario'?+s_e.value||0:0,n=t==='crediario'?+s_n.value||1:1;
  let cid=null;
  if(c_n.value.trim()){
    let c=db.customers.find(x=>(c_c.value&&x.cpf===c_c.value)||x.name===c_n.value.trim())||{id:uid()};
    Object.assign(c,{name:c_n.value.trim(),cpf:c_c.value.trim(),phone:c_p.value.trim()});put('customers',c);cid=c.id;
  }else if(t==='crediario')return alert('Carnê exige o nome do cliente.');
  const sale={id:uid(),customer_id:cid,pay_type:t,total:tot,entry:e,n_inst:n,fiscal_status:'pendente',created_at:now(),
   items:cart.map(i=>{const p=db.products.find(x=>x.id===i.id);return{id:p.id,name:p.name,qty:i.qty,price:unit(p,t),ncm:p.ncm,cfop:p.cfop,unit:p.unit}})};
  put('sales',sale);
  cart.forEach(i=>{const p=db.products.find(x=>x.id===i.id);put('products',{...p,stock:p.stock-i.qty})});
  if(t==='crediario'){
    const per=Math.floor((tot-e)/n*100)/100;let d=new Date(s_d.value+'T12:00');
    for(let k=1;k<=n;k++){
      put('installments',{id:uid(),sale_id:sale.id,number:k,due_date:d.toISOString().slice(0,10),amount:k===n?+((tot-e)-per*(n-1)).toFixed(2):per,paid_at:null});
      d=new Date(d);d.setMonth(d.getMonth()+1);
    }
  }
  cart=[];alert('Venda registrada.');view=t==='crediario'?'car':'pdv';render();
}

/* ========= Clientes ========= */
let cq='';
const digits=v=>(v||'').replace(/\D/g,'');
const owed=id=>db.installments.filter(i=>!i.paid_at&&db.sales.some(s=>s.id===i.sale_id&&s.customer_id===id));
function vCli(){
  $('#app').innerHTML=`<div class="bar"><input placeholder="Buscar por nome, CPF ou telefone" value="${esc(cq)}" oninput="cq=this.value;cliList()"><button class="btn" onclick="cliForm()">Novo cliente</button></div><div id="cl" style="overflow:auto"></div>`;cliList();
}
function cliList(){
  const k=cq.toLowerCase(),d=digits(cq),today=now().slice(0,10);
  const l=db.customers.filter(c=>c.name.toLowerCase().includes(k)||(d&&(digits(c.cpf).includes(d)||digits(c.phone).includes(d)))).sort((a,b)=>a.name.localeCompare(b.name));
  $('#cl').innerHTML=l.length?`<table><tr><th>Nome</th><th>CPF</th><th>Telefone</th><th>Em aberto</th><th></th></tr>${l.map(c=>{const o=owed(c.id),late=o.some(i=>i.due_date<today);
  return`<tr><td>${esc(c.name)}</td><td>${esc(c.cpf)}</td><td>${esc(c.phone)}</td>
  <td>${o.length?`<span class="${late?'bad':''}">${R(o.reduce((s,i)=>s+i.amount,0))} (${o.length} parc.)</span>`:'<span class="ok">Em dia</span>'}</td>
  <td><button class="btn g s" onclick="cliForm('${c.id}')">Abrir</button></td></tr>`}).join('')}</table>`:'<p>Nenhum cliente encontrado. Use "Novo cliente" para cadastrar.</p>';
}
function cliForm(id){
  const c=db.customers.find(x=>x.id===id)||{},v=k=>esc(c[k]??''),hist=id?db.sales.filter(s=>s.customer_id===id).sort((a,b)=>b.created_at.localeCompare(a.created_at)):[];
  modal(`<h2>${id?'Cliente':'Novo cliente'}</h2><div class="f">
   <div class="w"><label>Nome completo</label><input id="k_name" value="${v('name')}"></div>
   <div><label>CPF</label><input id="k_cpf" inputmode="numeric" value="${v('cpf')}"></div>
   <div><label>Telefone / WhatsApp</label><input id="k_phone" inputmode="tel" value="${v('phone')}"></div>
   <div class="w"><label>Endereço</label><input id="k_address" value="${v('address')}"></div></div>
   <button class="btn" onclick="saveCli('${id||''}')">Salvar cliente</button>
   ${c.phone?` <a class="btn g" target="_blank" rel="noopener" href="https://wa.me/55${digits(c.phone)}">WhatsApp</a>`:''}
   ${hist.length?`<h3>Compras</h3><table>${hist.map(s=>`<tr><td>${s.created_at.slice(0,10).split('-').reverse().join('/')}</td><td>${{avista:'À vista',cartao:'Cartão',crediario:'Carnê'}[s.pay_type]}</td><td>${R(s.total)}</td>
   <td>${s.pay_type==='crediario'?`<button class="btn g s" onclick="carne('${s.id}')">Ver carnê</button>`:''}</td></tr>`).join('')}</table>`:''}`);
}
function saveCli(id){
  const g=k=>$('#k_'+k).value.trim();
  if(!g('name'))return alert('Informe o nome do cliente.');
  if(g('cpf')&&db.customers.some(x=>x.id!==id&&digits(x.cpf)===digits(g('cpf'))))return alert('Já existe um cliente com este CPF.');
  const c=db.customers.find(x=>x.id===id)||{id:uid()};
  put('customers',{...c,name:g('name'),cpf:g('cpf'),phone:g('phone'),address:g('address')});
  closeM();render();
}
function fillCli(inp){const c=db.customers.find(x=>x.name===inp.value);if(c){c_c.value=c.cpf||'';c_p.value=c.phone||''}}

/* ========= Carnês ========= */
function vCar(){
  const sales=db.sales.filter(s=>s.pay_type==='crediario').sort((a,b)=>b.created_at.localeCompare(a.created_at));
  $('#app').innerHTML=sales.length?`<table><tr><th>Cliente</th><th>Total</th><th>Parcelas pagas</th><th></th></tr>
  ${sales.map(s=>{const c=db.customers.find(x=>x.id===s.customer_id)||{},ins=db.installments.filter(i=>i.sale_id===s.id),late=ins.some(i=>!i.paid_at&&i.due_date<now().slice(0,10));
  return`<tr><td>${esc(c.name)} ${late?'<span class="tag bad">em atraso</span>':''}</td><td>${R(s.total)}</td><td>${ins.filter(i=>i.paid_at).length}/${ins.length}</td>
  <td><button class="btn g s" onclick="carne('${s.id}')">Abrir carnê</button></td></tr>`}).join('')}</table>`:'<p>Nenhum carnê ainda. Faça uma venda no crediário.</p>';
}
/* ========= Carnê com multa e juros ========= */
const ld=iso=>{const d=new Date(iso);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const days=d=>Math.floor((new Date(ld(now()))-new Date(d))/864e5);
function due(i){
  const dl=i.paid_at?0:days(i.due_date);
  if(dl<=0)return{v:+i.amount,fee:0,dl:0};
  const fee=+(i.amount*CFG.MULTA/100+i.amount*(CFG.JURO_MES/100)/30*dl).toFixed(2);
  return{v:+(i.amount+fee).toFixed(2),fee,dl};
}
const METHODS='<option>Dinheiro</option><option>Pix</option><option>Cartão débito</option><option>Cartão crédito</option>';
function carne(id){
  const s=db.sales.find(x=>x.id===id),c=db.customers.find(x=>x.id===s.customer_id)||{};
  const ins=db.installments.filter(i=>i.sale_id===id).sort((a,b)=>a.number-b.number);
  modal(`<h2>Carnê · ${esc(c.name)}</h2><p class="sm">${esc(c.phone||'')} · Total ${R(s.total)} · Entrada ${R(s.entry)} · Multa ${CFG.MULTA}% + juros ${CFG.JURO_MES}% ao mês após o vencimento</p>
  <div style="overflow:auto"><table><tr><th>Parcela</th><th>Vencimento</th><th>Valor</th><th>Hoje</th><th></th></tr>${ins.map(i=>{const d=due(i);return`<tr><td>${i.number}/${ins.length}</td>
  <td class="${d.dl>0?'bad':''}">${i.due_date.split('-').reverse().join('/')}${d.dl>0?`<div class="sm">${d.dl} dias de atraso</div>`:''}</td><td>${R(i.amount)}</td>
  <td>${i.paid_at?R(i.paid_amount||i.amount):`<b>${R(d.v)}</b>`}</td>
  <td>${i.paid_at?`<span class="ok">Paga${i.method?' · '+esc(i.method):''}</span>`:`<button class="btn s" onclick="payAsk('${i.id}','${id}')">Receber</button>`}</td></tr>`}).join('')}</table></div>
  <p><button class="btn g noprint" onclick="window.print()">Imprimir carnê</button></p>`);
}
function payAsk(iid,sid){
  const i=db.installments.find(x=>x.id===iid),d=due(i);
  modal(`<h2>Receber parcela ${i.number}</h2><p>Valor ${R(i.amount)}${d.fee?` + multa e juros ${R(d.fee)} (${d.dl} dias)`:''}</p>
  <div class="f"><div><label>Valor recebido</label><input id="pv" type="number" step="0.01" value="${d.v}"></div><div><label>Meio</label><select id="pm">${METHODS}</select></div></div>
  <button class="btn" onclick="pay('${iid}','${sid}')">Confirmar recebimento</button>`);
}
function pay(iid,sid){const i=db.installments.find(x=>x.id===iid);put('installments',{...i,paid_at:now(),paid_amount:+pv.value,method:pm.value});carne(sid);vCar()}

/* ========= Pedidos do catálogo ========= */
function vPed(){
  const l=[...db.orders].sort((a,b)=>b.created_at.localeCompare(a.created_at));
  const st={novo:'Novo',convertido:'Virou venda',cancelado:'Cancelado'};
  $('#app').innerHTML=l.length?`<div style="overflow:auto"><table><tr><th>Data</th><th>Cliente</th><th>Itens</th><th>Pagamento</th><th>Total</th><th>Status</th><th></th></tr>
  ${l.map(o=>`<tr><td>${new Date(o.created_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</td>
  <td>${esc(o.customer_name||'—')}<div class="sm">${esc(o.customer_phone||'')}</div></td>
  <td>${o.items.map(i=>`${i.qty}x ${esc(i.name)}`).join('<br>')}</td>
  <td>${{avista:'À vista',cartao:'Cartão',crediario:'Carnê '+(o.n_inst||1)+'x'}[o.pay_type]}</td><td>${R(o.total)}</td>
  <td><span class="tag ${o.status==='novo'?'ok':''}">${st[o.status]||o.status}</span></td>
  <td>${o.status==='novo'?`<button class="btn s" onclick="toSale('${o.id}')">Vender</button> <button class="btn g s" onclick="cancelOrder('${o.id}')">Cancelar</button>`:''}
  ${o.customer_phone?` <a class="btn g s" target="_blank" rel="noopener" href="https://wa.me/55${digits(o.customer_phone)}">WhatsApp</a>`:''}</td></tr>`).join('')}</table></div>`
  :'<p>Nenhum pedido ainda. Os pedidos feitos no catálogo aparecem aqui.</p>';
}
function toSale(id){
  const o=db.orders.find(x=>x.id===id);
  cart=o.items.filter(i=>db.products.some(p=>p.id===i.id)).map(i=>({id:i.id,qty:i.qty}));
  pre=o;fromOrder=id;go('pdv');
}
function cancelOrder(id){if(confirm('Cancelar este pedido?')){put('orders',{...db.orders.find(x=>x.id===id),status:'cancelado'});vPed()}}
setInterval(()=>{if(session&&view==='ped')sync()},30000);

/* ========= Caixa e relatórios ========= */
let cxd=ld(now());
function vCx(){
  const day=iso=>iso&&ld(iso)===cxd,by={},add=(m,v)=>by[m]=(by[m]||0)+v;
  const sd=db.sales.filter(s=>day(s.created_at));
  sd.forEach(s=>{const v=s.pay_type==='crediario'?+s.entry:+s.total;if(v)add(s.method||'Não informado',v)});
  db.installments.filter(i=>day(i.paid_at)).forEach(i=>add(i.method||'Não informado',+i.paid_amount||+i.amount));
  const tot=Object.values(by).reduce((a,b)=>a+b,0),today=ld(now()),mes=cxd.slice(0,7);
  const open=db.installments.filter(i=>!i.paid_at),late=open.filter(i=>i.due_date<today),sum=a=>a.reduce((s,i)=>s+i.amount,0);
  const vm=db.sales.filter(s=>ld(s.created_at).slice(0,7)===mes).reduce((s,x)=>s+ +x.total,0);
  $('#app').innerHTML=`<div class="bar"><input type="date" style="max-width:200px" value="${cxd}" onchange="cxd=this.value;vCx()"></div>
  <div class="prices"><div class="pr k"><span>Recebido no dia</span><b>${R(tot)}</b></div>
  ${Object.keys(by).map(m=>`<div class="pr"><span>${esc(m)}</span><b>${R(by[m])}</b></div>`).join('')}
  <div class="pr"><span>Vendas do dia</span><b>${sd.length}</b></div>
  <div class="pr"><span>Vendido no mês (${mes.split('-').reverse().join('/')})</span><b>${R(vm)}</b></div>
  <div class="pr"><span>Carnês a receber</span><b>${R(sum(open))}</b></div>
  <div class="pr"><span class="bad">Em atraso (${late.length} parcelas)</span><b class="bad">${R(sum(late))}</b></div></div>
  ${sd.length?`<h3>Vendas do dia</h3><table>${sd.map(s=>`<tr><td>${new Date(s.created_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</td><td>${esc((db.customers.find(c=>c.id===s.customer_id)||{}).name||'Balcão')}</td><td>${{avista:'À vista',cartao:'Cartão',crediario:'Carnê'}[s.pay_type]}</td><td>${R(s.total)}</td></tr>`).join('')}</table>`:''}`;
}

/* ========= Fiscal (controle de NFC-e) ========= */
function vFis(){
  const l=[...db.sales].sort((a,b)=>b.created_at.localeCompare(a.created_at));
  $('#app').innerHTML=`<p class="sm">A emissão automática da NFC-e exige um emissor homologado (por exemplo Focus NFe, eNotas ou Nuvem Fiscal) e certificado digital. Aqui você controla o que falta emitir e exporta os dados para o emissor ou contador.</p>
  <div class="bar"><button class="btn" onclick="csvFis()">Exportar pendentes (CSV)</button></div>
  <div style="overflow:auto"><table><tr><th>Data</th><th>Cliente</th><th>Total</th><th>Situação</th><th></th></tr>${l.map(s=>{const sn=s.items.filter(i=>!i.ncm).length;return`<tr>
  <td>${s.created_at.slice(0,10).split('-').reverse().join('/')}</td><td>${esc((db.customers.find(c=>c.id===s.customer_id)||{}).name||'Balcão')}</td><td>${R(s.total)}</td>
  <td>${s.fiscal_status==='emitida'?'<span class="ok">Emitida</span>':`Pendente${sn?` <span class="bad">· ${sn} item(ns) sem NCM</span>`:''}`}</td>
  <td>${s.fiscal_status==='emitida'?'':`<button class="btn g s" onclick="fisAsk('${s.id}')">Marcar emitida</button>`}</td></tr>`}).join('')}</table></div>`;
}
function fisAsk(id){modal(`<h2>Marcar como emitida</h2><label class="sm">Chave de acesso da nota (44 dígitos)</label><input id="fk" inputmode="numeric" maxlength="44"><p><button class="btn" onclick="fisSave('${id}')">Salvar</button></p>`)}
function fisSave(id){
  const k=digits(fk.value);if(k.length!==44)return alert('A chave de acesso tem 44 dígitos.');
  put('sales',{...db.sales.find(x=>x.id===id),fiscal_status:'emitida',fiscal_key:k});closeM();vFis();
}
function csvFis(){
  const rows=[['data','cliente','cpf','produto','ncm','cfop','un','qtd','valor_unit','valor_total']];
  db.sales.filter(s=>s.fiscal_status!=='emitida').forEach(s=>{const c=db.customers.find(x=>x.id===s.customer_id)||{};
    s.items.forEach(i=>rows.push([s.created_at.slice(0,10),c.name||'',c.cpf||'',i.name,i.ncm||'',i.cfop||'',i.unit||'UN',i.qty,i.price,(i.price*i.qty).toFixed(2)]))});
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='pendentes-fiscal.csv';a.click();
}

/* ========= Início ========= */
(async()=>{
  if(sb){const{data}=await sb.auth.getSession();session=data.session}
  render();sync();
})();
</script>
